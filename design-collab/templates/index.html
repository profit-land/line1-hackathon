        hItem.innerHTML = `
          ${hNumCol}
          <div class="tag-desc-text">${hMeta}<span class="tag-desc-inner">${fmtToHtml(hc.content, hc.mention_name)}</span></div>`;
        const hHideBtn = hItem.querySelector('[data-comment-hide]');
        if (hHideBtn) {
          hHideBtn.addEventListener('click', async () => {
            let nextHidden = !hc.hidden;
            try {
              const cidNum = String(hc.id).replace(/^c/i, ''); // "c14" → "14"
              await api(`/api/comments/${cidNum}/toggle-hidden`, { method: 'POST', body: JSON.stringify({ email: currentUserEmail() }) });
              hc.hidden = nextHidden;
              hHideBtn.classList.toggle('is-checked', nextHidden);
              hHideBtn.setAttribute('aria-checked', String(nextHidden));
              hHideBtn.title = nextHidden ? '다시 표시' : '해결 완료';
              if (!nextHidden) {
                // 다시 표시: hiddenComments에서 제거하고 loadComments로 순서대로 재배치
                state.hiddenComments = state.hiddenComments.filter(x => x.id !== hc.id);
                await loadComments();
              } else {
                hItem.remove();
                renderComments();
              }
              // 처리할 작업(알림) 목록·뱃지를 즉시 갱신 — 폴링 대기 없이 반영
              pollNotifCount(); loadNotifList();
            } catch (err) {
              alert(err.message || '표시 전환에 실패했습니다.');
            }
          });
        }
        commentsList.appendChild(hItem);
      });
    }
  }
}

// 공통 헬퍼: 항목마다 캡슐화된 autoResize·버튼 상태를 위해 전역으로 꺼냄
function autoResizeElGlobal(el) {
  el.style.height = 'auto';
  const minH = parseFloat(getComputedStyle(el).minHeight) || 36;
  el.style.height = Math.max(el.scrollHeight, minH) + 'px';
}
function updateFmtBtnStatesGlobal(item) {
  const handler = item && item._updateFmt;
  if (handler) handler();
}



// ─── Polling (sync for other users) ────────────────────────────────────────
function startPolling() {
  stopPolling();
  state.pollTimer = setInterval(async () => {
    if (!state.currentPageId) return;

    // Check comment count
    try {
      const comments = await api(`/api/pages/${state.currentPageId}/comments`);
      if (comments.length !== state.lastCommentCount) {
        state.lastCommentCount = comments.length;
        renderComments(comments);
      }
    } catch (e) { /* ignore */ }
  }, 5000);
}

function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

// ─── Page Tags ─────────────────────────────────────────────────────────────
async function loadTags() {
  if (!state.currentPageId) return;
  try {
    state.tags = await api(`/api/pages/${state.currentPageId}/tags`);
    // 해결됨 표시는 "댓글이 있는 태그"만 가능하므로, 렌더링 전에 댓글 수를 확보한다.
    // 여기서 로드를 못 하면 첫 화면에 댓글 없는 태그에도 '✓ 해결됨' 버튼이 보인다.
    await Promise.all(state.tags.filter(t => !t.is_resolved).map(t => loadTagComments(t.id)));

    renderTagMarkers();
    renderTagList();
  } catch (e) { /* ignore */ }
}

function renderTagMarkers() {
  const overlay = $('tagOverlay');
  overlay.innerHTML = '';
  overlay.style.display = 'block';
  state.tags.forEach(tag => {
    if (tag.x_pct == null || tag.y_pct == null) return;
    const marker = document.createElement('div');
    marker.className = 'tag-marker' + (state.tagMode ? ' tag-mode-active' : '');
    marker.dataset.tagId = tag.id;
    marker.style.left = tag.x_pct + '%';
    marker.style.top = tag.y_pct + '%';
    marker.textContent = tag.tag_number;
    marker.title = tag.description || `태그 ${tag.tag_number}`;
    marker.addEventListener('mousedown', e => onMarkerMouseDown(e, tag));
    // 마커 호버 → 우측 패널 디스크립션 카드에 보라색 테두리 (역방향 연결)
    marker.addEventListener('mouseenter', () => highlightTagCard(tag.id, true));
    marker.addEventListener('mouseleave', () => highlightTagCard(tag.id, false));
    overlay.appendChild(marker);
  });
  // 코멘트 마커 — 디스크립션(파란색)과 동일하게 화면 영역에 주황색 번호 버튼
  state.comments.forEach(c => {
    if (c.x_pct == null || c.y_pct == null) return;
    const cm = document.createElement('div');
    cm.className = 'tag-marker comment-marker';
    cm.dataset.commentId = c.id;
    cm.style.left = c.x_pct + '%';
    cm.style.top = c.y_pct + '%';
    cm.textContent = c.comment_number;
    cm.title = c.content || `코멘트 ${c.comment_number}`;
    cm.addEventListener('mousedown', e => onCommentMarkerMouseDown(e, c));
    // 마커 호버 → 우측 패널 코멘트 카드에 주황색 테두리 (역방향 연결)
    cm.addEventListener('mouseenter', () => highlightCommentCard(c.id, true));
    cm.addEventListener('mouseleave', () => highlightCommentCard(c.id, false));
    cm.addEventListener('click', e => {
      e.stopPropagation();
      // 드래그 직후의 click은 무시 (드래그가 끝난 뒤의 클릭 이벤트 방지)
      if (state.draggingTagId === null && state._commentJustDragged) { state._commentJustDragged = false; return; }
      scrollToComment(c.id);
    });
    overlay.appendChild(cm);
  });
}

// 알림 클릭·마커 클릭 공통: 댓글 탭 전환 후 해당 코멘트로 스크롤 + 가볍게 테두리 강조.
function highlightItem(item) {
  const prev = { border: item.style.border, boxShadow: item.style.boxShadow, borderRadius: item.style.borderRadius };
  item.style.transition = 'border-color .3s ease, box-shadow .3s ease';
  item.style.border = '1px solid #4f8ef7';
  item.style.boxShadow = '0 0 0 3px rgba(79,142,247,.18)';
  item.style.borderRadius = '6px';
  setTimeout(() => {
    item.style.transition = 'border-color .8s ease, box-shadow .8s ease';
    item.style.borderColor = 'transparent';
    item.style.boxShadow = 'none';
    setTimeout(() => {
      item.style.transition = '';
      item.style.border = prev.border;
      item.style.boxShadow = prev.boxShadow;
      item.style.borderRadius = prev.borderRadius;
    }, 850);
  }, 1400);
}
function scrollToComment(commentId) {
  switchRightTab('comments');
  let done = false;
  const tick = setInterval(() => {
    const item = commentsList.querySelector(`[data-comment-id="${commentId}"]`)
             || commentsList.querySelector(`[data-comment-id="c${commentId}"]`);
    if (!item) return;
    if (!done) {
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      highlightItem(item);
      done = true;
      clearInterval(tick);
    }
  }, 120);
}

// 디스크립션 카드(목록 아이템)로 스크롤 + 가볍게 테두리 강조.
function scrollToDescription(tagId) {
  switchRightTab('description');
  let done = false;
  const tick = setInterval(() => {
    const item = tagsListEl.querySelector(`[data-tag-id="${tagId}"]`);
    if (!item) return;
    if (!done) {
      item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      highlightItem(item);
      done = true;
      clearInterval(tick);
    }
  }, 120);
}

function renderTagList() {
  tagsListEl.innerHTML = '';
  state.tags.forEach(tag => {
    const isPending = tag.id === state.pendingTagId;
    const isEditing = tag.id === state.editingTagId;
    const readOnly = !isPending && !isEditing;
    // 작성자 여부: author_email이 비어 있으면(구버전 데이터) 누구나, 아니면 본인만.
    const isMine = !tag.author_email || (state.currentUser && tag.author_email === state.currentUser.email);

    // escHtml을 템플릿 리터럴(아래 toFmtHtml 호출)보다 먼저 정의해야 한다 —
    // const는 TDZ라 선언 전 접근 시 ReferenceError.
    const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    const item = document.createElement('div');
    item.className = 'tag-list-item' + (readOnly ? ' tag-readonly' : '');
    item.dataset.tagId = tag.id;
    // 배지·이름/시각·텍스트박스·댓글·버튼: 세로 흐름으로 배치.
    const authorDisplay = tag.author_name || '';
    const createdDisplay = tag.created_at ? tag.created_at.replace('T', ' ').slice(0, 16) : '';
    // 디스크립션(텍스트박스) 첫 줄에 작성자명·작성 시각을 표시한다.
    // 수정/삭제 버튼은 이 메타 라인 우측 끝에, 화면 트리와 동일한 연필/쓰레기통 아이콘으로.
    // 디스크립션은 누구나 수정·삭제 가능 → 작성자 체크 없이 버튼 표시.
    // 세 아이콘(정보/수정/삭제)은 .tag-meta-actions 안에 같은 gap으로 나란히 배치된다.
    // 정보 버튼은 클릭 없이 툴팁만 띄우는 span — 마우스를 올리면 "작성자 · 작성 시각" 표시.
    const metaTip = [authorDisplay, createdDisplay].filter(Boolean).join(' · ');
    const infoIcon = !isPending && metaTip
      ? `<span class="icon-btn tag-info-btn" title="${escHtml(metaTip)}" aria-label="${escHtml(metaTip)}"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7.2v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="4.9" r="0.9" fill="currentColor"/></svg></span>`
      : '';
    const editDelIcons = !isPending
      ? `<span class="tag-meta-actions">
          ${infoIcon}
          <button type="button" class="icon-btn tag-edit-btn" data-tag-action="edit" title="수정"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.4 2.1l2.5 2.5L5.3 13.2l-3.3.9.9-3.3 8.5-8.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
          <button type="button" class="icon-btn tag-del-btn" data-tag-action="del" title="삭제"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11 M6.5 4V2.5h3V4 M4 4l.8 9.5h6.4L12 4 M6.5 7v4 M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </span>`
      : '';
    // 상단 메타 라인: 제목이 있으면 굵은 제목, 없으면 기존처럼 작성자·시각을 표시.
    const descMeta = (tag.title || authorDisplay || createdDisplay || editDelIcons)
      ? `<div class="tag-meta">${tag.title
          ? `<span class="tag-title">${escHtml(tag.title)}</span>`
          : `<span class="tag-author">${escHtml(authorDisplay)}</span>${createdDisplay ? `<span class="tag-created-at">${escHtml(createdDisplay)}</span>` : ''}`}${editDelIcons}</div>`
      : '';
    item.innerHTML = `
      <div class="tag-num-col"><span class="tag-num-badge">${tag.tag_number}</span></div>
      ${readOnly
        ? `<div class="tag-desc-text">${descMeta}<span class="tag-desc-inner">${fmtToHtml(tag.description)}</span></div>`
        : `<div class="tag-desc-wrap">${descMeta}<input type="text" class="tag-title-input" placeholder="제목" value="${escHtml(tag.title || '')}"><div class="tag-desc-input tag-fmt-div" contenteditable="true" data-placeholder="설명 작성...">${toFmtHtml(tag.description)}</div></div>`}
      <div class="tag-actions">
        ${!readOnly
          ? `<button type="button" class="tag-fmt-btn tag-bold-btn" title="굵게"><b>B</b></button>
             <button type="button" class="tag-fmt-btn tag-bullet-btn" title="글머리 기호">•</button>`
          : ''}
        ${readOnly && !isPending ? `<a href="#" class="desc-comments-view-link" data-tag-action="view-comments">${String(state.openCommentsTagId) === String(tag.id) ? '댓글 접기' : '댓글 보기'} (${(tag.comments || []).length})</a>` : ''}
        <span class="tag-actions-right">
        ${isPending
          ? `<button type="button" class="btn btn-sm btn-primary tag-save-btn">저장</button>
             <button type="button" class="btn btn-sm btn-outline tag-cancel-btn">취소</button>`
          : isEditing
            ? `<button type="button" class="btn btn-sm btn-primary tag-save-btn">저장</button>
               <button type="button" class="btn btn-sm btn-outline tag-cancel-btn">취소</button>`
            : ''}
        </span>
      </div>
${!isPending ? `<div class="desc-comments" data-tag-comments="${tag.id}"></div>
        <button type="button" class="btn btn-sm btn-outline desc-add-comment-btn" data-tag-action="add-desc-comment">댓글 추가</button>` : ''}
    `;

    if (!readOnly) {
      const div = item.querySelector('.tag-fmt-div');
      if (div) {
        // placeholder 표시 상태 동기화 — CSS :empty 는 <br> 하나만 있어도 성립하지 않고,
        // :has() 조건은 편집 중 DOM이 바뀌는 순간 재평가 타이밍 문제로 계속 노출되는
        // 버그가 있어서, JS가 is-empty 클래스를 직접 관리한다.
        updateDescEmptyState(div);
        // placeholder 동기화 + 높이 자동 확장 — 글이 길어져도 박스가 함께 커져서 전문이 보임.
        // 렌더 시점(아래 requestAnimationFrame)에만 한 번 맞춰지던 게 문제였음:
        // input마다 scrollHeight를 재계산해 inline height로 반영한다.
        div.addEventListener('input', () => {
          updateDescEmptyState(div);
          if (typeof autoResizeElGlobal === 'function') autoResizeElGlobal(div);
        });
        // 붙여넣기는 input 이벤트보다 DOM 반영이 느려 rAF까지 대기
        div.addEventListener('paste', () => requestAnimationFrame(() => {
          if (typeof autoResizeElGlobal === 'function') autoResizeElGlobal(div);
        }));
        // 높이 자동조절 + 커서를 끝에 배치
        requestAnimationFrame(() => { if (typeof autoResizeElGlobal === 'function') autoResizeElGlobal(div); });
        div.focus();
        const range = document.createRange();
        range.selectNodeContents(div);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }

    const saveBtn = item.querySelector('.tag-save-btn');
    if (saveBtn) saveBtn.addEventListener('click', () => saveTagDesc(item, tag));
    const cancelBtn = item.querySelector('.tag-cancel-btn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => cancelTagEdit(item, tag));
    const editBtn = item.querySelector('.tag-edit-btn');
    if (editBtn) editBtn.addEventListener('click', () => startTagEdit(tag));
    const delBtn = item.querySelector('.tag-del-btn');
    if (delBtn) delBtn.addEventListener('click', () => deleteTag(tag.id));
    // '댓글 보기': 클릭 시 댓글 목록 열림/접힘 토글.
    const viewCommentsLink = item.querySelector('.desc-comments-view-link');
    if (viewCommentsLink) {
      viewCommentsLink.addEventListener('click', e => {
        e.preventDefault();
        state.openCommentsTagId = String(state.openCommentsTagId) === String(tag.id) ? null : tag.id;
        renderTagList();
      });
    }
    // '댓글 추가': .desc-comments 바깥 카드 하단 우측 버튼 → 댓글창을 열고 inputbox가 열린 태그로 표시.
    const addDescCommentBtn = item.querySelector('.desc-add-comment-btn');
    if (addDescCommentBtn) {
      addDescCommentBtn.addEventListener('click', () => openAddDescCommentBox(item, tag));
    }
    // ── 디스크립션 태그에 달린 댓글 렌더링 ──
    // 댓글이 있는지 서버에서 확인해 렌더링한다.
    if (readOnly && !isPending) {
      if (tag.comments == null) { // loose equality: tags API 응답엔 comments 키가 없어 undefined도 포괄해야 함
        // 아직 로드되지 않았다면(페이지 갱신 직후) 서버에서 가져온다. 중복 요청 방지용 플래그 사용.
        if (!tag._commentsLoading) {
          tag._commentsLoading = true;
          loadTagComments(Number(String(tag.id).replace(/^[^0-9]*/, '')) || tag.id).finally(() => {
            tag._commentsLoading = false;
          });
        }
        // 태그가 이미 열려 있으면(사용자가 '댓글 보기'를 눌렀는데 아직 데이터가 없는 경우)
        // 즉시 빈 상태 메시지를 표시한다. 서버 응답을 기다리지 않고
        // UI 반응을 즉시 줘야 "클릭했는데 아무 일도 없네"라는 인상을 막을 수 있다.
        if (String(state.openCommentsTagId) === String(tag.id)) {
          renderDescComments(item, tag);
        }
      } else {
        // 로드 완료(댓글 0개 포함): 열려 있으면 빈 상태 메시지가, 접혀 있으면 빈 박스가 그려진다.
        renderDescComments(item, tag);
      }
    }

    // ── 서식 편집기 ──
    // textarea(평문)는 <b> 같은 HTML 태그를 그대로 문자열로 보여서,
    // B 버튼·글머리 버튼을 누르는 순간부터 이 항목의 입력창을
    // contenteditable div(tag-fmt-div)로 전환해 실제 서식을 붙여 편집한다.
    // 텍스트에 직접 타이핑해도 자동으로 전환된다.
    // 저장값은 항상 평문: <굵게>...</굵게> 마커와 각 줄 앞의 "• " 접두어.
    // 읽기 모드·편집 모드 모두 이 평문을 fmtToHtml()/toFmtHtml() 로 렌더링한다.

function autoResizeEl(el) {
      el.style.height = 'auto';
      const minH = parseFloat(getComputedStyle(el).minHeight) || 36;
      el.style.height = Math.max(el.scrollHeight, minH) + 'px';
    }

    function enterFmtMode() {
      // 이미 contenteditable div가 있으면(수정 모드 진입 시 바로 생성) 재전환하지 않는다.
      if (fmtDiv) return;
      const existing = item.querySelector('.tag-fmt-div');
      if (existing) { fmtDiv = existing; return; }
      const ta = item.querySelector('textarea.tag-desc-input');
      if (!ta) return;
      const text = ta.value;
      const h = ta.style.height || getComputedStyle(ta).height;
      const div = document.createElement('div');
      div.className = 'tag-desc-input tag-fmt-div';
      div.contentEditable = 'true';
      div.innerHTML = toFmtHtml(text);
      div.style.height = h;
      ta.parentNode.replaceChild(div, ta);
      fmtDiv = div;
      div.focus();
      const range = document.createRange();
      range.selectNodeContents(div);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      // 높이 자동 조절은 input(타이핑)과 paste 모두에서 동작해야 한다.
      // .tag-fmt-div 클래스를 공유하는 다른 박스(예: 답글 입력창 .desc-add-textarea)가
      // 같은 이벤트 버블링을 타면 이 리스너도 실행되므로, div만 대상으로 한정한다.
      div.addEventListener('input', e => { if (e.target !== div) return; if (fmtDiv === div) autoResizeEl(div); updateFmtBtnStates(); });
      div.addEventListener('paste', e => { if (e.target !== div) return; requestAnimationFrame(() => { if (fmtDiv === div) autoResizeEl(div); updateFmtBtnStates(); }); });
      // 편집 모드 안에서 커서를 움직여도 활성 상태가 따라 바뀐다.
      document.addEventListener('selectionchange', updateFmtBtnStates);
      // ── 내려쓰기(Enter) → <br> 삽입 ──────────────────────────────────────────
      // [원인 확정] 태그 설명 편집창(enterFmtMode)의 기존 핸들러는 <li> 안에만
      // 동작하고 리스트 밖 Enter는 브라우저 기본 동작을 그대로 통과시켰다.
      // Chrome/Edge contenteditable은 엔터마다 <div>를 새로 만들어
      // "<div>a</div><div>b</div>" 구조를 만들고, 마지막 줄엔 <br>를 넣는다.
      // walk()/fmtDivToPlain()는 DIV 경계만 '\n'으로 변환하므로 a→b 사이 줄바꿈은
      // 살아남는데, b뒤 마지막 줄의 <br>가 평문 끝에 남아 읽기 렌더(fmtToHtml)에서
      // "\n".split('\n')=[a,b,''] 의 빈 3번째 라인으로 바뀌어 'a\nb\n<br>'처럼
      // 보이는 등 화면에서 줄이 꼬여 "내려쓰기가 반영 안 됐다"로 인식됐다.
      // 해결: 리스트 밖에서도 preventDefault 후 <br> 하나만 명시 삽입 —
      // 평문으로 round-trip 하면 항상 "a\nb" 가 되어 읽기/편집 어디서든 정확히
      // 한 줄 내려쓴 결과로 나타난다. li 분기는 기존 로직 그대로 유지.
      if (!div.__enterHandlerBound) {
        div.__enterHandlerBound = true;
        div.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          const sel = window.getSelection();
          if (!sel.rangeCount) return;
          const node = sel.anchorNode;
          const el = node && node.nodeType === 1 ? node : node && node.parentElement;
          const li = el && el.closest ? el.closest('li') : null;
          // ── <li> 안에 있을 때: 같은 <li>의 <div> 대신 새 <li> 생성 ────────────
          if (li) {
            // [수정] startContainer/startOffset 사용 — anchorNode가 요소 노드일 때 자식 순회 매칭 실패 방지
            const _r = sel.getRangeAt(0);
            const _sN = _r.startContainer;
            let after = '';
            if (_sN && _sN.nodeType === 3) after = _sN.textContent.slice(_r.startOffset);
            const newLi = document.createElement('li');
            if (after) newLi.appendChild(document.createTextNode(after));
            else newLi.innerHTML = '<br>';
            li.parentNode.insertBefore(newLi, li.nextSibling);
            const r = document.createRange();
            r.setStart(newLi.firstChild, 0);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);
            e.preventDefault();
            return;
          }
          // ── <li> 밖에 있을 때: <br> 삽입 (브라우저 기본 동작과 동일) ──────────
          // [수정 2026-10-29] 자작 BR 삽입 + 커서 배치에서는 한글 commit 이 '첫째'처럼
          //   한 문자 단위 input 이벤트로 여러 번 들어오면 새 입력이 앞쪽 text node에
          //   다시 들어가 "첫째둘째<br>"가 됐다(격리 실험 enter_test.py: A/C/E/G 전부 실패,
          //   F=execCommand('insertLineBreak')만 PASS). 그래서커서를 어디에 놓든 자작 BR은
          //   무효하고, preventDefault 없이 insertLineBreak 네이티브 처리로 위임한다.
          //   Chrome/Edge의 결과가 항상 "<br>"(div 생성 없음)인지 확인 필요 — div가 생기면
          //   fmtDivToPlain 의 DIV 경계 변환이 '\n'으로 압축해 평문 자체는 같아진다.
          if (!document.execCommand('insertLineBreak')) {
            // fallback: 네이티브 실패시 BR 직접 삽입
            const range = sel.getRangeAt(0);
            range.deleteContents();
            const br = document.createElement('br');
            range.insertNode(br);
          }
        });
      }
    }

    function exitFmtMode() {
      if (!fmtDiv) return;
      // innerHTML 문자열 치환은 순서에 따라 마커가 서로 상쇄되어 사라진다
      // (예: </li>→\n 후 남은 닫기 태그가 또 \n이 되어 \n\n 압축에 글머리 줄이 합쳐짐).
      // 그래서 DOMParser로 노드 단위로 파싱해 각 요소를 평문 규칙으로 변환한다.
      const doc = new DOMParser().parseFromString('<body>' + fmtDiv.innerHTML + '</body>', 'text/html');
      const body = doc.body;
      const unescape = s => s.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
      let out = '';
      const isBoldEl = el => /^(B|STRONG)$/.test(el.tagName);
      const walk = (node, bold) => {
        for (const child of node.childNodes) {
          if (child.nodeType === 3) {           // 텍스트
            if (/^\s+$/.test(child.textContent)) continue;  // 태그 사이 공백 노드 무시
            out += unescape(child.textContent);
          } else if (child.nodeType !== 1) {    // 코멘트 등은 무시
            continue;
          } else {                              // 요소
            const tag = child.tagName;
            if (child.classList && child.classList.contains('mention-chip')) {  // 멘션 칩 → 평문 @이름 (뒤 공백은 별도 노드)
              out += '@' + (child.dataset.mention || (child.textContent || '').replace(/^@/, '').trim());
              continue;
            }
            // BR→'\n': 직전 문자가 이미 '\n'이면 생략 — DIV 경계와 BR의 개행이 중복되는 것을 막는다.
            // 다음 형제가 DIV/P(블록)이면 그 앞 '\n'이 줄바꿈을 맡으므로 이 BR은 건너뜀 —
            // <div>a<br></div><div>b</div> 같은 "DIV 경계 직전 BR"에서 \n\n\n 가 만들어져
            // 캐핑(\n{3,}→\n\n)으로 빈 줄 하나가 사라지던 버그를 없앤다.
            const nextSib = child.nextSibling;
            const nextIsBlock = !!(nextSib && nextSib.nodeType === 1 && /^(DIV|P)$/.test(nextSib.tagName));
            if (tag === 'BR') {
              if (out && out[out.length - 1] !== '\n' && !nextIsBlock) out += '\n';
              continue;
            }
            if (tag === 'LI') {                 // 글머리 항목: "• " 접두어 + 뒤 줄바꿈
              out += '• ';
              walk(child, bold);
              out += '\n';
              continue;
            }
            if (tag === 'UL' || tag === 'OL') { // 목록 컨테이너: 자식만 순회 — LI마다 이미 \n 을 넣으므로 중복 개행 없음
              walk(child, bold);
              continue;
            }
            if (isBoldEl(child)) {              // 굵게: <굵게>…</굵게> 마커
              if (!bold) out += '<굵게>';       // 이미 굵은 영역 안에 있으면 마커 중복 방지
              walk(child, true);
              if (!bold) out += '</굵게>';
              continue;
            }
            if (tag === 'DIV' || tag === 'P') { // 블록: 앞쪽 '\n'. 직전 문자가 이미 '\n'이면 생략해
                // DIV 경계 개행이 정확히 1개가 되도록 한다. 엔터 1회=\n, 엔터 2회(빈 줄)=\n\n.
                // 빈 줄은 중간 DIV의 <br>가 \n 을 만들어 보존된다.
                if (!(out && out[out.length - 1] === '\n')) out += '\n';
                walk(child, bold);
                continue;
              }
            walk(child, bold);                  // SPAN 등: 내용만
          }
        }
      };
      walk(body, false);
      const plain = out
        .replace(/[ \t]+\n/g, '\n')   // 줄 끝 공백
        // UL 직후의 잔여 개행만 정리 — LI마다 이미 '\n' 을 넣으므로 UL 뒤에 일반 텍스트가
        // 이어질 때 "• 항목\n\n다음"이 되는 것을 방지. 사용자가 엔터 두 번으로 의도한
        // 빈 줄(\n\n)은 보존된다. (saveComment/exitFmtMode/fmtDivToPlain 3곳 동일 규칙)
        .replace(/(•[^\n]*\n)\n+/g, '$1')
        // [수정] 캐핑 제거 — walk 단계에서 DIV 경계는 직전 '\n' 확인으로, BR은 각각 '\n' 하나씩
        // 정확히 넣으므로 엔터 N회 = \n N개가 보존된다. 예전 캐핑은 엔터 3회(빈 줄 2개)를
        // \n\n\n → \n\n 으로 압축해 "줄바꿈 2개 이상 미인식" 버그를 만들었다.
        .replace(/^\n+/, '')
        .replace(/\n$/, '');
      const ta = document.createElement('textarea');
      ta.className = 'tag-desc-input';
      ta.placeholder = '설명 작성...';
      ta.value = plain;
      fmtDiv.parentNode.replaceChild(ta, fmtDiv);
      fmtDiv = null;
      requestAnimationFrame(() => autoResizeEl(ta));
    }
    // saveTagDesc/cancelTagEdit 같은 클로저 밖 함수가 이 항목의 편집 상태를
    // 평문으로 복원할 때 쓰는 핸들러.
    item._fmtExit = () => exitFmtMode();

    // ── B·글머리 버튼 활성 표시: 커서가 서식 적용 영역 안에 있으면 연한 보라색 ──
    // 굵기는 queryCommandState로 확인. 글머리는 selection의 공통 조상이 <li>인지로
    // 판단한다 — insertUnorderedList는 커서가 li에 "접촉"만 해도 true를 반환해서
    // 해제 후에도 버튼이 켜진 채로 남는 문제가 있기 때문.
    const boldBtn = item.querySelector('.tag-bold-btn');
    const bulletBtn = item.querySelector('.tag-bullet-btn');
    function updateFmtBtnStates() {
      if (!fmtDiv) return;
      let boldOn = false, bulletOn = false;
      try { boldOn = document.queryCommandState('bold'); } catch (e) {}
      const sel = window.getSelection();
      if (sel && sel.rangeCount) {
        const anc = sel.getRangeAt(0).commonAncestorContainer;
        const el = anc.nodeType === 1 ? anc : anc.parentElement;
        bulletOn = !!(el && el.closest && fmtDiv.contains(el) && el.closest('li'));
      }
      boldBtn.classList.toggle('fmt-active', boldOn);
      bulletBtn.classList.toggle('fmt-active', bulletOn);
    }

    // 공통: 사용자가 실제 div 안에서 드래그로 선택했는지는 시작/끝 경계 노드 양쪽이
    // 모두 div 안에 있어야 성립한다. commonAncestorContainer만 보면 인접 공백 텍스트 노드
    // 사이에 커서가 있어도 "div 안"으로 오인 — 이 판정 실패가 "전체 문장에 적용되는" 버그의 원인.
    function tagHasRealSelection() {
      const sT = window.getSelection();
      if (!sT || !sT.rangeCount || sT.isCollapsed) return false;
      const rgT = sT.getRangeAt(0);
      const elOfT = n => (n && n.nodeType === 1 ? n : n && n.parentElement);
      const inDT = el => !!(el && fmtDiv && fmtDiv.contains(el));
      return inDT(elOfT(rgT.startContainer)) && inDT(elOfT(rgT.endContainer));
    }
    if (boldBtn) boldBtn.addEventListener('click', () => {
      enterFmtMode();
      // enterFmtMode가 방금 만든 collapsed selection 때문에 isCollapsed 검사로는
      // "사용자가 실제로 선택한 영역"을 구분할 수 없다.
      // 그래서 항상: 선택 영역이 있으면 그대로, 없으면 마지막 단어를 선택한다.
      const sel = window.getSelection();
      const hasRealSelection = tagHasRealSelection();
      if (!hasRealSelection && fmtDiv) {
        const r = document.createRange();
        const last = fmtDiv.lastChild;
        if (last && last.nodeType === Node.TEXT_NODE) {
          const txt = last.textContent;
          const sp = txt.search(/\S+\s*$/);
          r.setStart(last, sp >= 0 ? sp : 0);
          r.setEnd(last, txt.length);
        } else {
          r.selectNodeContents(fmtDiv);
        }
        sel.removeAllRanges();
        sel.addRange(r);
      }
      document.execCommand('bold');
      if (fmtDiv) autoResizeEl(fmtDiv);
      updateFmtBtnStates();
    });
    if (bulletBtn) bulletBtn.addEventListener('click', () => {
      enterFmtMode();
      // 커서가 있는 "한 줄"만 불릿 토글 — execCommand 대신 DOM 조작 헬퍼 사용.
      if (fmtDiv) fmtToggleBullet(fmtDiv);
      if (fmtDiv) autoResizeEl(fmtDiv);
      updateFmtBtnStates();
    });

    item.addEventListener('mouseenter', () => highlightMarker(tag.id, true));
    item.addEventListener('mouseleave', () => highlightMarker(tag.id, false));
    tagsListEl.appendChild(item);
  });
}

// ─── Description Comments (태그에 달린 댓글 — 코멘트 탭과 무관) ──────────────
async function loadTagComments(tagId) {
  const tid = Number(String(tagId).replace(/^[^0-9]*/, '')) || tagId;

  try {
    const comments = await api(`/api/tags/${tid}/comments`);
    const tag = state.tags.find(t => String(t.id) === String(tagId) || String(t.id) === String(tid));
    if (tag && !tag.is_resolved) {
      // 변경 감지: 댓글이 실제로 바뀌었을 때만 리렌더.
      // renderTagList()는 tagsListEl.innerHTML=''로 전체 재생성이라, 마우스가
      // 카드 위에 있는 상태에서 불리면 mouseenter 재발화 → loadTagComments →
      // renderTagList 루프(호버 깜빡임·버튼 무응답)가 생긴다.
      const prevLen = (tag.comments || []).length;
      const prevLast = prevLen ? tag.comments[prevLen - 1].id : null;
      const newLen = (comments || []).length;
      const newLast = newLen ? comments[newLen - 1].id : null;
      tag.comments = comments;
      if (newLen !== prevLen || newLast !== prevLast) renderTagList();
    }
  } catch (e) { /* ignore */ }
}

function fmtCommentDate(raw) {
  if (!raw) return '';
  // SQLite datetime('now','localtime') 형식: "2026-10-20 14:35:00"
  const m = String(raw).match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{1,2})/);
  if (m) return `${+m[2]}월 ${+m[3]}일 ${String(+m[4]).padStart(2,'0')}:${m[5]}`;
  const d = new Date(raw);
  return isNaN(d.getTime()) ? '' : `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function renderDescComments(item, tag) {
  const box = item.querySelector(`[data-tag-comments="${tag.id}"]`);
  if (!box) return;
  const escHtml = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const comments = tag.comments || [];

  // 아직 '댓글 보기'를 눌러 열지 않았다면: 목록을 표시하지 않음.
  // String()으로 통일: API가 int를 반환해도 state에 문자열이 들어간 경우 대비.
  if (String(state.openCommentsTagId) !== String(tag.id)) {
    box.innerHTML = '';
    return;
  }

  // 열려 있는 상태: 각 댓글에 체크 태그(확인 완료)를 붙여 표시.
  // is_checked=true인 댓글은 본문 대신 닉네임+작성시각만 표시한다.
  box.classList.add('open'); // 접혀 있을 때의 빈 자국(배경·테두리) 제거용 클래스.
                             // 댓글 0개일 때도 필수 — CSS(.desc-comments.open ~ .desc-add-comment-btn)가
                             // 이 클래스 기준으로 '댓글 추가' 버튼을 보이게 한다.

  // 댓글이 하나도 없으면 빈 상태 메시지와 '댓글 추가' 버튼을 함께 보여줘야 한다.
  // CSS가 .desc-add-comment-btn을 display:none으로 숨기고,
  // .desc-comments.open ~ .desc-add-comment-btn 만 보이게 하므로 —
  // open 클래스만으로는 버튼이 안 보일 수 있다(예: .open 클래스가 적용되기 전에
  // innerHTML이 교체되거나, CSS 선택자가 기대와 다르면). 그래서 여기에서 직접
  // 버튼 HTML을 박스 안에 넣어 항상 보이도록 만든다.
  if (!comments.length) {
    // '댓글 추가' 버튼은 .desc-comments 바깥(카드 하단 우측)에 하나만 있으므로 여기엔 넣지 않는다.
    box.innerHTML = `<div class="desc-comments-empty">아직 댓글이 없습니다.</div>`;
    return;
  }
  // 체크/해제는 태그 작성자 또는 해당 댓글의 작성자가 가능.
  // list_tags API가 desc_author_email 필드에 태그 작성자 이메일을 담아준다 — 비어 있으면(구버전 데이터) 누구나.
  const myEmail = state.currentUser ? state.currentUser.email : '';
  const isTagAuthor = !!tag.desc_author_email && tag.desc_author_email === myEmail;
  const allChecked = comments.length > 0 && comments.every(c => c.is_checked === 1 || c.is_checked === true);
  box.classList.toggle('all-checked', allChecked);
  // '댓글 추가' 버튼은 이제 .desc-comments 바깥(카드 하단 우측)에 있으므로 여기엔 넣지 않는다.
  // 연필 수정: 미체크 댓글 중 본인 작성분에만 표시
  box.innerHTML = (comments.length ? comments.map(c => {
    const checked = c.is_checked === 1 || c.is_checked === true;
    const canEdit = !checked && (!c.author_email || (myEmail && c.author_email === myEmail));
    // 태그 작성자, 또는 이 댓글의 작성자만 체크/해제 가능 (서버와 동일한 규칙)
    const canCheckThis = !tag.desc_author_email || isTagAuthor || (myEmail && c.author_email && c.author_email === myEmail);
    const meta = `<div class="desc-comment-meta">
      <button type="button" class="desc-comment-check${checked ? ' is-checked' : ''}" data-comment-check="${c.id}" role="checkbox" aria-checked="${checked}" ${canCheckThis ? '' : 'disabled'} title="${!canCheckThis ? '태그 또는 댓글 작성자만 체크/해제할 수 있습니다' : checked ? '확인 해제 — 본문을 다시 볼 수 있습니다' : '확인 완료 — 본문이 숨겨집니다'}"><svg viewBox="0 0 12 10" width="34" height="28" aria-hidden="true"><path d="M1.5 5.2 L4.3 8 L10.5 1.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <span class="desc-comment-author">${escHtml(c.author_name)}</span>
      ${c.created_at ? `<span class="desc-comment-date">${escHtml(fmtCommentDate(c.created_at))}</span>` : ''}
      ${canEdit ? `<button type="button" class="desc-comment-edit-btn" data-comment-edit="${c.id}" title="댓글 수정"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M11.5 1.5l3 3L5 14H2v-3L11.5 1.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>` : ''}
    </div>`;
    return `
    <div class="desc-comment-item${checked ? ' desc-comment-checked' : ''}" data-desc-comment-id="${c.id}">
      <div class="desc-comment-body">
        ${meta}
        ${checked ? '' : `<div class="desc-comment-text">${escHtml(c.content)}</div>`}
      </div>
    </div>`;
  }).join('') : '');

  // 체크 태그 클릭 → 서버에 토글 저장 후 재렌더링 (체크 시 본문 숨김 / 해제 시 본문 복원)
  box.querySelectorAll('[data-comment-check]').forEach(el => {
    el.addEventListener('click', async () => {
      if (el.disabled) return; // 디스크립션 작성자가 아니면 클릭 무시
      const rawCid = el.getAttribute('data-comment-check');
      const cid = Number(String(rawCid).replace(/^[^0-9]*/, ''));
      try {
        const tid = Number(String(tag.id).replace(/^[^0-9]*/, '')) || tag.id;
        const res = await api(`/api/tags/${tid}/comments/${cid}/check`, { method: 'POST', body: JSON.stringify({ email: currentUserEmail() }) });
        const newChecked = res.is_checked === 1 || res.is_checked === true;
        const idx = (tag.comments || []).findIndex(cc => cc.id === 'c' + cid || cc.id === cid);
        if (idx >= 0) tag.comments[idx].is_checked = newChecked ? 1 : 0;
        // 서버가 모든 댓글 확인 완료 시 태그를 자동으로 해결(is_resolved)로 전환
        if (typeof res.is_resolved === 'number') tag.is_resolved = res.is_resolved;
        renderTagList();
        // 처리할 작업(알림) 목록·뱃지를 즉시 갱신 — 폴링 대기 없이 반영
        pollNotifCount(); loadNotifList();
      } catch (e) { alert(e.message); }
    });
  });

  // 연필 클릭 → 인라인 편집 UI로 전환
  box.querySelectorAll('[data-comment-edit]').forEach(btn => {
    btn.addEventListener('click', () => openDescCommentEdit(box, tag, btn.getAttribute('data-comment-edit')));
  });
}

// ─── 디스크립션 댓글 인라인 편집 ──────────────────────────────────────────────
function openDescCommentEdit(box, tag, rawCid) {
  const cid = Number(String(rawCid).replace(/^[^0-9]*/, ''));
  const item = box.querySelector(`[data-desc-comment-id="c${cid}"]`) || box.querySelector(`[data-desc-comment-id="${rawCid}"]`);
  if (!item) return;
  const textEl = item.querySelector('.desc-comment-text');
  if (!textEl) return;
  const original = textEl.textContent;

  // 텍스트를 contenteditable div로 교체
  const editDiv = document.createElement('div');
  editDiv.className = 'desc-comment-edit-area';
  editDiv.contentEditable = 'true';
  editDiv.textContent = original;
  textEl.replaceWith(editDiv);
  editDiv.focus();
  // 커서를 끝으로
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editDiv);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);

  const actions = document.createElement('div');
  actions.className = 'desc-comment-edit-actions';
  actions.innerHTML = `
    <button type="button" class="btn btn-xs btn-primary desc-comment-save-btn">저장</button>
    <button type="button" class="btn btn-xs btn-outline desc-comment-cancel-btn">취소</button>`;
  editDiv.after(actions);

  let done = false;
  function close() {
    if (done) return;
    done = true;
    editDiv.remove();
    actions.remove();
    renderTagList();
  }
  function save() {
    if (done) return;
    const val = editDiv.textContent.trim();
    if (!val) { alert('내용을 입력해 주세요.'); return; }
    if (val === original) { close(); return; }
    const tid = Number(String(tag.id).replace(/^[^0-9]*/, '')) || tag.id;
    api(`/api/tags/${tid}/comments/${cid}`, { method: 'PUT', body: JSON.stringify({ email: currentUserEmail(), content: val }) })
      .then(() => {
        const idx = (tag.comments || []).findIndex(cc => cc.id === 'c' + cid || cc.id === cid);
        if (idx >= 0) tag.comments[idx].content = val;
        renderTagList();
      })
      .catch(e => { alert(e.message); close(); });
  }
  actions.querySelector('.desc-comment-save-btn').addEventListener('click', save);
  actions.querySelector('.desc-comment-cancel-btn').addEventListener('click', close);
  editDiv.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); save(); }
    else if (e.key === 'Escape') close();
  });
}

// ─── 코멘트 입력창 Enter fixup (MutationObserver) ─────────────────────────────
// [2026-10-29 v4] 한글 IME commit 이 문자 단위 input 으로 나눠 들어오면 커서가
//   BR 앞 text node에 고정되어 "첫째둘째<br>셋째" 가 된다(enter_test14 추적).
//   enter_test16 C 시나리오가 PASS한 방식: 각 text node의 이전 길이를 추적하고,
//   'BR 앞 text node가 늘었다'는 characterData mutation을 감지하면 늘어난 부분을
//   BR 뒤 text node로 이동 + 커서도 BR 뒤로 배치.
//   el에 이미 설치되어 있으면 다시 만들지 않는다(리렌더/재열림 안전).
function installCommentEnterFixup(el) {
  if (!el || el.__enterFixupInstalled) return;
  el.__enterFixupInstalled = true;

  const prevLens = new Map();
  function snapshot() {
    for (let i = 0; i < el.childNodes.length; i++) {
      const n = el.childNodes[i];
      if (n.nodeType === 3) prevLens.set(n, n.textContent.length);
    }
  }
  snapshot();

  const observer = new MutationObserver((mutations) => {
    for (const m of mutations) {
      if (m.type !== 'characterData') continue;
      const node = m.target;
      if (node.nodeType !== 3 || !el.contains(node)) continue;

      const prevLen = prevLens.has(node) ? prevLens.get(node) : node.textContent.length;
      const curLen = node.textContent.length;

      if (curLen > prevLen) {
        // 이 text node 뒤에 BR이 있는지 확인 (빈 text node는 건너뜀)
        let sibling = node.nextSibling;
        while (sibling) {
          if (sibling.nodeType === 1 && sibling.tagName === 'BR') {
            // BR 발견 — 늘어난 문자를 BR 뒤로 이동
            const addedText = node.textContent.substring(prevLen);
            node.textContent = node.textContent.substring(0, prevLen);

            let afterBr = sibling.nextSibling;
            if (afterBr && afterBr.nodeType === 3) {
              afterBr.textContent = addedText + afterBr.textContent;
            } else {
              const newText = document.createTextNode(addedText);
              sibling.parentNode.insertBefore(newText, sibling.nextSibling);
            }

            // 커서를 BR 뒤 text node 끝으로 배치
            const sel = window.getSelection();
            const r = document.createRange();
            const targetNode = (afterBr && afterBr.nodeType === 3) ? afterBr : sibling.nextSibling;
            r.setStart(targetNode, addedText.length);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);
            break;
          }
          if (sibling.nodeType === 3 && !sibling.textContent.trim()) {
            sibling = sibling.nextSibling;
            continue;
          }
          break;
        }
      }
      prevLens.set(node, node.textContent.length);
    }
  });
  observer.observe(el, { childList: true, characterData: true, subtree: true });
}

// ─── '댓글 추가' 버튼 로직 (.desc-comments 바깥, 카드 하단 우측) ──────────────
// state.openCommentsTagId를 강제 열고, .desc-comments 안에 inputbox 한 개만 만든다.
let _addDescInputOpenTagId = null;

function escHtmlGlobal(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openAddDescCommentBox(item, tag) {
  if (_addDescInputOpenTagId === tag.id) { closeAddDescCommentBox(item); return; }
  if (_addDescInputOpenTagId !== null) {
    const otherItem = document.querySelector(`[data-tag-id="${_addDescInputOpenTagId}"]`);
    if (otherItem) closeAddDescCommentBox(otherItem);
  }
  _addDescInputOpenTagId = tag.id;
  state.openCommentsTagId = tag.id;

  // .desc-add-comment-form은 항상 DOM에 유지(닫혀 있을 때 display:none) —
  // button 클릭 시 토글만 하므로 새로 만들 때마다 리스너가 유실되지 않는다.
  let form = item.querySelector('[data-desc-add-form]');
  if (!form) {
    form = document.createElement('div');
    form.dataset.descAddForm = 'true';
    form.className = 'desc-add-comment-form';
    const authorName = state.currentUser?.name || currentUserEmail() || '나';
    form.innerHTML = `
      <div class="desc-comment-item" data-desc-add-draft="true">
        <div class="desc-comment-body">
          <div class="desc-comment-meta">
            <span class="desc-comment-author">${escHtmlGlobal(authorName)}</span>
          </div>
          <div class="desc-add-textarea tag-desc-input tag-fmt-div" contenteditable="true"></div>
          <div class="desc-add-actions">
            <button type="button" class="btn btn-xs btn-primary desc-add-save-btn">저장</button>
            <button type="button" class="btn btn-xs btn-outline desc-add-cancel-btn">취소</button>
          </div>
        </div>
      </div>`;
    form.querySelector('.desc-add-save-btn').addEventListener('click', () => submitAddDescComment(form, tag));
    form.querySelector('.desc-add-cancel-btn').addEventListener('click', () => closeAddDescCommentBox(item));
    const div0 = form.querySelector('.desc-add-textarea');
    div0.addEventListener('input', () => autoResizeElGlobal(div0));
    div0.addEventListener('keydown', e => {
      // Enter = 줄바꿈, Shift+Enter = 줄바꿈, Escape = 닫기. 제출은 저장 버튼.
      // [원인] 기존엔 Enter가 preventDefault 후 즉시 submit을 호출해서
      //   ① 텍스트가 남아 있으면 submit이 trim()으로 공백/줄바꿈만 남긴 뒤
      //      focus만 시켜주고 return → 사용자가 "1번째 엔터가 먹혀들지 않는" 느낌
      //   ② 실제로는 <br>나 <div> 줄바꿈 DOM 노드가 한 번도 만들어지지 않아
      //      innerText 기반 제출(2619줄)에서 줄바꿈 개수가 항상 0 또는 1개로 압축
      // 해결: enterFmtMode(2177~2214)와 동일한 브라우징 규칙 —
      //   - <li> 안에 있으면: 커서 위치에서 새 <li> 분할
      //   - 그 외에는: preventDefault 후 <br> 하나 명시 삽입
      // 그러면 DOM이 "첫째줄<br>둘째줄<br>셋째줄" 형태로 쌓이고
      // fmtDivToPlain(3501)이 BR→'\n' 으로 정확히 변환해 주므로 N줄까지 보존된다.
      if (e.key === 'Enter') {
        e.preventDefault();
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const node = sel.anchorNode;
        const elN = node && node.nodeType === 1 ? node : (node && node.parentElement);
        // [수정] getRangeAt(0).startContainer/startOffset 사용 — anchorNode는 빈 <div> 안에서
        //   요소 노드 자체가 되는데, 이때 자식 순회로 "커서 뒤 텍스트"를 찾으면 항상 '' 가 나와
        //   새 <li>에 '<br>'만 들어가던 버그. startContainer는 항상 텍스트 노드(DIV 안엔 text/br뿐)라
        //   슬라이스해도 정확하다.
        const range = sel.getRangeAt(0);
        const li = elN && elN.closest ? elN.closest('li') : null;
        if (li) {
          const sNode = range.startContainer;
          const off = range.startOffset;
          let after = '';
          if (sNode && sNode.nodeType === 3) after = sNode.textContent.slice(off);
          const newLi = document.createElement('li');
          if (after) newLi.appendChild(document.createTextNode(after));
          else newLi.innerHTML = '<br>';
          li.parentNode.insertBefore(newLi, li.nextSibling);
          const rNew = document.createRange();
          rNew.setStart(newLi.firstChild, 0);
          rNew.collapse(true);
          sel.removeAllRanges();
          sel.addRange(rNew);
          return;
        }
        // [수정 2026-10-29 v4] execCommand('insertLineBreak')도 한글 IME commit 이
        //   문자 단위 input 으로 나눠 들어오면 커서가 BR 앞 text node에 고정되어
        //   "첫째둘째<br>셋째" 가 되는 것을 확인(enter_test14 DOM 추적).
        //   PASS한 방식(enter_test16 C): preventDefault 후 BR 직접 삽입 +
        //   MutationObserver로 'BR 앞 text node가 늘었다'는 신호를 감지해
        //   늘어난 문자를 BR 뒤 text node로 이동하고 커서도 함께 옮김.
        //   (input 리스너에서 setSelectionRange만 하는 B 방식은 브라우저가 덮어써 FAIL)
        range.deleteContents();
        const br = document.createElement('br');
        range.insertNode(br);
        installCommentEnterFixup(div0);
        requestAnimationFrame(() => autoResizeElGlobal(div0));
        return;
      }
      if (e.key === 'Escape') closeAddDescCommentBox(item);
    });
    item.appendChild(form); // .desc-comments 다음 → 카드 맨 아래 우측(CSS: grid-column:2, margin-top:auto)
  }
  // 댓글 0개일 때 .desc-comments 박스가 비어 있어 입력창이 보이지 않는 문제를 방지.
  // openCommentsTagId가 이미 설정되어 있으므로 renderDescComments의 빈 상태 분기가
  // "아직 댓글이 없습니다" 메시지를 표시하고, 그 아래에 이 폼이 보이도록 한다.
  form.style.display = '';
  const div = form.querySelector('.desc-add-textarea');
  div.textContent = '';
  autoResizeElGlobal(div);
  div.focus();
}

function closeAddDescCommentBox(item) {
  if (!item) { _addDescInputOpenTagId = null; return; }
  const id = item.dataset.tagId;
  if (_addDescInputOpenTagId === id) _addDescInputOpenTagId = null;
  // form은 DOM에 계속 두되 숨김(다음 클릭 시 토글). textarea 내용도 비움.
  const form = item.querySelector('[data-desc-add-form]');
  if (form) { form.style.display = 'none'; form.querySelector('.desc-add-textarea').textContent = ''; }
}

async function submitAddDescComment(wrap, tag) {
  // [수정] innerText 대신 fmtDivToPlain 사용 — contenteditable DOM의 <br>/<li> 경계를
  // walk 규칙과 동일하게 '\n'으로 변환하므로 여러 줄이 정확히 보존된다.
  const _taEl = wrap.querySelector('.desc-add-textarea');
  let text;
  if (typeof fmtDivToPlain === 'function') {
    // [수정] \n{3,} 캐핑 제거 — 엔터 N회 = \n N개 보존. fmtDivToPlain 자체에서 캐핑을 이미 뺐다.
text = fmtDivToPlain(_taEl.innerHTML).trim();
  } else {
    text = (_taEl.innerText || '').trim();
  }
  if (!text) { wrap.querySelector('.desc-add-textarea').focus(); return; }
  const saveBtn = wrap.querySelector('.desc-add-save-btn');
  saveBtn.disabled = true; saveBtn.textContent = '저장 중...';
  try {
    const tid = Number(String(tag.id).replace(/^[^0-9]*/, '')) || tag.id;
    const created = await api(`/api/tags/${tid}/comments`, {
      method: 'POST',
      body: JSON.stringify({
        content: text,
        email: currentUserEmail(),
        author_name: state.currentUser?.name || currentUserEmail()
      })
    });
    const item = Array.isArray(created) ? created[0] : (created || {});
    tag.comments = tag.comments || [];
    tag.comments.push({ ...item, is_resolved: tag.is_resolved });
    tag.comments.sort((a, b) => (b.created_at > a.created_at ? 1 : -1));
    _addDescInputOpenTagId = null;
    renderTagList();
  } catch (e) {
    alert('댓글 저장 실패: ' + e.message);
    saveBtn.disabled = false; saveBtn.textContent = '저장';
  }
}

async function toggleTagResolved(tag) {
  const newResolved = !tag.is_resolved;
  if (!state.currentUser) { alert('로그인 후 처리할 수 있습니다.'); openAuthModal('login'); return; }
  try {
    const tid = Number(String(tag.id).replace(/^[^0-9]*/, '')) || tag.id;
    const updated = await api(`/api/tags/${tid}`, {
      method: 'PUT', body: JSON.stringify({
        email: currentUserEmail(), is_resolved: newResolved,
        x_pct: tag.x_pct, y_pct: tag.y_pct, description: tag.description
      })
    });
    tag.is_resolved = updated.is_resolved;
    if (updated.is_resolved) tag.comments = []; // 해결 시 댓글 숨김
    else tag.comments = null; // 아직 로드 안 됐으면 표시 없음
    renderTagList();
    // 처리할 작업(알림) 목록·뱃지를 즉시 갱신 — 폴링 대기 없이 반영
    pollNotifCount(); loadNotifList();
  } catch (e) { alert(e.message); }
}

function startTagEdit(tag) {
  // 디스크립션은 누구나 수정 가능(1767줄 주석·버튼 표시 로직과 일치). 서버 PUT에도 작성자 체크가 없음.
  state.editingTagId = tag.id;
  renderTagList();
}
function isPendingTag(tag) { return tag.id === state.pendingTagId; }

async function saveTagDesc(item, tag) {
  // 제목 입력 칸(.tag-title-input)과 본문(contenteditable)을 각각 읽어 분리 저장한다.
  const titleEl = item.querySelector('.tag-title-input');
  const title = (titleEl ? titleEl.value : '').trim();
  // contenteditable <div>(.tag-fmt-div)은 .value 가 없고, innerText 도 "•" 같은
  // 목록 마커·굵기 정보를 잃는다. 그래서 toFmtHtml()의 역방향 변환인
  // fmtDivToPlain()(exitFmtMode의 walk 규칙과 동일)로 평문을 만든다.
  // exitFmtMode처럼 DOM을 textarea로 되돌리는 대신, DOM은 그대로 두고 값만
  // 읽는다 — replaceChild 후 requestAnimationFrame 의 autoResizeEl 이 갱신 전
  // 노드에 접근해 실패하던 문제를 피하기 위함.
  const fmtDiv = item.querySelector('.tag-fmt-div');
  let desc;
  if (fmtDiv) {
    desc = fmtDivToPlain(fmtDiv.innerHTML).trim();
  } else {
    const inputEl = item.querySelector('.tag-desc-input');
    // 기존 textarea 경로(inputEl.value)도 동시 지원.
    desc = (inputEl && (inputEl.value ?? inputEl.innerText) || '').trim();
  }
  try {
    if (tag.id === state.pendingTagId) {
      // 신규 태그: 서버에 실제로 생성
      const created = await api(`/api/pages/${state.currentPageId}/tags`, {
        method: 'POST',
        body: JSON.stringify({ x_pct: tag.x_pct, y_pct: tag.y_pct, title, description: desc, email: currentUserEmail(), author_name: currentUserName() })
      });
      Object.assign(tag, created);
      state.pendingTagId = null;
    } else {
      await api(`/api/tags/${tag.id}`, { method: 'PUT', body: JSON.stringify({ title, description: desc, email: currentUserEmail() }) });
      tag.title = title;
      tag.description = desc;
      state.editingTagId = null;
    }
    renderTagMarkers();
    renderTagList();
  } catch (e) { alert(e.message); }
}

function cancelTagEdit(item, tag) {
  if (tag.id === state.pendingTagId) {
    // 아직 저장되지 않은 신규 태그 → 화면에서 제거
    state.tags = state.tags.filter(t => t.id !== tag.id);
    state.tags.forEach((t, i) => { t.tag_number = i + 1; });
    state.pendingTagId = null;
  } else {
    state.editingTagId = null;
  }
  renderTagMarkers();
  renderTagList();
}

function toggleTagMode() {
  state.tagMode = !state.tagMode;
  const body = $('previewBody');
  body.classList.toggle('tag-add-mode', state.tagMode);
  // 추가 버튼 클릭 직후부터 화면 전체가 플러스(crosshair) 커서가 됨.
  // 태그 생성 자체는 여전히 previewBody 위 클릭(onPreviewClick)에서만 발생한다.
  document.documentElement.style.cursor = state.tagMode ? 'crosshair' : '';
  renderTagMarkers();
}

function onPreviewClick(e) {
  if (!state.currentPageId) return;
  // Only respond to clicks on the overlay or iframe area (not on markers themselves)
  if (e.target.closest('.tag-marker')) return;
  const rect = previewBody.getBoundingClientRect();
  const xPct = ((e.clientX - rect.left) / rect.width) * 100;
  const yPct = ((e.clientY - rect.top) / rect.height) * 100;
  if (state.commentAddMode) {
    createCommentAt(xPct, yPct);
  } else if (state.tagMode) {
    createTagAt(xPct, yPct);
  }
}

function createTagAt(xPct, yPct) {
  // 서버 저장 없이 로컬에 임시 태그만 만들고, 우측 디스크립션 입력 + 저장 버튼으로 확정한다.
  const id = 'pending-' + Date.now();
  const tag = {
    id,
    page_id: state.currentPageId,
    tag_number: state.tags.length + 1,
    x_pct: xPct,
    y_pct: yPct,
    description: '',
    title: '',
  };
  state.tags.push(tag);
  state.pendingTagId = id;
  state.editingTagId = null;
  state.tagMode = false;
  $('previewBody').classList.remove('tag-add-mode');
  document.documentElement.style.cursor = '';
  renderTagMarkers();
  renderTagList();
}

async function updateTagDescription(tagId, desc) {
  try {
    await api(`/api/tags/${tagId}`, { method: 'PUT', body: JSON.stringify({ description: desc }) });
    const tag = state.tags.find(t => t.id === tagId);
    if (tag) tag.description = desc;
  } catch (e) { /* ignore */ }
}

async function moveTagPosition(tagId, xPct, yPct) {
  try {
    await api(`/api/tags/${tagId}`, { method: 'PUT', body: JSON.stringify({ x_pct: xPct, y_pct: yPct }) });
    const tag = state.tags.find(t => t.id === tagId);
    if (tag) { tag.x_pct = xPct; tag.y_pct = yPct; }
  } catch (e) { /* ignore */ }
}

function deleteTag(tagId) {
  const tag = state.tags.find(t => t.id === tagId);
  if (!tag) return;
  if (tagId === state.pendingTagId) {
    // 아직 저장되지 않은 신규 태그 → 확인 없이 바로 제거
    cancelTagEdit(null, tag);
    return;
  }
  if (!confirm('이 태그를 삭제할까요?')) return;
  doDeleteTag(tagId);
}

async function doDeleteTag(tagId) {
  try {
    await api(`/api/tags/${tagId}`, { method: 'DELETE', body: JSON.stringify({ email: currentUserEmail() }) });
    state.tags = state.tags.filter(t => t.id !== tagId);
    // Renumber locally
    state.tags.forEach((t, i) => { t.tag_number = i + 1; });
    renderTagMarkers();
    renderTagList();
  } catch (e) { alert(e.message); }
}

// 코멘트 마커 강조 — renderComments의 mouseenter/mouseleave가 호출한다.

// 역방향 연결: 메인 화면 숫자 마커 호버 → 우측 패널 카드 테두리 강조.
