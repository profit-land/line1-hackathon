// ── Drag logic ────────────────────────────────────────────────────────────────
// 마우스 좌클릭을 꾹 누른 채 실제로 움직임(4px 이상)을 감지해야만 드래그가
// 시작된다. 드래그가 확정된(_isDragging) 후로는 e.buttons를 다시 확인하지
// 않는다: 포인터가 버튼에서 벗어나 iframe에 들어간 순간 이벤트가 끊겨
// 중간에 멈추던 문제를 방지하기 위해, mouseup(onDragEnd)만으로 종결한다.
let _dragCandidate = null;   // { kind:'tag'|'comment', id, startX, startY, marker, moved }
let _isDragging = false;     // 드래그가 확정된 상태 — mousemove를 계속 처리
const DRAG_START_PX = 4;     // 이 거리까지의 움직임은 '클릭'으로 간주

function onMarkerMouseDown(e, tag) {
  if (e.button !== 0) return; // 좌클릭만 드래그 후보
  // preventDefault/stopPropagation 제거:
  // 좌클릭을 누르는 동안 마커가 마우스를 따라 움직이고(드래그),
  // 놓으면(onDragEnd) 그 자리에 위치가 저장된다.
  // 이전에는 prevent로 click 이벤트까지 차단되어 '한 번 더 클릭해서 고정'하는
  // 단계를 요구했던 것으로 추정됨. 이제 클릭과 드래그가 하나의 연속 제스처다.
  _dragCandidate = { kind: 'tag', id: tag.id, startX: e.clientX, startY: e.clientY, marker: e.currentTarget, moved: false };
  _isDragging = false;
  // setPointerCapture 제거: 캡처를 걸면 pointerup/mouseup이 캡처 대상(마커)으로만
  // 전달되어 document 레벨 onDragEnd 리스너가 발화되지 않고, .dragging 클래스가
  // 영구 잔존하며 위치 저장도 안 되는 버그가 발생했다. iframe 이탈로 이벤트가
  // 끊겨도 onDragMove의 !(e.buttons & 1) 분기가 buttons=0 이벤트를 받아
  // onDragEnd()를 호출하도록 되어 있어 캡처 없이도 안전하게 종결된다.
}

function onCommentMarkerMouseDown(e, c) {
  if (e.button !== 0) return; // 좌클릭만 드래그 후보
  // pending(저장 전) 코멘트도 드래그 가능 — 태그 마커와 동일하게 즉시 움직이고,
  // 저장 시점의 x_pct/y_pct 가 서버에 보내진다.
  // 이전에는 pending 을 차단해 "코멘트 버튼으로 설치한 직후 마커가 전혀 안 움직임" 버그가 발생했다.
  _dragCandidate = { kind: 'comment', id: c.id, startX: e.clientX, startY: e.clientY, marker: e.currentTarget, moved: false };
  _isDragging = false;
  // setPointerCapture 제거 — 태그 마커와 동일하게 document 레벨 리스너에 의존한다.
}

function onDragMove(e) {
  const d = _dragCandidate;
  if (!d) return;
  // 좌클릭을 유지하고 있지 않으면(버튼을 놨는데 mouseup이 아직 안 온 순간 등)
  // 어떤 단계에서도 이동을 멈추고, 움직였었다면 그 자리로 저장한다.
  if (!(e.buttons & 1)) {
    if (_isDragging || d.moved) onDragEnd();
    else _dragCandidate = null;
    return;
  }
  if (_isDragging) {
    // 이미 드래그 중 — 포인터 위치만 따라감.
  } else {
    // 아직 후보 단계: 좌클릭이 눌려 있는지 확인
    if (!(e.buttons & 1)) {
      _dragCandidate = null;
      return;
    }
    const dx = e.clientX - d.startX;
    const dy = e.clientY - d.startY;
    if (Math.hypot(dx, dy) < DRAG_START_PX) return; // 아직 움직임 부족 — 클릭일 수 있음
    d.moved = true;
    _isDragging = true;
    state.draggingTagId = d.id;                      // 여기서 드래그로 확정
    // 마커 DOM이 재렌더(renderTagMarkers)되면 d.marker는 죽은 노드 — 새 마커를 찾아 교체.
    // 안 하면 .dragging 클래스가 제거되는 시점(onDragEnd)에 이미 노드가 없어
    // '버튼이 과하게 커진 채 움직이지 않는' 오류가 남는다.
    const fresh = $('tagOverlay').querySelector(
      d.kind === 'tag' ? `[data-tag-id="${d.id}"]` : `[data-comment-id="${d.id}"]`);
    if (fresh && fresh !== d.marker) {
      fresh.classList.add('dragging');
      d.marker = fresh;
    } else if (!fresh) {
      // 마커가 아예 사라짐(삭제·페이지 전환 등) — 더 이상 따라갈 대상 없음
      _dragCandidate = null;
      _isDragging = false;
      return;
    } else {
      d.marker.classList.add('dragging');
    }
  }
  const rect = previewBody.getBoundingClientRect();
  let xPct = ((e.clientX - rect.left) / rect.width) * 100;
  let yPct = ((e.clientY - rect.top) / rect.height) * 100;
  xPct = Math.max(0, Math.min(100, xPct));
  yPct = Math.max(0, Math.min(100, yPct));
  // 태그인지 코멘트인지 구분
  if (d.kind === 'tag') {
    const tag = state.tags.find(t => t.id === d.id);
    if (!tag) return;
    tag.x_pct = xPct;
    tag.y_pct = yPct;
    d.marker.style.left = xPct + '%';
    d.marker.style.top = yPct + '%';
  } else {
    const c = state.comments.find(x => x.id === d.id);
    if (!c) return;
    c.x_pct = xPct;
    c.y_pct = yPct;
    d.marker.style.left = xPct + '%';
    d.marker.style.top = yPct + '%';
  }
}

function onDragEnd() {
  const d = _dragCandidate;
  if (!d) return;
  _dragCandidate = null;
  _isDragging = false;
  // .dragging 제거를 가장 먼저: 클릭(!d.moved)이든 드래그(d.moved)든,
  // 그리고 blur/pointercancel/pointerup 폴백 경로를 통하든 어떤 경우든
  // scale(1.25)가 영구 잔존하지 않도록 클래스 제거를 early return 앞에 둔다.
  // '드래그 시작 시점'의 d.marker가 아니라 지금 살아있는 마커 기준으로.
  // 드래그 중 renderTagMarkers가 overlay.innerHTML=''로 마커를 교체하면 d.marker는
  // 죽은 노드 — 거기서 클래스를 빼도 화면 버튼에 남아 scale(1.25)이 영구 잔존한다.
  const sel = d.kind === 'tag' ? `[data-tag-id="${d.id}"]` : `[data-comment-id="${d.id}"]`;
  const live = $('tagOverlay').querySelector(sel);
  if (live) {
    live.classList.remove('dragging');
  } else {
    $('tagOverlay').querySelectorAll(sel).forEach(n => n.classList.remove('dragging'));
  }
  if (!d.moved) return; // 움직이지 않은 클릭 → 위치 저장은 하지 않음
  state.draggingTagId = null;
  if (d.kind === 'tag') {
    const tag = state.tags.find(t => t.id === d.id);
    if (tag) moveTagPosition(d.id, tag.x_pct, tag.y_pct);
  } else {
    const c = state.comments.find(x => x.id === d.id);
    if (c && !c.id.startsWith('pending-')) {
      state._commentJustDragged = true;
      moveCommentPosition(c, c.x_pct, c.y_pct);
    }
  }
}
async function moveCommentPosition(c, xPct, yPct) {
  try {
    // id 파싱: 서버가 "c"+숫자 문자열로 반환하므로 접두사만 제거.
    // 숫자 그대로면 그대로 사용. parseInt로 강제 변환해 NaN/404 방지.
    const cid = c.id.startsWith('c') ? parseInt(c.id.slice(1), 10) : parseInt(String(c.id), 10);
    if (isNaN(cid)) { console.warn('[moveCommentPosition] 잘못된 코멘트 id:', c.id); return; }
    // api() 헬퍼는 실패 시 throw, 성공 시 JSON 반환 — catch에서 저장 실패를 잡아 콘솔에 남긴다.
    // (이전 구현은 catch가 비어 있어 PUT 404/403이 조용히 사라져 '고정 안 됨' 원인을 찾지 못했다.)
    await api(`/api/comments/${cid}`, {
      method: 'PUT', body: JSON.stringify({ content: c.content, email: currentUserEmail(), x_pct: xPct, y_pct: yPct })
    });
    c.x_pct = xPct;
    c.y_pct = yPct;
  } catch (e) {
    console.error('[moveCommentPosition] 위치 저장 실패:', e.message, '| id:', c.id, '| 좌표:', xPct, yPct);
  }
}

// ─── 글머리(불릿) 공용 로직 ────────────────────────────────────────────────
// execCommand('insertUnorderedList')는 contenteditable + 복합 노드(멘션 칩·<b>·<br>)
// 환경에서 예측 불가능하고 jsdom에서도 검증이 불가능해 반복 실패의 원인이 됐다.
// 그래서 DOM을 직접 조작한다: "커서가 있는 한 줄"만 <li>로 감싸거나 풀어낸다.
//
// 좌표계 규칙 (단일 소스): div 자손을 DOM 순서로 평문으로 펼칠 때
//   - 텍스트 노드 → 그 문자열
//   - <br>        → '\n'
//   - <ul>/<ol>   → 시작/끝 각 1개 '\n' (li가 있을 때만)
//   - 멘션 칩     → '@이름'
// 이 규칙은 toFmtHtml / saveComment 의 walk()와 일치한다.
function _fmtFlatten(root) {
  const units = [];
  // 모든 요소(b/i/span 등 포맷 태그 포함)의 자식을 재귀 순회하되,
  // 텍스트 노드는 무조건 unit으로 push한다 — bounds 테이블에 없으면
  // 커서 매칭(_fmtCursorFlatIdx)이 실패해 fallback이 다른 줄을 골랐다.
  const visit = node => {
    for (const c of node.childNodes) {
      if (c.nodeType === 3) {
        units.push({ text: c.nodeValue, node: c });
      } else if (c.nodeType !== 1) continue;
      else if (c.tagName === 'BR') {
        units.push({ text: '\n', node: c });
      } else if (c.classList && c.classList.contains('mention-chip')) {
        const name = c.dataset.mention || (c.textContent || '').replace(/^@/, '').trim();
        units.push({ text: '@' + name, node: c });
      } else if (c.tagName === 'UL' || c.tagName === 'OL') {
        // UL/OL 자체는 flat 문자열에 아무것도 기여하지 않는다.
        // 줄 경계는 _fmtSplitLines 가 LI 노드를 기준으로 잡으므로,
        // flatten 에 '\n'을 넣으면 flat 좌표계와 lines 의 오프셋이 벌어져
        // 커서가 있는 줄이 아닌 다른 줄에 불릿이 붙는다.
        visit(c);
      } else if (c.tagName === 'DIV' || c.tagName === 'P') {
        // 브라우저 contenteditable 에서 Enter 로 생성되는 블록 자식(div/p).
        // 전 형제 블록과 이 블록 사이의 줄바꿈 1개를 flat 문자열에 더한다 —
        // 이렇게 하지 않으면 <div> 첫째</div><div>둘째</div> 구조에서
        // flatString="첫째둘째" 처럼 줄바꿈이 사라져 커서 인덱스가 어긋난다.
        if (units.length) units.push({ text: '\n', node: c });
        visit(c);
      } else {
        visit(c);
      }
    }
  };
  visit(root);
  return units;
}

// flat 문자열 + 각 unit의 [start,end) 경계 테이블.
function _fmtFlatIndex(units) {
  let s = '';
  const bounds = [];
  for (const u of units) {
    bounds.push({ start: s.length, end: s.length + u.text.length, unit: u });
    s += u.text;
  }
  return { s, bounds };
}

// anchorNode(+offset)가 flat 좌표계에서 어느 인덱스인지.
// 텍스트/브/칩 노드 → 해당 unit 시작 + offset.
// element 노드 → 그 element *앞*까지의 flat 길이 (자식 순회로 계산).
// 커서 flat 인덱스. 반드시 _fmtFlatten 과 *같은* unit 순서와 length 규칙으로만
// 계산해야 한다 — bounds(단일 flat 문자열 경계)가 유일한 좌표계 기준이다.
// 이전 버전은 element anchorNode 경우 별도 walk 으로 누적했는데, 그 walk 은
// DIV/P 블록 사이 '\n' 을 세지 않아 div-입력 다중 줄에서 ci 가 실제 flat 길이보다
// 크게 나와 (셋째 줄 커서 → ci=9 > s.length=8) _fmtLineAt 매칭 실패 → 빈 li 생성 →
// appendChild TypeError 로 버튼이 동작하지 않았다.
// 지금은 bounds 테이블(unit.node === anchorNode)만 신뢰하고, 안 있으면
// units 와 동일한 순서의 walk 하나로 누적한다.
function _fmtCursorFlatIdx(units, anchorNode, offset) {
  if (!anchorNode) return null;
  const { bounds } = _fmtFlatIndex(units);
  for (const b of bounds) {
    if (b.unit.node === anchorNode) return b.start + Math.min(offset, b.unit.text.length);
  }
  // element anchor: _fmtFlatten 과 *완전히 같은* visit 규칙으로 walk 한다.
  // 이전 버전은 "첫" unit 이 anchor 일 때만 bounds 를 쓰고 그 외엔 별도 walk 으로
  // 누적했는데, 그 walk 은 DIV/P 블록 경계의 '\n'(길이 1)을 세지 않아
  // <div>첫째</div><div>둘째</div><div>셋째</div> 구조에서 셋째 줄 커서가
  // ci=9 로 나와 s.length=8 을 초과 → _fmtLineAt 매칭 실패 → fallback 이
  // 다른 줄을 골라 글머리 기호가 잘못된 줄에 붙었다.
  // 지금은 units(_fmtFlatten 결과) 하나만으로 계산한다:
  //   - text/br/chip unit → 그 unit.text.length (bounds 와 동일)
  //   - DIV/P unit        → '\n' 길이 1 (_fmtFlatten 이 넣는 블록 경계)
  //   - UL/OL             → 자손 LI 텍스트 길이만 (flat 에 기여하는 부분)
  // anchorNode 가 어느 unit 에 속하는지 DOM 순서로 찾아 그 unit 시작 위치까지
  // 누적한 뒤 offset 을 더한다. bounds 테이블과 동일한 좌표계가 보장된다.
  // _fmtFlatten 과 같은 좌표계: 각 LI 텍스트 뒤에 줄바꿈 '\n'(길이 1)이 온다.
// 이 +1 없이 누적하면 UL/OL 뒤 일반 줄의 flat 오프셋이 어긋나 커서 인덱스가
// 다른 줄을 가리켜 글머리 기호가 붙지 않았다.
const ulLiLen = el => [...el.children].filter(x => x.tagName === 'LI')
    .reduce((a, li) => a + (li.textContent || '').length + 1, 0);
  const contains = (root, n) => root === n || (root.contains && root.contains(n));
  let idx = 0;
  for (const u of units) {
    if (!u.node) continue;
    if (contains(u.node, anchorNode)) {
      idx += Math.min(offset, (u.text || '').length);
      return idx;
    }
    if (u.text === '\n' && u.node.nodeType === 1 &&
        (u.node.tagName === 'DIV' || u.node.tagName === 'P')) {
      idx += 1; // _fmtFlatten 이 추가한 블록 경계
    } else if (u.node.nodeType === 1 && (u.node.tagName === 'UL' || u.node.tagName === 'OL')) {
      idx += ulLiLen(u.node);
    } else {
      idx += (u.text || '').length;
    }
  }
  // anchorNode 가 div 밖(예: body)이면 마지막 unit 끝이 가장 가까운 값.
  return idx;
}

// flat 문자열 s 에서 인덱스 i 가 속한 줄(두 '\n' 사이)의 [start, end) 반환.
function _fmtLineAt(s, i) {
  const lo = s.lastIndexOf('\n', Math.max(0, i - 1)) + 1;
  const hi = s.indexOf('\n', i);
  return [lo, hi === -1 ? s.length : hi];
}

// div 자손을 "논리 줄" 단위로 분할하되, 각 노드에 flat 좌표계의 시작/끝을 부여한다.
// 단일 소스: _fmtFlatten 과 *같은 순서·같은 규칙*으로 walk 하면서 누적해
// 각 unit에 [start,end)를 달아 반환한다. 이 테이블만 믿으면 커서 인덱스와
// 줄 범위가 같은 좌표계라 매칭이 어긋날 수 없다.
//   - 텍스트/브/칩 → unit ({text,node}) — _fmtFlatten 의 units와 동일
//   - UL/OL        → 그 안의 LI 텍스트만 누적 (flat 문자열에도 기여)
//   - 일반 요소(b/i/span 등) → 자식을 재귀 순회
//   - 빈 줄(텍스트 없는 BR 경계) → {empty:true, start, end}
function _fmtSplitLinesWithBounds(root) {
  const lines = [];
  let pos = 0;
  let cur = null; // {nodes:[unit...], start, end} | {empty:true,start,end}
  const openCur = () => {
    if (!cur) cur = { nodes: [], start: pos, empty: true };
  };
  const closeCur = () => {
    if (!cur) return;
    cur.end = pos;
    lines.push(cur);
    cur = null;
  };
  const addUnit = u => {
    openCur();
    cur.empty = false;
    cur.nodes.push(u);
    pos += u.text.length;
  };
  const visit = node => {
    for (const c of node.childNodes) {
      if (c.nodeType === 3) {
        addUnit({ text: c.nodeValue, node: c });
      } else if (c.nodeType !== 1) continue;
      else if (c.tagName === 'BR') {
        // BR 은 _fmtFlatten 과 똑같이 flat 문자열에 '\n'(길이 1)으로 기여한다.
        // contrib만 추가하고 cur은 닫지 않는다(줄 개수/경계는 안 변함).
        // 이렇게 하지 않으면 ci 가 줄바꿈 포함 좌표계인데 lines 테이블이
        // 줄바꿈 없는 좌표계라 매칭(ln.start<=ls && ln.end>=le)이 실패해
        // fallback 이 커서가 아닌 다른 줄을 골랐다.
        openCur();
        cur.empty = false;
        cur.nodes.push({ text: '\n', node: c });
        pos += 1;
        closeCur();
      } else if (c.classList && c.classList.contains('mention-chip')) {
        const name = c.dataset.mention || (c.textContent || '').replace(/^@/, '').trim();
        addUnit({ text: '@' + name, node: c });
      } else if (c.tagName === 'UL' || c.tagName === 'OL') {
        closeCur();
        for (const li of c.children) {
          if (li.tagName !== 'LI') continue;
          const t = li.textContent || '';
          // _fmtFlatten 과 같은 좌표계: LI 텍스트 뒤에 '\n'(길이 1)이 온다.
          lines.push({ nodes: [{ text: t + '\n', node: li }], isLi: true, start: pos, end: pos + t.length + 1 });
          pos += t.length + 1;
        }
        closeCur();
      } else if (c.tagName === 'DIV' || c.tagName === 'P') {
        // 브라우저 Enter 로 생긴 블록 자식 — _fmtFlatten 과 동일하게
        // 이전 블록과의 경계에 '\n'(길이 1)을 더한 뒤 재귀.
        if (pos > 0 || cur) pos += 0; // noop — 누적은 addUnit 에서
        openCur();
        cur.empty = false;
        cur.nodes.push({ text: '\n', node: c });
        pos += 1;
        closeCur();
        visit(c);
      } else {
        visit(c);
      }
    }
  };
  visit(root);
  closeCur();
  return lines;
}

// 한 줄의 nodes를 <li>로 감싼다. (이미 li면 그대로)
// line.nodes 가 비어 있으면(예: 커서가 <b>/<i> 같은 포맷 태그 안에 있어
// _fmtSplitLines 가 그 자손을 visit하지 못해 노드를 모으지 못한 경우)
// flat 문자열에서 해당 줄 경계 [ls, le)를 찾아 div 전체를 순회하며
// 그 범위에 해당하는 텍스트/칩 노드만 모은다.
function _fmtWrapLine(doc, line, ls, le, s, div) {
  // <li> 안에 들어갈 노드는 반드시 flat 좌표계(bounds) 기준 [ls, le) 범위의
  // *실제 DOM 노드*만이다. line.nodes 는 {text, node} unit 객체 배열이라 그대로
  // 쓰면 cloneNode 가 없고, DIV 컨테이너까지 포함되면 appendChild 가 죽는다.
  // → 항상 bounds(_fmtFlatIndex) 테이블 하나에서 모은다(단일 소스).
  let nodes = [];
  if (div && ls != null && le != null) {
    const { bounds } = _fmtFlatIndex(_fmtFlatten(div));
    for (const b of bounds) {
      if (!b.unit.node || b.unit.text === '\n') continue;   // 줄바꿈·노드 없는 unit 제외
      if (b.end > ls && b.start < le) nodes.push(b.unit.node);
    }
  } else if (line && line.isLi) {
    nodes = [line.nodes[0].node || line.nodes[0]];
  }
  const li = doc.createElement('li');
  for (const n of nodes) li.appendChild(n.cloneNode(true));
  return li;
}

// 한 줄을 ul 밖의 일반 텍스트로 복원한다. (li면 내용만 꺼냄)
function _fmtUnwrapLine(doc, line) {
  const frag = doc.createDocumentFragment();
  if (line.isLi) {
    // nodes[0] 은 flatLines 의 통일된 unit 객체 { text, node } — 실제 <li> 는 .node 에 있다.
    // 이전 버전은 units 가 아직 통일되기 전이라 nodes[0] 이 DOM 노드 그 자체였는데,
    // flat 좌표계(bounds 단일 소스)로 바꾼 뒤엔 반드시 .node 로 추출해야 한다.
    const liEl = line.nodes[0].node || line.nodes[0];
    for (const c of [...liEl.childNodes]) frag.appendChild(c.cloneNode(true));
  } else {
    for (const n of line.nodes) frag.appendChild(n.parentNode ? n.cloneNode(true) : n);
  }
  return frag;
}

// 핵심: div 안에서 "커서가 있는 한 줄"만 불릿 토글.
//   - 커서가 <li> 안이면 → 그 li를 ul 밖으로 빼기 (unwrap)
//   - 커서가 일반 텍스트에 있으면 → 그 한 줄을 <ul><li>로 감싸기 (wrap)
//   - 커서를 특정할 수 없으면 → 첫 번째 비어 있지 않은 줄 대상
// 드래그 선택은 지원하지 않는다 (버튼 클릭 시 collapsed selection이 기본).
// 전역 fmtDiv: renderTagList() 내 enterFmtMode/updateFmtBtnStates/태스크 핸들러와
// 전역 헬퍼(fmtToggleBullet 등), 그리고 1817줄 전역 호출부가 모두 이 단일 전역 변수를
// 공유한다. 이전엔 let fmtDiv(함수 스코프) 만 존재해 전역에서 이름 미정의 →
// ReferenceError "fmtDiv is not defined" 가 버튼 클릭마다 발생했다.
let fmtDiv = null;
function fmtToggleBullet(div) {
  const sel = window.getSelection();
  try {
    console.log('[FMT] fmtToggleBullet start', div.innerHTML);
  } catch (e) {}
  const units = _fmtFlatten(div);
  const { s, bounds } = _fmtFlatIndex(units);
  const lines = _fmtSplitLinesWithBounds(div);
  try {
    console.log('[FMT] flatten ok. flatString=', JSON.stringify(s));
    console.log('[FMT] bounds=', bounds.map(b => [b.start, b.end, JSON.stringify(b.unit.text)]));
    console.log('[FMT] lines=', lines.map(ln => ({start: ln.start, end: ln.end, empty: !!ln.empty, nodes: ln.nodes.map(n => n.nodeType === 3 ? 't:' + JSON.stringify(n.nodeValue) : (n.tagName||'?'))})));
  } catch (e) { console.log('[FMT] post-flatten error:', e.message); }

  // 커서 flat 인덱스
  // JSDOM/일부 브라우저에서는 버튼 클릭 시 selection 이 div 밖으로 이탈해
  // anchorNode 가 div 자손이 아닐 수 있다. rangeStartContainer 만 믿지 말고
  // div 안에 실제로 존재하는 노드인지 확인한 뒤에만 사용한다.
  let ci = null;
  if (sel && sel.rangeCount) {
    const an = sel.anchorNode;
    if (an && (an === div || div.contains(an))) {
      ci = _fmtCursorFlatIdx(units, an, sel.anchorOffset);
    }
  }

  // 대상 줄 찾기 — lines 의 각 노드 flat 길이가 _fmtFlatten 과 *완전히* 같은 규칙으로
  // 계산되어야 한다. (chip → '@'+이름, UL/OL → '\n'+li 텍스트+'\n', 일반 요소 → textContent)
  // 이 규칙이 어긋나면 누적 오프셋이 벌어져 커서가 있는 줄이 아닌 다른 줄에 불릿이 붙는다.
  const _nodeFlatLen = n => {
    if (n.nodeType === 3) return n.nodeValue.length;
    if (n.tagName === 'BR') return 1;
    if (n.classList && n.classList.contains('mention-chip'))
      return ('@' + (n.dataset.mention || (n.textContent || '').replace(/^@/, '').trim())).length;
    if (n.tagName === 'UL' || n.tagName === 'OL') {
      // UL/OL 은 flat 문자열에 기여하지 않으므로 자식 LI 텍스트 길이만 반환.
      return [...n.children].filter(x => x.tagName === 'LI').reduce((a, li) => a + li.textContent.length, 0);
    }
    return (n.textContent || '').length;
  };
  // ── 대상 줄 찾기: bounds(단일 flat 문자열 경계 테이블) 하나만 쓴다 ──
  // lines(_fmtSplitLinesWithBounds)의 start/end 가 _fmtFlatten 과 완전히 같은
  // 순서·규칙으로 누적되도록 보장해야 하므로, 여기서 한 번 더 재계산하지 않고
  // bounds 로부터 "줄"을 직접 만든다. 줄 경계는 '\n' unit 이고, UL/OL 은 그 안의
  // LI 텍스트가 flat 에 기여하므로 하나의 li = 하나의 줄로 취급한다.
  // 이전 버전은 lines 테이블과 별도 walk 을 병행했는데 두 좌표계가 어긋나
  // fallback 이 커서가 없는 줄을 골라 글머리 기호가 잘못된 줄에 붙었다.
  // ── 대상 줄 찾기: bounds(단일 flat 문자열 경계 테이블) 하나만 쓴다 ──
  // lines(_fmtSplitLinesWithBounds)의 start/end 가 _fmtFlatten 과 완전히 같은
  // 순서·규칙으로 누적되도록 보장해야 하므로, 여기서 한 번 더 재계산하지 않고
  // bounds 로부터 "줄"을 직접 만든다. 줄 경계는 '\n' unit 이고, UL/OL 은 그 안의
  // LI 텍스트가 flat 에 기여하므로 하나의 li = 하나의 줄로 취급한다.
  // 이전 버전은 lines 테이블과 별도 walk 을 병행했는데 두 좌표계가 어긋나
  // fallback 이 커서가 없는 줄을 골라 글머리 기호가 잘못된 줄에 붙었다.
  // ── flatLines: units 하나만 근거로 만든다 ──
  // _fmtFlatten 은 UL/OL 자체를 flat 에 넣지 않고 자손만 재귀하므로,
  // "UL unit"은 존재하지 않는다. 따라서 LI 라인은 각 unit.node 를 closest('li')
  // 로 검사해 묶는다 — 같은 <li> 안의 연속 unit 들이 한 unwrap 대상이다.
  // 리 밖 DIV/P 사이 '\n' unit 과 BR '\n' unit 이 일반 줄의 경계다.
  const flatLines = [];
  {
    let p = 0;
    let cur = null;         // 일반(리 밖) 줄 누적 중
    let curLi = null;       // { li: DOM 노드, line: flatLines 항목 }
    const closeCur = () => { if (cur) { cur.end = p; flatLines.push(cur); cur = null; } };
    const closeLi = () => { if (curLi) { curLi.line.end = p; flatLines.push(curLi.line); curLi = null; } };
    for (const u of units) {
      if (u.text === '\n' && u.node && u.node.nodeType === 1 &&
          (u.node.tagName === 'DIV' || u.node.tagName === 'P')) {
        closeCur(); closeLi();
        p += 1;
        continue;
      }
      if (u.text === '\n') {           // BR
        closeCur(); closeLi();
        p += 1;
        continue;
      }
      const liOf = (u.node && u.node.nodeType === 1) ? u.node.closest('li')
                  : (u.node && u.node.nodeType === 3 && u.node.parentElement) ? u.node.parentElement.closest('li')
                  : null;
      if (liOf) {
        // <li> 내부 텍스트 → isLi 라인
        if (!curLi || curLi.li !== liOf) {
          closeCur(); closeLi();
          const line = { nodes: [], isLi: true, li: liOf, start: p, empty: false };
          curLi = { li: liOf, line };
        }
        curLi.line.nodes.push(u);
      } else {
        // 리 밖 → 일반 라인
        if (!cur) cur = { nodes: [], start: p, empty: true };
        cur.empty = false;
        cur.nodes.push(u);
      }
      p += u.text.length;
    }
    closeCur(); closeLi();
    // nodes[0] 을 {text,node} unit 에서 실제 DOM 노드로 통일해 둔다 —
    // isLi 라인의 nodes[0].node 가 곧 <li>, 일반 라인은 unit 배열 그대로.
    for (const ln of flatLines) {
      if (ln.isLi) {
        ln.nodes = [{ text: (ln.nodes[0] && ln.nodes[0].text) || '', node: ln.li }];
        delete ln.li;
      }
    }
  }

  let targetLine = null;
  if (ci != null) {
    const [ls, le] = _fmtLineAt(s, ci);
    // ci 가 속한 flat 범위 [ls,le) 와 겹치는 줄.
    // ci 가 '\n' 위에 있으면 ls=le 이 되어 아무 줄도 포함되지 않으므로
    // ci 가 포함된 [ls, le+1) 범위로 확장해 인접 줄을 잡는다.
    const rangeEnd = le > ls ? le : Math.min(le + 1, s.length);
    for (const ln of flatLines) {
      if (ln.isLi) {
        if (ci >= ln.start && ci <= ln.end) { targetLine = ln; break; }
        continue;
      }
      if (ln.empty) continue;
      if (ln.start <= ls && ln.end >= rangeEnd) { targetLine = ln; break; }
      if (ln.start < rangeEnd && ln.end > ls) { targetLine = ln; break; }
    }
    // 위 매칭 실패 시: ci 와 가장 가까운 비어 있지 않은 줄
    if (!targetLine) {
      let best = null, bestDist = Infinity;
      for (const ln of flatLines) {
        if (ln.empty) continue;
        const d = (ci < ln.start) ? (ln.start - ci) : (ci > ln.end ? ci - ln.end : 0);
        if (d < bestDist) { bestDist = d; best = ln; }
      }
      targetLine = best;
    }
  }
  if (!targetLine) {
    // 마지막 수단: 첫 번째 비어 있지 않은 줄
    targetLine = flatLines.find(ln => !ln.empty) || null;
  }
  if (!targetLine) return;

  const doc = div.ownerDocument;
  if (targetLine.isLi) {
    // ── unwrap: li → 일반 텍스트 (ul 밖으로) ──
    // flatLines 의 isLi 라인에서는 nodes[0] 이 {text,node} unit 객체이므로
    // 실제 DOM 노드는 .node 프로퍼티에 있다. 기존 lines(_fmtSplitLinesWithBounds)
    // 의 isLi 라인은 nodes[0] 이 이미 DOM 노드(li)였는데, 이제 flatLines 단일 소스
    // 로 통일하면서 이 차이를 반영한다.
    const liNode = targetLine.nodes[0].node || targetLine.nodes[0];
    const parentUl = liNode.parentElement;
    const frag = _fmtUnwrapLine(doc, targetLine);
    if (!frag.textContent.trim()) {
      liNode.remove();
    } else {
      // unwrap 전: ul 앞의 br(첫째 줄과 ul을 잇는 경계)를 기억해 둔다.
      // 이 br가 없으면 replaceWith 후 "첫째"와 frag 사이에 아무것도 없어
      // 첫 번째 줄이 두 번째 줄에 붙는다 ("첫째셋째").
      const brBeforeUl = parentUl && parentUl.previousSibling &&
        parentUl.previousSibling.nodeType === 1 && parentUl.previousSibling.tagName === 'BR';
      liNode.replaceWith(frag);
      // 남은 형제 li 사이 줄바꿈 보존
      if (parentUl && parentUl.querySelector('li')) {
        const prevFragEnd = frag.lastChild;
        const nextLi = prevFragEnd && prevFragEnd.nextElementSibling;
        if (nextLi && nextLi.tagName === 'LI') {
          parentUl.insertBefore(doc.createElement('br'), nextLi);
        }
      }
    }
    // 빈 ul 정리 — 단, ul 앞의 br가 이미 있으면 그 br 하나면 충분하므로
    // 새 br를 만들지 않는다. (없으면 make-before/replace-with-br 로 한 줄 유지)
    if (parentUl && (parentUl.tagName === 'UL' || parentUl.tagName === 'OL') && !parentUl.querySelector('li')) {
      if (!(parentUl.previousSibling && parentUl.previousSibling.nodeType === 1 &&
            parentUl.previousSibling.tagName === 'BR')) {
        parentUl.replaceWith(doc.createElement('br'));
      } else {
        parentUl.remove();
      }
    }
  } else {
    // ── wrap: 일반 줄 → <ul><li> ──
    // line.nodes 가 비어 있으면 flat 좌표계 [ls, le) 범위에서 노드를 수집해 wrap.
    let lsForWrap = null, leForWrap = null;
    if (!targetLine.nodes.length && ci != null) {
      const [lsw, lew] = _fmtLineAt(s, ci);
      lsForWrap = lsw; leForWrap = lew;
    }
    // ── wrap: flat 좌표계(bounds 단일 소스)에서 [ls, le) 범위의 실제 DOM 노드를
    // 모아서 <ul><li>로 감싼다. line.nodes 는 unit 객체({text,node})라 그대로 쓰면
    // cloneNode/parentNode 가 없어 죽으므로 항상 bounds 테이블만 신뢰한다.
    let lsW = null, leW = null;
    if (ci != null) {
      const [lsw, lew] = _fmtLineAt(s, ci);
      lsW = lsw; leW = lew;
    } else {
      // 커서를 특정할 수 없는 경우 대상 줄의 flat 범위 자체를 사용.
      lsW = targetLine.start; leW = targetLine.end;
    }
    const li = _fmtWrapLine(doc, targetLine, lsW, leW, s, div);
    if (!li.textContent.trim()) return; // 빈 줄은 무시
    const ul = doc.createElement('ul');
    ul.appendChild(li);
    // [lsW, leW) 범위의 노드 중 *첫 번째* 노드 자리에 ul을 넣고, 나머지 노드는 제거.
    // 이 두 집합은 반드시 같은 bounds 테이블에서 구해야 한다 —
    // line.nodes 와 bounds 를 섞어 쓰면 같은 노드가 두 번 제거되거나
    // 클론만 들어가고 원본이 남아 "둘째"가 두 번 그려지는 버그가 생긴다.
    const { bounds } = _fmtFlatIndex(_fmtFlatten(div));
    const rangeNodes = [];
    for (const b of bounds) {
      if (!b.unit.node || b.unit.text === '\n') continue;
      if (b.end > lsW && b.start < leW) rangeNodes.push(b.unit.node);
    }
    if (!rangeNodes.length) return;
    const first = rangeNodes[0];
    const parent = first.parentNode || div;
    parent.insertBefore(ul, first.nextSibling);
    for (const n of rangeNodes) {
      if (n.parentNode) n.parentNode.removeChild(n);
    }
  }
}
// ─── Utility ───────────────────────────────────────────────────────────────
// contenteditable 디스크립션 박스의 "실제로 비어 있는가"를 판단해 is-empty 클래스를
// 토글한다. CSS :empty 는 <br> 하나만 있어도 성립하지 않고, :has() 조건은 편집 중
// DOM이 바뀌는 순간 재평가 타이밍 문제로 placeholder 가 계속 노출되는 버그가 있어서
// JS가 직접 관리한다. 텍스트 노드(공백 제외)나 mention 칩 등 실제 내용이 있으면
// false, 빈 문자열이거나 <br>만 있으면 true.
function updateDescEmptyState(div) {
  if (!div) return;
  let hasContent = false;
  for (const node of div.childNodes) {
    if (node.nodeType === Node.TEXT_NODE && node.nodeValue.trim() !== '') { hasContent = true; break; }
    if (node.nodeType === Node.ELEMENT_NODE && node.tagName !== 'BR') { hasContent = true; break; }
  }
  div.classList.toggle('is-empty', !hasContent);
}

function toFmtHtml(text) {
  // <굵게> 마커는 escHtml 전에 보호해야 한다 — escHtml이 <를 &lt;로 바꾸면 치환 불가.
  const protected_ = (text || '')
    .replace(/<굵게>/g, '\x00B\x00')
    .replace(/<\/굵게>/g, '\x00\/B\x00');
  const lines = protected_.split('\n');
  const htmlLines = lines.map(line => {
    let esc = String(line).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    esc = esc.replace(/\x00B\x00/g, '<b>').replace(/\x00\/B\x00/g, '</b>');
    if (/^•\s/.test(line)) return `<li>${esc.replace(/^•\s*/, '')}</li>`;
    return esc;
  });
  // 일반 텍스트 줄(비어 있으면 빈 줄 포함)은 <br>으로 이어붙여야 exitFmtMode의
  // BR→'\n' 규칙에서 원래 줄바꿈이 복원된다. <br> 없이 나란히 놓으면 DOM 순서가
  // 한 줄로 합쳐져 "첫째\n둘째"가 "첫째둘째"로 저장되던 버그.
  let out = '';
  let inUl = false;
  htmlLines.forEach((h, i) => {
    const isLi = /^<li>/.test(h);
    if (isLi && !inUl) { out += '<ul>'; inUl = true; }
    // ul에서 일반 텍스트로 전환: </ul> 뒤에 <br> 없이 바로 이어도 walk()에서
    // "</ul>"이 마지막 자식이고 다음 br의 \n이 붙어 개행이 생김.
    else if (!isLi && inUl) { out += '</ul>'; inUl = false; }
    out += h;
    // 엔터 1회 = 줄바꿈 1개: 일반 텍스트 줄 사이에는 <br> 하나만 붙인다.
    // (예전엔 빈 줄 표현을 위해 <br><br>를 두어 엔터 1회가 저장값에 \n\n 으로
    //  기록되어 "줄바꿈이 항상 1회 더 추가되는" 버그가 있었다.)
    if (!isLi && i < htmlLines.length - 1) out += '<br>';
  });
  if (inUl) out += '</ul>';
  return out;
}

// contenteditable(.tag-fmt-div)의 HTML을 평문 규칙으로 변환하는 standalone 함수.
// exitFmtMode()와 saveComment()에 각각 내장되어 있던 walk() 규칙과 완전히 동일하다 —
// 문자열 치환 방식이 "<굵게><b>" 이중 마커, "• •" 중복, 빈 <li> 잔존 같은 문제를
// 일으키므로 DOMParser로 노드 단위로 파싱한다. toFmtHtml()의 역방향 변환이다.
function fmtDivToPlain(html) {
  const doc = new DOMParser().parseFromString('<body>' + (html || '') + '</body>', 'text/html');
  // 빈 <b>/<strong>와 빈 <li>는 제거 — 서식만 바꾼 뒤 내용을 쓰지 않으면 마커만 남는 걸 막음.
  doc.body.querySelectorAll('b,strong').forEach(el => { if (!el.textContent.trim()) el.remove(); });
  doc.body.querySelectorAll('li').forEach(li => { if (!li.textContent.trim()) li.remove(); });
  const unescape = s => s.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
  let out = '';
  const isBoldEl = el => /^(B|STRONG)$/.test(el.tagName);
  const walk = (node, bold) => {
    for (const child of node.childNodes) {
      if (child.nodeType === 3) {           // 텍스트
        if (/^\s+$/.test(child.textContent)) continue;  // 태그 사이 공백 노드 무시
        out += unescape(child.textContent);
      } else if (child.nodeType !== 1) {    // 코멘트 등은 무시
        continue;
      } else {                              // 요소
        const tag = child.tagName;
        if (child.classList && child.classList.contains('mention-chip')) {  // 멘션 칩 → 평문 @이름
          out += '@' + (child.dataset.mention || (child.textContent || '').replace(/^@/, '').trim());
          continue;
        }
        // BR→'\n': 직전 문자가 이미 '\n'이면 생략 — DIV 경계와 BR의 개행이 중복되는 것을 막는다.
        // 연속 BR은 각각 '\n'을 추가해 빈 줄(엔터 2회)을 보존한다. 캐핑(\n{3,}→\n\n)은
        // 마지막 정규식으로만 적용해 walk 단계에서는 개행을 정확히 세도록 한다.
        if (tag === 'BR') {
          let sib = child.nextSibling;
          while (sib && sib.nodeType === 3 && !/\S/.test(sib.textContent)) sib = sib.nextSibling;
          const isBlockNext = sib && sib.nodeType === 1 && /^(DIV|P|UL|OL|LI)$/.test(sib.tagName);
          if (!isBlockNext) out += '\n';
          continue;
        }
        if (tag === 'LI') {                 // 글머리 항목: "• " 접두어 + 뒤 줄바꿈
          out += '• ';
          walk(child, bold);
          out += '\n';
          continue;
        }
        if (tag === 'UL' || tag === 'OL') { // 목록 컨테이너: 자식만 순회 — LI마다 이미 \n 을 넣으므로 중복 개행 없음
          walk(child, bold);
          continue;
        }
        if (isBoldEl(child)) {              // 굵게: <굵게>…</굵게> 마커
          if (!bold) out += '<굵게>';       // 이미 굵은 영역 안에 있으면 마커 중복 방지
          walk(child, true);
          if (!bold) out += '</굵게>';
          continue;
        }
        if (tag === 'DIV' || tag === 'P') { // 블록: 앞쪽 '\n'. 직전 문자가 이미 '\n'이면 생략해
          // DIV 경계 개행이 정확히 1개가 되도록 한다. 엔터 1회=\n, 엔터 2회(빈 줄)=\n\n.
          // 빈 줄은 중간 DIV의 <br>가 \n 을 만들어 보존된다.
          if (!(out && out[out.length - 1] === '\n')) out += '\n';
          walk(child, bold);
          continue;
        }
        walk(child, bold);                  // SPAN 등: 내용만
      }
    }
  };
  walk(doc.body, false);
  return out
    .replace(/[ \t]+\n/g, '\n')   // 줄 끝 공백
    .replace(/(•[^\n]*\n)\n+/g, '$1')
    // [수정] 캐핑 제거 — 엔터 N회 = \n N개가 정확히 보존되어야 한다.
    // 예전엔 "\n{3,}→\n\n" 캐핑이 있어 엔터 3회(빈 줄 2개) 입력 시 \n\n\n → \n\n 으로 압축되어
    // "줄바꿈 2개 이상 인식이 안 된다"는 버그가 있었다. walk 단계에서 BR은 각각 '\n' 하나씩
    // 넣고, DIV 경계는 직전 '\n' 확인으로 중복을 이미 막아 놓았으므로 캐핑 없이도 안전하다.
    .replace(/^\n+/, '')
    .replace(/\n$/, '');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ─── @멘션 자동완성 ────────────────────────────────────────────────────────
// contenteditable 태그가 달린 모든 입력 박스(.tag-fmt-div)에서 '@'를 치면
// 그 자리 바로 위에 팀원 목록 드롭다운이 뜨고, 키보드(↑↓/Enter/Esc)와 클릭으로
// 고르면 해당 지점에 파란색 칩 <span class="mention-chip">@이름</span> 이 붙는다.
// 칩은 저장 시 평문 "@이름" 으로 다시 되돌아오고, 읽기 렌더(fmtToHtml)에서
// 전 팀원 이름 기준으로 파란색 강조 스팬으로 감싸진다.
let mentionDropdownEl = null;   // 현재 보이는 드롭다운 요소 (없으면 null)
let mentionInputBox = null;     // 드롭다운이 열린 입력 박스
let mentionQuery = '';          // '@' 직후부터 커서까지의 텍스트
let mentionRangeStart = null;   // '@' 위치 Range (치환용)
let mentionActiveIdx = 0;       // ↑↓로 이동한 선택 항목 인덱스
// 스냅샷: 드롭다운이 열린 상태에서 selection/포커스가 흔들려 input 리스너가
// closeMentionDropdown() 으로 state 를 초기화해도, item 클릭 시 칩을 넣을 수 있도록
// '마지막으로 유효했던' 상태를 보존한다.
let _mentionSnapshot = null;    // { box, query, range }
let _mentionPicking = false;    // pointerdown+click 중복 호출 가드

function closeMentionDropdown() {
  if (mentionDropdownEl) { mentionDropdownEl.remove(); mentionDropdownEl = null; }
  mentionInputBox = null; mentionQuery = ''; mentionRangeStart = null;
}

// 커서가 속한 텍스트 노드에서 '@' 를 뒤쪽으로 찾아 반환:
// { node, atIndex, query, range } — '@' 다음 문자가 공백이면 종료 신호로 처리.
function findMentionContext(node, offset) {
  const text = node.textContent;
  for (let i = offset - 1; i >= 0; i--) {
    const ch = text[i];
    if (ch === '@') {
      const query = text.slice(i + 1, offset);
      if (query.includes(' ') || query.length > 20) return null;  // 다른 단어
      const range = document.createRange();
      range.setStart(node, i);
      range.setEnd(node, offset);
      return { node, atIndex: i, query, range };
    }
    if (/\s/.test(ch)) return null;   // 같은 단어 안에서 @가 없으면 아님
  }
  return null;
}

function filteredMentionUsers(query) {
  const q = query.trim().toLowerCase();
  if (!q) return state.users.slice(0, 8);
  return state.users.filter(u => u.name && u.name.toLowerCase().includes(q)).slice(0, 8);
}

function renderMentionDropdown(users, anchorRect) {
  closeMentionDropdown();
  if (!users.length) return;
  mentionActiveIdx = 0;
  const dd = document.createElement('div');
  dd.className = 'mention-dropdown';
  users.forEach((u, i) => {
    const item = document.createElement('div');
    item.className = 'mention-item' + (i === 0 ? ' active' : '');
    item.innerHTML = `<span class="mention-item-avatar">${escHtmlGlobal((u.name || '?').trim().charAt(0).toUpperCase())}</span><span class="mention-item-name">${escHtmlGlobal(u.name)}</span>`;
    // 선택은 pointerdown(캡처 단계)에서 처리한다. mousedown 전파 자체가 없으므로
    // 입력창의 selection/focus가 item 쪽으로 넘어가지 않고 pickMentionUser 가 안정적으로 동작한다.
    // click 도 함께 바인딩해 두는데, pickMentionUser 는 멱등성이 아니라
    // (드롭다운이 이미 닫힌 상태면 즉시 return) 중복 호출이 안전하다.
    // 일부 환경(스크린리더 키보드 조작, 터치 에뮬레이션, 자동화 테스트)에서는
    // pointerdown 이 발생하지 않고 click 만 오기 때문이다.
    item.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); _mentionMouseDownOnItem = true; pickMentionUser(u); }, true);
    item.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); pickMentionUser(u); }, true);
    item.addEventListener('mouseenter', () => setMentionActive(i));
    dd.appendChild(item);
  });
  document.body.appendChild(dd);
  // 커서(어썌토) 위치에 딱 붙인다. 뷰포트 밖이면 뒤집힌다.
  const pad = 6;
  let top = anchorRect.bottom + pad;
  let left = Math.max(pad, Math.min(anchorRect.left, window.innerWidth - dd.offsetWidth - pad));
  dd.style.left = left + 'px';
  dd.style.top = top + 'px';
  requestAnimationFrame(() => {
    if (top + dd.offsetHeight > window.innerHeight - pad) {
      dd.style.top = Math.max(pad, anchorRect.top - dd.offsetHeight - pad) + 'px';
    }
  });
  mentionDropdownEl = dd;
}

function setMentionActive(idx) {
  if (!mentionDropdownEl) return;
  mentionActiveIdx = idx;
  [...mentionDropdownEl.children].forEach((el, i) => el.classList.toggle('active', i === idx));
  const el = mentionDropdownEl.children[idx];
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function pickMentionUser(user) {
  // 멱등성 가드: pointerdown + click 이 모두 바인딩되어 있어 같은 item 을
  // 한 번 누르면 두 번 호출될 수 있다. 첫 번째 호출에서 드롭다운이 닫히고
  // 칩이 이미 들어가 있으므로, 그 이후 호출은 아무것도 하지 않는다.
  if (_mentionPicking) return;
  _mentionPicking = true;
  setTimeout(() => { _mentionPicking = false; }, 0);
  // state 가 selection/포커스 흔들림으로 초기화된 경우 — 스냅샷으로 복원.
  // (드롭다운이 body 에 삽입되는 순간 'input' 이벤트가 다시 발생해 anchorNode 가
  // 비텍스트 노드가 되고, 그때 input 리스너의 closeMentionDropdown() 이 호출된다.)
  if ((!mentionInputBox || !mentionRangeStart) && _mentionSnapshot && _mentionSnapshot.box.isContentEditable) {
    mentionInputBox = _mentionSnapshot.box;
    mentionRangeStart = _mentionSnapshot.range;
    mentionQuery = _mentionSnapshot.query;
  }
  if (!mentionInputBox || !mentionRangeStart) { closeMentionDropdown(); _mentionSnapshot = null; return; }
  const r = mentionRangeStart.cloneRange();
  // '@' 와 쿼리 부분을 지우고 칩 스팬을 넣는다.
  const chip = document.createElement('span');
  chip.className = 'mention-chip';
  chip.setAttribute('contenteditable', 'false');
  chip.dataset.mention = user.name;
  chip.appendChild(document.createTextNode('@' + user.name));
  // 칩과 일반 텍스트를 구분하는 평문 공백을 별도 노드로 둔다 — saveComment 의 walk()가
  // 칩을 "@이름 " 으로 변환할 때 이 노드가 함께 소멸해 이중 공백이 생기지 않는다.
  const gap = document.createTextNode(' ');
  r.deleteContents();
  r.insertNode(gap);
  r.insertNode(chip, gap);   // 칩 → 공백 순서
  // 커서를 공백 다음으로
  const after = document.createRange();
  after.setStartAfter(gap);
  after.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(after);
  mentionInputBox.focus();
  closeMentionDropdown();
  if (typeof autoResizeElGlobal === 'function') autoResizeElGlobal(_lastMentionDiv || mentionInputBox);
}

let _lastMentionDiv = null;

// 문서 전역 input 리스너: .tag-fmt-div 안에서만 동작한다.
// 버그 수정: 드롭다운이 body 에 삽입되는 순간 포커스가 입력창에서 잠시 벗어나
// 'input' 이벤트가 다시 발생할 수 있고, 그때 sel.anchorNode 가 텍스트 노드가
// 아니라면 closeMentionDropdown() 이 호출되어 mentionInputBox / mentionRangeStart
// 가 null 로 초기화된다. 그 결과 item 클릭 시 pickMentionUser 가
// "if (!mentionInputBox || !mentionRangeStart) return;" 에서 바로 빠져나와
// 칩이 입력되지 않는 문제가 있었다.
// 해결: 드롭다운이 이미 열려 있으면 state 를 유지하고 새 위치로만 갱신한다.
// (anchorNode 가 비텍스트 노드여도 close 하지 않음)
document.addEventListener('input', e => {
  // 드롭다운이 이미 열려 있으면 이 리스너는 아무것도 하지 않는다.
  // renderMentionDropdown 이 body 에 드롭다운을 넣는 순간 포커스/selection 이
  // 흔들리며 'input' 이벤트가 한 번 더 발생하는 경우가 있고, 그때 anchorNode 가
  // 비텍스트 노드거나 range 가 없을 때 closeMentionDropdown() 이 호출되어
  // mentionInputBox / mentionRangeStart 가 null 로 초기화된다 → item 클릭 시
  // pickMentionUser 가 "state 부족"으로 칩을 입력하지 못하는 버그의 원인.
  // state 는 오픈된 채로 유지하고, 다음에 사용자가 실제로 키를 눌러야 다시 열린다.
  if (mentionDropdownEl) return;
  const div = e.target.closest && e.target.closest('.tag-fmt-div');
  if (!div) return;
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const node = sel.anchorNode;
  if (!node || node.nodeType !== 3 || !div.contains(node)) {
    // 드롭다운이 이미 열려 있으면 그대로 유지한다.
    // 드롭다운이 body 에 삽입되는 순간 selection 이 input box 밖(보통 html 노드)으로
    // 흔들리고, 그때 또다시 'input' 이벤트가 발생해 이 구간에 닿는다 — 여기서 닫으면
    // item 클릭 전에 state 가 전부 초기화된다.
    if (mentionDropdownEl && _mentionSnapshot && _mentionSnapshot.box === div) return;
    closeMentionDropdown();
    _mentionSnapshot = null;
    return;
  }
  const ctx = findMentionContext(node, sel.anchorOffset);
  _lastMentionDiv = div;
  mentionInputBox = div;
  if (!ctx) {
    // 같은 이유 — 열린 드롭다운의 스냅샷이 살아있으면 닫지 않는다.
    if (mentionDropdownEl && _mentionSnapshot && _mentionSnapshot.box === div) return;
    closeMentionDropdown();
    _mentionSnapshot = null;
    return;
  }
  mentionQuery = ctx.query;
  mentionRangeStart = ctx.range;
  // 유효 상태인 지금 순간을 스냅샷으로 보존 — 드롭다운 렌더링 후 selection 이
  // 흔들려 state 가 초기화돼도 item 클릭 시 칩을 넣을 수 있다.
  // box/query 만 저장하고 range 도 cloneRange() 로 함께 보관한다.
  _mentionSnapshot = { box: div, query: ctx.query, range: ctx.range.cloneRange() };
  const users = filteredMentionUsers(ctx.query);
  if (!users.length) { closeMentionDropdown(); _mentionSnapshot = null; return; }
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  renderMentionDropdown(users, rect);
});

document.addEventListener('keydown', e => {
  if (!mentionDropdownEl) return;
  const items = mentionDropdownEl.children;
  if (e.key === 'ArrowDown') { e.preventDefault(); setMentionActive((mentionActiveIdx + 1) % items.length); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setMentionActive((mentionActiveIdx - 1 + items.length) % items.length); }
  else if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault();
    const list = filteredMentionUsers(mentionQuery);
    if (list[mentionActiveIdx]) pickMentionUser(list[mentionActiveIdx]);
  }
  else if (e.key === 'Escape') { e.preventDefault(); closeMentionDropdown(); }
});

// 드롭다운 바깥 클릭 / 포커스 유실 시 닫기.
// 버그 수정: 캡처 단계(capture=true)에서 '드롭다운 바깥이면 닫기'만 처리하면,
// item 을 클릭할 때 이 리스너가 document 에서 가장 먼저 실행되어 드롭다운이
// 닫히고(mentionDropdownEl = null), 그 다음에야 item 의 mousedown 핸들러가
// 동작하는데 그때는 pickMentionUser 가 필요로 하는 상태가 이미 날아간 상태라
// 클릭 선택이 안 되는 문제가 있었다.
// 해결: 캡처 단계에서는 "드롭다운 item 을 눌렀는지"만 기록하고 실제로는
// 버블링 단계(마지막으로 실행되는 시점)에서 판단한다. item 클릭이면 그대로
// 두고(item 의 핸들러가 pickMentionUser 를 호출), 그 외 클릭이면 닫는다.
let _mentionMouseDownOnItem = false;
document.addEventListener('mousedown', e => {
  _mentionMouseDownOnItem = !!(e.target.closest && e.target.closest('.mention-item'));
}, true);
document.addEventListener('mousedown', e => {
  const onItem = _mentionMouseDownOnItem;
  _mentionMouseDownOnItem = false;
  if (!mentionDropdownEl) return;
  if (onItem) return;                    // item 클릭 → item 핸들러가 처리
  if (e.target.closest && e.target.closest('.mention-dropdown')) return; // 드롭다운 내부(바디 등)
  closeMentionDropdown();                // 진짜 바깥 클릭
});
let _mentionBlurTimer = null;
window.addEventListener('blur', () => {
  // item 을 누르는 순간 입력창 blur 가 발생한다. 그때 예약된 closeMentionDropdown 이
  // pickMentionUser 와 경쟁하면 state 가 날아가 칩이 들어가지 않는다.
  // item 클릭(_mentionMouseDownOnItem)이면 타이머를 취소한다.
  if (_mentionMouseDownOnItem) return;
  _mentionBlurTimer = setTimeout(() => { closeMentionDropdown(); _mentionSnapshot = null; }, 150);
});

// 저장된 평문 설명을 읽기 모드 HTML로 변환: <굵게>→<b>, "• " 줄→실제 글머리 목록.
// mentionName이 있으면 본문에서 "@이름"을 찾아 강조 스팬으로 감싼다.
// 마커가 없는 일반 텍스트는 그대로(줄바꿈은 white-space:pre-wrap이 처리).
// 주의: escHtml 전에 마커를 보호 문자로 바꿔야 한다 — escHtml이 <를 &lt;로 바꾸면 치환 불가.
function fmtToHtml(text, mentionName) {
  if (!text) return '<i>설명 없음</i>';
  const protected_ = text
    .replace(/<굵게>/g, '\x00B\x00')
    .replace(/<\/굵게>/g, '\x00/B\x00');
  const escHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // @멘션 강조: 지정된 대상(mention_name) 외에도 본문에 들어 있는 전 팀원 이름은
  // 모두 파란색으로 강조한다 — 이 코드의 목적("멘션하면 파란색으로")은 상대가 누구든
  // 이름이 보이면 강조되는 것이기 때문. 가장 긴 이름부터 치환해 "홍길"이 "홍길동"의
  // 접두로 먼저 붙어 깨지는 것을 막는다.
  const names = [];
  if (mentionName) names.push(mentionName);
  (state.users || []).forEach(u => { if (u.name && !names.includes(u.name)) names.push(u.name); });
  names.sort((a, b) => b.length - a.length);
  let mentionRe = null;
  try {
    mentionRe = new RegExp('@(' + names.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'g');
  } catch (err) { mentionRe = null; }
  const highlightMention = html => mentionRe ? html.replace(mentionRe, m => `<span class="mention-highlight">${m}</span>`) : html;
  const lines = protected_.split('\n');
  // 줄별로 글머리를 판단: "• "로 시작하는 줄만 <li>, 나머지는 일반 텍스트.
  let out = '';
  let inUl = false;
  lines.forEach((line, i) => {
    const isBullet = line.startsWith('• ');
    const content = isBullet ? line.replace(/^• /, '') : line;
    if (isBullet && !inUl) { out += '<ul class="tag-bullet-list">'; inUl = true; }
    else if (!isBullet && inUl) { out += '</ul>'; inUl = false; }
    out += isBullet ? `<li>${highlightMention(escHtml(content))}</li>` : highlightMention(escHtml(line));
    // 일반 텍스트 줄 사이에는 <br>를 붙여야 한다 — 줄바꿈 문자(\n)는 HTML에서
    // 공백으로 취급되어 pre-wrap 없이도 한 줄로 합쳐져 "줄바꿈이 안 된다"던 버그의
    // 원인이었다. 빈 줄은 <br><br> 두 개가 되어 높이가 유지된다.
    // li(블록 요소) 뒤에는 BR을 두지 않는다 — ul/ol/li의 margin이 이미 간격을 만든다.
    // 마지막 줄 뒤에 BR을 남기면 카드 말미에 불필요한 공간이 생긴다.
    if (!isBullet && i < lines.length - 1) out += '<br>';
  });
  if (inUl) out += '</ul>';
  return out.replace(/\x00B\x00/g, '<b>').replace(/\x00\/B\x00/g, '</b>');
}
// ─── Notification Bell ──────────────────────────────────────────────────────
let _notifTimer = null;
async function pollNotifCount() {
  const em = currentUserEmail();
  if (!em) return;
  try {
    const res = await fetch(`/api/notifications/unread-count?email=${encodeURIComponent(em)}`);
    if (!res.ok) return;
    const data = await res.json();
    const badge = $('notifBadge');
    if (badge) {
      badge.textContent = data.count > 99 ? '99+' : String(data.count);
      badge.style.display = data.count > 0 ? 'inline-block' : 'none';
    }
  } catch (_) {}
}
function startNotifPolling() {
  stopNotifPolling();
  pollNotifCount();
  _notifTimer = setInterval(pollNotifCount, 5000);
}
function stopNotifPolling() {
  if (_notifTimer) { clearInterval(_notifTimer); _notifTimer = null; }
}
async function loadNotifList() {
  window.__diag = {};
  const em = currentUserEmail();
  window.__diag.em = em;
  if (!em) { window.__diag.exit = 'no-email'; return; }
  try {
    const res = await fetch(`/api/notifications?email=${encodeURIComponent(em)}`);
    window.__diag.resOk = res.ok; window.__diag.status = res.status;
    if (!res.ok) { window.__diag.exit = 'res-not-ok'; return; }
    const items = await res.json();
    window.__diag.itemsType = Array.isArray(items) ? 'array:' + items.length : typeof items;
    const listEl = $('notifList');
    if (!listEl) { window.__diag.exit = 'no-listel'; return; }
    if (!listEl) return;
    if (!items.length) {
      listEl.innerHTML = '<div style="padding:16px;text-align:center;color:#999;font-size:13px">처리할 작업이 없습니다</div>';
      return;
    }
    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // 세부 내용: 코멘트/멘션/디스크립션 알림은 관련 댓글 본문(c.content)을 아랫줄에 한 줄만 노출.
    const detailMap = {};
    try {
      const refIds = [...new Set(items.map(n => n.ref_id).filter(id => id != null && id !== ''))];
      const results = await Promise.all(refIds.map(async rid => {
        try {
          const r = await fetch(`/api/comments/${rid}`);
          return r.ok ? [rid, (await r.json()).content || ''] : [rid, ''];
        } catch (_) { return [rid, '']; }
      }));
      for (const [rid, content] of results) detailMap[rid] = content;
    } catch (_) { /* 댓글 조회 실패해도 문구+시각만 표시 */ }
    const clipOneLine = s => {
      let t = String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
      t = t.replace(/^@\S+\s*/, '');
      return t.length > 60 ? t.slice(0, 60) + '…' : t;
    };
    listEl.innerHTML = items.map(n => {
      const isContent = ['comment', 'mention', 'description'].includes(n.type);
      const raw = isContent ? (detailMap[n.ref_id] || '').trim() : '';
      const clipAt = s => { const t = String(s||'').replace(/\s+/g,' '); return t.length > 60 ? t.slice(0,60) + '…' : t; };
      const detailHtml = raw ? `<div style="margin-top:2px;font-size:11.5px;color:#6b7280;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(raw)}">${esc(clipAt(raw))}</div>` : '';
      const timeStr = String(n.created_at || '').replace('T',' ').replace(/Z$/,'').slice(0,16);
      return `
      <div style="padding:8px 12px;border-bottom:1px solid #f0f0f0">
        <span class="notif-msg" data-nid="${n.id}" data-ref-id="${n.ref_id}" data-type="${esc(n.type || '')}" style="display:block;font-size:12.5px;line-height:1.45;color:#333;cursor:pointer">${esc(n.message)}${detailHtml}<small style="display:block;color:#aaa;font-size:11px">${timeStr}</small></span>
      </div>`;
    }).join('');
    // 메시지 텍스트 클릭 → 해당 코멘트가 있는 페이지로 이동 + 스크롤·하이라이트
    listEl.querySelectorAll('.notif-msg').forEach(span => {
      span.addEventListener('click', async e => {
        e.preventDefault();
        e.stopPropagation();
        const refId = parseInt(span.dataset.refId, 10);
        if (!refId) return;
        // 알림 패널 닫기
        const panel = $('notifPanel');
        if (panel) panel.style.display = 'none';
        try {
          // 해당 코멘트의 page_id 역참조
          const c = await api(`/api/comments/${refId}`);
          const pg = state.pages.find(p => p.id === c.page_id);
          if (!pg) { alert('해당 페이지를 찾을 수 없습니다.'); return; }
          if (state.currentPageId !== c.page_id) await selectPage(c.page_id);
          // 알림 종류에 따라 이동할 탭을 고른다: 'comment'는 코멘트 탭,
          // 'mention'(디스크립션 멘션/답글) 등 나머지는 디스크립션 탭으로 이동한 뒤
          // 해당 코멘트로 스크롤·하이라이트한다.
          const nType = span.dataset.type || '';
          // description(디스크립션 답글) 알림: ref_id는 코멘트 ID이므로,
          // 그 코멘트의 parent_tag_id가 실제 디스크립션 태그 ID다.
          // (refId를 그대로 tag ID로 쓰면 [data-tag-id]가 절대 안 맞는다.)
          if (nType === 'description') {
            const tagId = c.parent_tag_id;
            if (tagId) {
              scrollToDescription(tagId);
            } else {
              switchRightTab('description');
            }
          } else {
            scrollToComment(refId);
          }
          // 읽음 처리: 해당 알림만 읽음으로
          const nid = parseInt(span.dataset.nid, 10);
          if (nid) await fetch(`/api/notifications/${nid}/read`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ email: em })
          });
          pollNotifCount();
          loadNotifList();
        } catch (err) {
          alert('이동 실패: ' + ((err && err.message) || err));
        }
      });
    });
  } catch (err) {
    console.error('[notifs] loadNotifList failed:', err && err.stack || err);
    window.__lastNotifErr = String(err && err.message || err);
    const el = $('notifList');
    if (el) el.innerHTML = '<div style="padding:16px;text-align:center;color:#c62828;font-size:13px">알림을 불러오지 못했습니다 (' + String(err && err.message || err).slice(0, 60) + ')</div>';
  }
}
(function initNotifBell() {
  const bellBtn = $('notifBellBtn');
  const panel = $('notifPanel');
  if (!bellBtn || !panel) return;
  bellBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (panel.style.display === 'block') {
      panel.style.display = 'none';
    } else {
      loadNotifList();
      panel.style.display = 'block';
    }
  });
  document.addEventListener('click', e => {
    const wrap = $('notifWrap');
    if (wrap && !wrap.contains(e.target)) panel.style.display = 'none';
  });
})();
startNotifPolling();
</script>
