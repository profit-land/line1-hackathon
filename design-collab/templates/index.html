<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Collab - 화면 시안 협업</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
/* 처리할 작업 이동 하이라이트 — 연한 네온 보라 테두리만(살짝 깜빡임), 2초 */
@keyframes neon-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .55; }
}
.neon-border::before {
  content: '';
  position: absolute;
  inset: -2px;
  z-index: 2147483647;
  border: 2px solid #c084fc;
  border-radius: 10px;
  pointer-events: none;
  animation: neon-pulse 1.2s ease-in-out infinite;
}
.neon-border {
  position: relative !important;
}
/* 태그 설명 텍스트: '\n'을 그대로 줄바꿈으로 렌더 (JS에서 <br> 없이 순수 텍스트 신뢰) */
.tag-desc-text {
  white-space: pre-wrap;
}

/* ─── @멘션 자동완성 드롭다운 ─────────────────────────────────────────────── */
.mention-dropdown {
  position: fixed;
  z-index: 9999;
  min-width: 200px;
  max-height: 240px;
  overflow-y: auto;
  background: #ffffff;
  border: 1px solid #d9d9e3;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
  padding: 4px 0;
  font-size: 13px;
}
.mention-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  cursor: pointer;
  color: #1f2330;
  transition: background .1s;
}
.mention-item:hover,
.mention-item.active {
  background: #eef0fb;
}
.mention-item-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #7c3aed;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}
.mention-item-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 입력창 안의 멘션 칩 */
.mention-chip {
  display: inline-block;
  background: #7c3aed33;
  color: #a78bfa;
  border: 1px solid #7c3aed66;
  border-radius: 4px;
  padding: 0 4px;
  margin: 0 1px;
  font-size: 0.9em;
  line-height: 1.4;
  user-select: all;
}

</style>
</head>
<body>
<div id="app">
  <!-- ─── Header ─── -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">🎨 Design Collab</span>
    </div>
    <div class="topbar-right">
      <span id="userBadge" class="user-badge" style="display:none"></span>
      <!-- 알림 벨 -->
      <div id="notifWrap" style="position:relative;display:none">
        <button id="notifBellBtn" type="button" title="처리할 작업" style="background:none;border:none;cursor:pointer;padding:4px 6px;position:relative;line-height:1;display:flex;align-items:center"><svg viewBox="0 0 24 24" width="18" height="18" fill="#6b7280" aria-hidden="true"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
          <span id="notifBadge" style="display:none;position:absolute;top:-2px;right:-2px;background:#e53935;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 4px;min-width:14px;text-align:center"></span>
        </button>
        <div id="notifPanel" style="display:none;position:absolute;top:100%;right:0;width:320px;max-height:380px;overflow-y:auto;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:9999;padding:8px 0">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 12px 8px;border-bottom:1px solid #eee">
            <strong style="font-size:13px">처리할 작업</strong>

          </div>
          <div id="notifList"></div>
        </div>
      </div>
      <button id="teamMembersBtn" class="btn btn-sm btn-outline" style="display:none">팀원 보기</button>
      <button id="logoutBtn" class="btn btn-sm btn-outline" style="display:none">로그아웃</button>
    </div>
  </header>

  <!-- ─── 팀원 목록 모달 ─── -->
  <div id="teamModalOverlay" class="modal-overlay" style="display:none">
    <div class="modal-box team-modal-box">
      <div class="team-modal-head">
        <h3>팀원</h3>
        <button type="button" id="teamModalClose" class="icon-btn" title="닫기">✕</button>
      </div>
      <ul id="teamMemberList" class="team-member-list"></ul>
    </div>
  </div>

  <!-- ─── Auth Screen (전면, 로그인 전에만 표시) ─── -->
  <div id="authScreen" class="auth-screen" style="display:none">
    <div class="auth-card">
      <div class="auth-logo">🎨 Design Collab</div>
      <div id="authTabLogin" class="auth-tab">
        <label class="auth-label">이메일
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        </label>
        <button type="button" id="doLoginBtn" class="btn btn-primary auth-submit">로그인</button>
        <p class="auth-switch-hint">계정이 없나요? <a href="#" id="linkToRegister">가입하기</a></p>
      </div>
      <div id="authTabRegister" class="auth-tab" hidden>
        <label class="auth-label">이름
          <input type="text" id="regName" placeholder="홍길동" maxlength="20">
        </label>
        <label class="auth-label">이메일
          <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email">
        </label>
        <button type="button" id="doRegisterBtn" class="btn btn-primary auth-submit">가입하기</button>
        <p class="auth-switch-hint">이미 계정이 있나요? <a href="#" id="linkToLogin">로그인</a></p>
      </div>
      <p id="authError" class="auth-error" role="alert"></p>
    </div>
  </div>

  <!-- ─── 3-Column Layout ─── -->
  <main class="workspace" id="appWorkspace">
    <!-- LEFT: Projects + Pages -->
    <aside class="panel panel-left">
      <div class="panel-header project-panel-header">
        <h2>프로젝트</h2>
        <button id="addProjectBtn2" class="btn btn-xs btn-outline" title="프로젝트 추가" style="display:none">+</button>
      </div>
      <!-- 현재 프로젝트 강조 표시 + 드롭다운으로 다른 프로젝트 이동 -->
      <div class="current-project-wrap">
        <button type="button" class="current-project-btn" id="currentProjectBtn">
          <span class="cp-dot" aria-hidden="true"></span>
          <span class="cp-name" id="currentProjectName">프로젝트를 선택하세요</span>
          <span class="cp-caret" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" width="10" height="10"><path d="M3.5 6l4.5 5 4.5-5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></span>
        </button>
        <ul class="project-dropdown" id="projectDropdown" role="menu" hidden></ul>
      </div>

      <div class="panel-header page-header">
        <h2>화면 트리</h2>
        <span class="page-header-actions">
          <button id="addMenuBtn" class="btn btn-xs btn-outline" title="메뉴 추가">+</button>
        </span>
      </div>
      <div class="page-list screen-tree" id="pageList"></div>
    </aside>

    <!-- CENTER: Preview -->
    <section class="panel panel-center">
      <div class="panel-header preview-header">
        <h2 id="previewTitle">미리보기</h2>
        <div class="preview-actions">
          <button id="copyPageInfoBtn" class="icon-btn refresh-icon-btn" title="페이지 정보 복사"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 5.5V3.5A1.5 1.5 0 0 0 9 2H3.5A1.5 1.5 0 0 0 2 3.5V9a1.5 1.5 0 0 0 1.5 1.5H5.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
          <button id="openWebPreviewBtn" class="icon-btn refresh-icon-btn" title="웹 프리뷰로 보기"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M6.5 3.5H3.5A1.5 1.5 0 0 0 2 5v7.5A1.5 1.5 0 0 0 3.5 14H11a1.5 1.5 0 0 0 1.5-1.5V9.5 M10 2h4v4 M14 2 8.5 7.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <button id="refreshPreviewBtn" class="icon-btn refresh-icon-btn" title="미리보기 새로고침"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9 M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
      </div>
      <div class="preview-body" id="previewBody">
        <div class="empty-state" id="previewEmpty">
          <p>왼쪽에서 페이지를 선택하세요</p>
        </div>
        <iframe id="previewFrame" sandbox="allow-same-origin" style="display:none"></iframe>
        <div id="tagOverlay" class="tag-overlay" style="display:none"></div>
      </div>
    </section>

    <!-- RIGHT: Description/Comments tabs -->
    <aside class="panel panel-right">
      <div class="panel-header right-tabs-header">
        <div class="right-tabs" role="tablist">
          <button type="button" class="right-tab active" data-right-tab="description" role="tab" aria-selected="true">디스크립션</button>
          <button type="button" class="right-tab" data-right-tab="comments" role="tab" aria-selected="false">코멘트</button>
          <button type="button" class="right-tab" data-right-tab="memos" role="tab" aria-selected="false">메모</button>
        </div>
        <button id="addRightItemBtn" class="btn btn-xs btn-primary" title="추가">+ 추가</button>
      </div>

      <div class="right-pane right-pane-description" id="rightPaneDescription" role="tabpanel">
        <div class="tags-section tags-section-full">
          <div class="tags-list" id="tagsList"></div>
          
        </div>
      </div>

      <div class="right-pane right-pane-comments" id="rightPaneComments" role="tabpanel" hidden>
        <div class="tags-section tags-section-full">
          <div class="tags-list comments-list" id="commentsList"></div>
          
        </div>
      </div>
      <div class="right-pane right-pane-memos" id="rightPaneMemos" role="tabpanel" hidden>
        <div class="memos-header-row">
          <span class="memos-header-label">내 메모</span>
          
        </div>
        <div class="tags-list memos-list" id="memosList"></div>
        <div class="memos-composer">
          <textarea id="memoInput" class="memo-input" rows="5" placeholder="메모를 입력하세요."></textarea>
          <button type="button" class="btn btn-xs btn-primary memo-save-btn" id="memoSaveBtn">저장</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<script>
// ─── State ─────────────────────────────────────────────────────────────────
let state = {
  projects: [],
  currentProjectId: null,
  pages: [],
  menus: [],           // 화면 트리 메뉴(그룹) 목록
  collapsedMenus: new Set(),  // 접혀 있는 메뉴 이름들
  currentPageId: null,
  currentUser: null,   // {id, name, email} — 로그인 상태
  pollTimer: null,
  lastDescHash: '',
  lastCommentCount: -1,
  tags: [],
  tagMode: false,
  draggingTagId: null,
  pendingTagId: null,   // 저장 버튼 클릭 전까지 서버에 없는 신규 태그
  editingTagId: null,   // 수정 모드 중인 태그 id
  openCommentsTagId: null,  // '댓글 보기'로 열려 있는 태그 id (null이면 모두 닫힘)
  comments: [],
  hiddenComments: [],        // 숨김 처리된 코멘트('처리된 코멘트 보기' 링크에서 접기/펼치기)
  showHiddenComments: false, // '처리된 코멘트 보기' 링크 펼침 상태
  editingCommentId: null,
  users: [],   // 팀원 목록 — @명령 자동완성용
};

// ─── DOM refs ──────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const projectListEl = $('projectList');
const pageListEl = $('pageList');
const previewFrame = $('previewFrame');
const previewEmpty = $('previewEmpty');
const previewTitle = $('previewTitle');

const commentsList = $('commentsList');
const tagsListEl = $('tagsList');
const previewBody = $('previewBody');

// ─── Auth (로그인/가입) ─────────────────────────────────────────────────────
function currentUserEmail() { return state.currentUser ? state.currentUser.email : ''; }
function currentUserName() { return state.currentUser ? state.currentUser.name : '익명'; }

function renderUserBadge() {
  const badge = $('userBadge');
  const logoutBtn = $('logoutBtn');
  const addProjectBtn2 = $('addProjectBtn2');
  const topbar = document.querySelector('.topbar');
  const authScreen = $('authScreen');
  const appWorkspace = $('appWorkspace');
  const teamBtn = $('teamMembersBtn');
  if (state.currentUser) {
    badge.textContent = state.currentUser.name;
    badge.style.display = 'inline-block';
    if (teamBtn) teamBtn.style.display = 'inline-block';
    const nwEl = $('notifWrap'); if (nwEl) nwEl.style.display = 'inline-block';
    logoutBtn.style.display = 'inline-block';
    if (addProjectBtn2) addProjectBtn2.style.display = 'inline-block';
    if (topbar) topbar.style.display = 'flex';
    if (authScreen) authScreen.style.display = 'none';
    if (appWorkspace) appWorkspace.style.display = '';
  } else {
    badge.style.display = 'none';
    if (teamBtn) teamBtn.style.display = 'none';
    const nw = $('notifWrap'); if (nw) nw.style.display = 'none';
    logoutBtn.style.display = 'none';
    if (addProjectBtn2) addProjectBtn2.style.display = 'none';
    if (topbar) topbar.style.display = 'none';
    if (authScreen) authScreen.style.display = 'flex';
    if (appWorkspace) appWorkspace.style.display = 'none';
  }
}

async function tryAutoLogin() {
  const email = localStorage.getItem('dc_user_email');
  if (!email) return;
  try {
    const user = await api('/api/login', { method: 'POST', body: JSON.stringify({ email }) });
    state.currentUser = user;
    startNotifPolling(); // 로그인 완료 시점에 알림 폴링 재시작
  } catch (e) { /* 없으면 그냥 비로그인 */ }
  renderUserBadge();
}

function openAuthModal(tab) {
  const authScreen = $('authScreen');
  if (authScreen) authScreen.style.display = 'flex';
  $('authError').textContent = '';
  switchAuthTab(tab || 'login');
}

function closeAuthModal() {
  // 전면 화면에서는 닫기 버튼이 없으므로 noop
}

function switchAuthTab(name) {
  $('authTabLogin').hidden = name !== 'login';
  $('authTabRegister').hidden = name !== 'register';
}

async function doLogin() {
  const email = $('loginEmail').value.trim().toLowerCase();
  if (!email) { $('authError').textContent = '이메일을 입력해 주세요.'; return; }
  try {
    const user = await api('/api/login', { method: 'POST', body: JSON.stringify({ email }) });
    state.currentUser = user;
    localStorage.setItem('dc_user_email', user.email);
    renderUserBadge();
    closeAuthModal();
    startNotifPolling(); // 로그인 완료 시점에 알림 폴링 재시작
    // 로그인 상태 변경으로 렌더링 갱신
    renderTagList();
    renderComments();
  } catch (e) {
    $('authError').textContent = e.message;
  }
}

async function doRegister() {
  const name = $('regName').value.trim();
  const email = $('regEmail').value.trim().toLowerCase();
  if (!name) { $('authError').textContent = '이름을 입력해 주세요.'; return; }
  if (!email) { $('authError').textContent = '이메일을 입력해 주세요.'; return; }
  try {
    const user = await api('/api/register', { method: 'POST', body: JSON.stringify({ name, email }) });
    state.currentUser = user;
    localStorage.setItem('dc_user_email', user.email);
    renderUserBadge();
    closeAuthModal();
    renderTagList();
    renderComments();
  } catch (e) {
    $('authError').textContent = e.message;
  }
}

function doLogout() {
  state.currentUser = null;
  localStorage.removeItem('dc_user_email');
  closeTeamModal();
  renderUserBadge();
  renderTagList();
  renderComments();
}

// ─── 팀원 목록 모달 ────────────────────────────────────────────────────────
async function openTeamModal() {
  const overlay = $('teamModalOverlay');
  if (!overlay) return;
  overlay.style.display = 'flex';
  const list = $('teamMemberList');
  list.innerHTML = '<li class="team-member-loading">불러오는 중…</li>';
  try {
    const users = await api('/api/users');
    const myUser = state.currentUser;
    const myEmail = currentUserEmail();
    const isAdmin = !!(myUser && myUser.is_admin);
    if (!users.length) {
      list.innerHTML = '<li class="team-member-empty">아직 가입된 팀원이 없습니다.</li>';
      return;
    }
    list.innerHTML = '';
    for (const u of users) {
      const li = document.createElement('li');
      li.className = 'team-member-item' + (u.email === myEmail ? ' me' : '');
      const initial = (u.name || '?').trim().charAt(0).toUpperCase();
      const avatar = document.createElement('span');
      avatar.className = 'team-avatar';
      avatar.textContent = initial;
      const info = document.createElement('div');
      info.className = 'team-info';
      const nameEl = document.createElement('div');
      nameEl.className = 'team-name';
      nameEl.textContent = u.name;
      const emailEl = document.createElement('div');
      emailEl.className = 'team-email';
      emailEl.textContent = u.email;
      info.appendChild(nameEl);
      info.appendChild(emailEl);
      li.appendChild(avatar);
      li.appendChild(info);
      if (u.is_admin) {
        const adminTag = document.createElement('span');
        adminTag.className = 'team-admin-tag';
        adminTag.textContent = '관리자';
        li.appendChild(adminTag);
      }
      if (u.email === myEmail) {
        const tag = document.createElement('span');
        tag.className = 'team-me-tag';
        tag.textContent = '나';
        li.appendChild(tag);
      }
      // 관리자만, 그리고 본인이 아닌 팀원에 삭제 버튼 표시
      if (isAdmin && u.email !== myEmail) {
        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'btn btn-sm btn-outline team-del-btn';
        delBtn.textContent = '삭제';
        delBtn.addEventListener('click', async () => {
          if (!confirm(`'${u.name}' 팀원을 삭제할까요?`)) return;
          try {
            await api(`/api/users/${u.id}`, { method: 'DELETE', body: JSON.stringify({ email: myEmail }) });
            openTeamModal();  // 목록 갱신
          } catch (e) { alert(e.message); }
        });
        li.appendChild(delBtn);
      }
      list.appendChild(li);
    }
  } catch (e) {
    list.innerHTML = '<li class="team-member-empty">팀원 목록을 불러오지 못했습니다. (' + e.message + ')</li>';
  }
}

function closeTeamModal() {
  const overlay = $('teamModalOverlay');
  if (overlay) overlay.style.display = 'none';
}

// ─── Init ──────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Auth screen events (null guard — authScreen이 아닌 경우 스킵)
  const _logoutBtn = $('logoutBtn'); if (_logoutBtn) _logoutBtn.addEventListener('click', doLogout);
  // 팀원 보기 버튼 + 모달 닫기 (닫기 버튼, 오버레이 클릭, Esc)
  const _teamBtn = $('teamMembersBtn'); if (_teamBtn) _teamBtn.addEventListener('click', openTeamModal);
  const _teamClose = $('teamModalClose'); if (_teamClose) _teamClose.addEventListener('click', closeTeamModal);
  const _teamOverlay = $('teamModalOverlay');
  if (_teamOverlay) _teamOverlay.addEventListener('click', e => { if (e.target === _teamOverlay) closeTeamModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && _teamOverlay && _teamOverlay.style.display !== 'none') closeTeamModal();
  });
  const _doLoginBtn = $('doLoginBtn'); if (_doLoginBtn) _doLoginBtn.addEventListener('click', doLogin);
  const _doRegisterBtn = $('doRegisterBtn'); if (_doRegisterBtn) _doRegisterBtn.addEventListener('click', doRegister);
  const _linkToRegister = $('linkToRegister');
  if (_linkToRegister) _linkToRegister.addEventListener('click', e => { e.preventDefault(); switchAuthTab('register'); });
  const _linkToLogin = $('linkToLogin');
  if (_linkToLogin) _linkToLogin.addEventListener('click', e => { e.preventDefault(); switchAuthTab('login'); });
  // Enter 키로 제출
  $('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('regEmail').addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

  renderUserBadge(); // 비로그인 상태이면 auth 화면 전면 표시
  tryAutoLogin();

  const _cpBtn = $('currentProjectBtn'); if (_cpBtn) _cpBtn.addEventListener('click', (e) => { e.stopPropagation(); const dd = $('projectDropdown'); dd.hidden = !dd.hidden; });
  const _cpBtn2 = $('addProjectBtn2'); if (_cpBtn2) _cpBtn2.addEventListener('click', addProject);

  $('addMenuBtn').addEventListener('click', addMenu);
  $('refreshPreviewBtn').addEventListener('click', () => { if (state.currentPageId) loadPreview(); });
  $('copyPageInfoBtn').addEventListener('click', async () => {
    const pg = state.pages.find(p => p.id === state.currentPageId);
    if (!pg) { alert('선택된 페이지가 없습니다.'); return; }
    const link = location.origin + '/' + '?page=' + encodeURIComponent(pg.id);
    try {
      await navigator.clipboard.writeText(link);
      flashButton($('copyPageInfoBtn'), '복사됨!');

      // 클립보드 API가 차단된 환경 폴백

      ta.style.position = 'fixed'; ta.style.opacity = '0';

      catch (e2) { prompt('링크를 수동으로 복사하세요:', link); }
      ta.remove();
    }
  });
  $('openWebPreviewBtn').addEventListener('click', () => {
    const pg = state.pages.find(p => p.id === state.currentPageId);
    if (!pg) { alert('선택된 페이지가 없습니다.'); return; }
    const html = (pg.html_content && pg.html_content.trim()) ? pg.html_content : '<html><body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;color:#94a3b8;">HTML 시안이 없습니다.</body></html>';
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });
  function flashButton(btn, text) {
    const toast = document.createElement('span');
    toast.textContent = text;
    toast.style.cssText = 'position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;font-size:11px;line-height:1;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:9999;box-shadow:0 2px 6px rgba(0,0,0,.15);animation:toastFade 1.5s ease forwards;';
    if (!document.getElementById('toastFadeStyle')) {
      const st = document.createElement('style');
      st.id = 'toastFadeStyle';
      st.textContent = '@keyframes toastFade{0%{opacity:0;transform:translateX(-50%) translateY(-4px)}12%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}';
      document.head.appendChild(st);
    }
    btn.style.position = 'relative';
    btn.appendChild(toast);
    setTimeout(() => toast.remove(), 1500);
  }
  previewBody.addEventListener('click', onPreviewClick);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
// 포인터 캡처 폴백: setPointerCapture가 실패하거나(구형 브라우저·일부 환경)
// iframe으로 포커스가 넘어간 순간 캡처가 해제되어 document mouseup이 안 오는
// 경로에서 .dragging이 영구 잔존하는 것을 막는다.
window.addEventListener('blur', onDragEnd);
document.addEventListener('pointercancel', onDragEnd);
document.addEventListener('pointerup', onDragEnd);
  document.querySelectorAll('.right-tab').forEach(tab => {
    tab.addEventListener('click', () => switchRightTab(tab.dataset.rightTab));
  });
  $('addRightItemBtn').addEventListener('click', onAddRightItem);
$('memoSaveBtn').addEventListener('click', saveMemo);

// ─── API helpers ───────────────────────────────────────────────────────────
async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `HTTP ${res.status}`);
  }
  return res.json();
}

    state.users = await api('/api/users');
  } catch (e) {

  }
}

// ─── Projects ──────────────────────────────────────────────────────────────
async function loadProjects() {
  state.projects = await api('/api/projects');
  renderProjects();
  if (state.projects.length > 0) {
    if (!state.currentProjectId || !state.projects.find(p => p.id === state.currentProjectId)) {
      state.currentProjectId = state.projects[0].id;
      renderProjects(); // 상단 '프로젝트를 선택하세요' → 첫 프로젝트 이름으로 즉시 갱신
    }
    await loadPages();
  } else {
    state.pages = [];
    state.currentPageId = null;
    renderPages();
    showEmptyPreview();
  }
}

function renderProjects() {
  // 현재 프로젝트 강조 표시 (상단 버튼)
  const curBtn = $('currentProjectBtn');

    curBtn.classList.add('has-project');

  const dd = $('projectDropdown');
  dd.innerHTML = '';
  state.projects.forEach(p => {
    const li = document.createElement('li');
    li.className = 'dd-item' + (p.id === state.currentProjectId ? ' current' : '');
    li.setAttribute('role', 'menuitem');

      <span class="dd-check">${p.id === state.currentProjectId ? '<svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : ''}</span>

      <span class="dd-actions">
        <button class="icon-btn" data-action="rename-proj" title="이름 변경"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.4 2.1l2.5 2.5L5.3 13.2l-3.3.9.9-3.3 8.5-8.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" data-action="del-proj" title="삭제"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11 M6.5 4V2.5h3V4 M4 4l.8 9.5h6.4L12 4 M6.5 7v4 M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </span>`;

function closeProjectDropdown() { $('projectDropdown').hidden = true; }

async function selectProject(pid) {

async function addProject() {
  const name = prompt('새 프로젝트 이름:');
  if (!name || !name.trim()) return;
  try {
    const proj = await api('/api/projects', { method: 'POST', body: JSON.stringify({ name: name.trim() }) });

    state.currentProjectId = proj.id;

    await loadPages();
  } catch (e) { alert(e.message); }

async function renameProject(pid, oldName) {
  const name = prompt('프로젝트 이름:', oldName);
  if (!name || !name.trim()) return;
  try {
    await api(`/api/projects/${pid}`, { method: 'PUT', body: JSON.stringify({ name: name.trim() }) });

async function deleteProject(pid) {
  if (!confirm('이 프로젝트와 모든 페이지가 삭제됩니다. 계속할까요?')) return;
  try {
    await api(`/api/projects/${pid}`, { method: 'DELETE' });

      state.currentProjectId = null;
      state.currentPageId = null;

// ─── Pages ─────────────────────────────────────────────────────────────────
async function loadPages() {
  if (!state.currentProjectId) { state.pages = []; state.menus = []; renderPages(); return; }
  const [pages, menus] = await Promise.all([
    api(`/api/projects/${state.currentProjectId}/pages`),
    api(`/api/projects/${state.currentProjectId}/menus`),
  ]);
  state.pages = pages;
  state.menus = menus;
  renderPages();
  // Auto-select first page
  if (state.pages.length > 0 && !state.currentPageId) {
    selectPage(state.pages[0].id);
  }
}

function renderPages() {
  pageListEl.innerHTML = '';
  if (state.pages.length === 0 && state.menus.length === 0) return;

  // menu_name 기준으로 페이지들을 그룹핑
  const groups = new Map();
  state.pages.forEach(pg => {
    const key = pg.menu_name || '__none__';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(pg);
  });

  // menus 테이블의 순서대로 렌더링 → 그 다음 미분류
  // 빈 메뉴(속한 페이지 0개)도 렌더링함 — addMenu()로 만든 메뉴가 바로 트리에 보여야 하기 때문
  const orderedKeys = state.menus.map(m => m.name);
  // orphan 페이지(menu_name이 menus 테이블에 없는 값)는 (미분류)에 병합
  const menuNameSet = new Set(state.menus.map(m => m.name));
  let hasOrphan = false;
  groups.forEach((pages, key) => {
    if (key !== '__none__' && !menuNameSet.has(key)) {
      if (!groups.has('__none__')) groups.set('__none__', []);
      pages.forEach(p => groups.get('__none__').push(p));
      groups.delete(key);
      hasOrphan = true;
    }
  });
  if (hasOrphan) {
    state.pages.forEach(pg => {
      if (pg.menu_name && !menuNameSet.has(pg.menu_name)) pg.menu_name = null;
    });
  }

  // 공통: 페이지 아이템 생성 헬퍼
  function makePageItem(pg) {
    const li = document.createElement('div');
    li.className = 'page-item tree-child' + (pg.id === state.currentPageId ? ' active' : '');
    li.innerHTML = `
      <span class="page-name">${esc(pg.name)}</span>
      <span class="page-actions">
        <button class="icon-btn" data-action="rename" title="이름 변경"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.4 2.1l2.5 2.5L5.3 13.2l-3.3.9.9-3.3 8.5-8.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" data-action="del" title="삭제"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11 M6.5 4V2.5h3V4 M4 4l.8 9.5h6.4L12 4 M6.5 7v4 M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </span>`;
    li.querySelector('.page-name').addEventListener('click', () => selectPage(pg.id));
    li.querySelector('[data-action=rename]').addEventListener('click', () => renamePage(pg.id, pg.name));
    li.querySelector('[data-action=del]').addEventListener('click', () => deletePage(pg.id));
    return li;
  }

  // 공통: 메뉴 헤더 생성 헬퍼 (접기/펼치기 + <svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.4 2.1l2.5 2.5L5.3 13.2l-3.3.9.9-3.3 8.5-8.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11 M6.5 4V2.5h3V4 M4 4l.8 9.5h6.4L12 4 M6.5 7v4 M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>)
  function makeMenuHeader(displayKey, label, isNone) {
    const collapsed = state.collapsedMenus.has(displayKey);
    // 접기/펼치기 화살표: 도형(SVG)으로 통일
    const arrow = collapsed
      ? '<svg class="ic tree-arrow" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M6 3.5l5 4.5-5 4.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>'
      : '<svg class="ic tree-arrow" viewBox="0 0 16 16" width="10" height="10" aria-hidden="true"><path d="M3.5 6l4.5 5 4.5-5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
    const hdr = document.createElement('div');
    hdr.className = 'menu-group-header' + (isNone ? ' none' : '') + (collapsed ? ' collapsed' : '');
    hdr.innerHTML = `
      <span class="menu-group-label">${arrow} ${label}</span>
      <span class="menu-group-actions">
        <button class="icon-btn" data-menu-action="add-page" title="이 메뉴에 페이지 추가"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 3v10 M3 8h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        <button class="icon-btn" data-menu-action="rename" title="메뉴 이름 변경"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.4 2.1l2.5 2.5L5.3 13.2l-3.3.9.9-3.3 8.5-8.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        ${!isNone ? '<button class="icon-btn" data-menu-action="del" title="메뉴 삭제"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11 M6.5 4V2.5h3V4 M4 4l.8 9.5h6.4L12 4 M6.5 7v4 M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' : ''}
      </span>`;
    // 헤더 클릭 → 접기/펼치기 토글
    hdr.querySelector('.menu-group-label').addEventListener('click', () => toggleMenuCollapse(displayKey));
    // 액션 버튼들
    hdr.querySelector('[data-menu-action=add-page]').addEventListener('click', (e) => {
      e.stopPropagation();
      addPage(isNone ? null : displayKey);
    });
    hdr.querySelector('[data-menu-action=rename]').addEventListener('click', (e) => {
      e.stopPropagation();
      renameMenu(displayKey);
    });
    if (!isNone) {
      hdr.querySelector('[data-menu-action=del]').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteMenu(displayKey);
      });
    }
    return hdr;
  }

  orderedKeys.forEach(key => {
    const pages = groups.get(key) || [];
    const hdr = makeMenuHeader(key, esc(key), false);
    pageListEl.appendChild(hdr);
    if (!state.collapsedMenus.has(key)) {
      pages.forEach(pg => pageListEl.appendChild(makePageItem(pg)));
    }
  });

  // ── (미분류) 그룹 ──
  if (groups.has('__none__')) {
    const hdr = makeMenuHeader('__none__', '(미분류)', true);
    pageListEl.appendChild(hdr);
    if (!state.collapsedMenus.has('__none__')) {
      groups.get('__none__').forEach(pg => pageListEl.appendChild(makePageItem(pg)));
    }
  }
}

function toggleMenuCollapse(key) {
  if (state.collapsedMenus.has(key)) {
    state.collapsedMenus.delete(key);
  } else {
    state.collapsedMenus.add(key);
  }
  renderPages();
}

async function selectPage(pageId) {
  state.currentPageId = pageId;
  renderPages();
  const pg = state.pages.find(p => p.id === pageId);
  previewTitle.textContent = pg ? pg.name : '미리보기';
  loadPreview();
  await loadComments();
  await loadTags();
  loadMemos();
  startPolling();
}

async function addPage(presetMenuName = null) {
  if (!state.currentProjectId) { alert('먼저 프로젝트를 선택하세요.'); return; }
  const name = prompt('새 페이지 이름:');
  if (!name || !name.trim()) return;
  // 메뉴 헤더의 + 버튼으로 호출하면 해당 메뉴가 고정됨. presetMenuName이 비어 있으면 여전히 미분류.
  const menuName = presetMenuName !== null ? presetMenuName : ((prompt('메뉴 이름 (비워두면 미분류):') || '').trim());
  try {
    const pg = await api(`/api/projects/${state.currentProjectId}/pages`, {
      method: 'POST', body: JSON.stringify({ name: name.trim(), menu_name: menuName })
    });
    state.pages.push(pg);
    renderPages();
    selectPage(pg.id);
  } catch (e) { alert(e.message); }
}

async function renamePage(pageId, oldName) {
  const pg = state.pages.find(p => p.id === pageId);
  const name = prompt('페이지 이름:', oldName);
  if (!name || !name.trim()) return;
  const menuName = prompt('메뉴 이름 (비워두면 미분류):', pg ? (pg.menu_name || '') : '');
  try {
    const updated = await api(`/api/pages/${pageId}`, { method: 'PUT', body: JSON.stringify({ name: name.trim(), menu_name: menuName.trim() }) });
    const idx = state.pages.findIndex(p => p.id === pageId);
    if (idx >= 0) state.pages[idx] = updated;
    renderPages();
    if (state.currentPageId === pageId) previewTitle.textContent = updated.name;
  } catch (e) { alert(e.message); }
}

async function deletePage(pageId) {
  if (!confirm('이 페이지를 삭제할까요?')) return;
  try {
    await api(`/api/pages/${pageId}`, { method: 'DELETE' });
    state.pages = state.pages.filter(p => p.id !== pageId);
    if (state.currentPageId === pageId) {
      state.currentPageId = null;
      showEmptyPreview();
    }
    renderPages();
    if (state.pages.length > 0 && !state.currentPageId) selectPage(state.pages[0].id);
  } catch (e) { alert(e.message); }
}

// ─── Menu (화면 트리 그룹) 관리 ──────────────────────────────────────────────

async function addMenu() {
  if (!state.currentProjectId) { alert('먼저 프로젝트를 선택하세요.'); return; }
  const name = prompt('새 메뉴 이름:');
  if (!name || !name.trim()) return;
  try {
    const menu = await api(`/api/projects/${state.currentProjectId}/menus`, {
      method: 'POST', body: JSON.stringify({ name: name.trim() })
    });
    state.menus.push(menu);
    renderPages();
  } catch (e) { alert(e.message); }
}

async function renameMenu(displayKey) {
  const isNone = displayKey === '__none__';
  const currentLabel = isNone ? '(미분류)' : displayKey;
  const newName = prompt('메뉴 이름:', isNone ? '' : displayKey);
  if (!newName || !newName.trim()) return;
  const trimmed = newName.trim();
  if (!isNone && trimmed === displayKey) return;

  try {
    if (isNone) {
      const existing = state.menus.find(m => m.name === trimmed);
      if (existing) {
        // 기존 메뉴와 이름이 같으면 → 그 메뉴에 merge (새 메뉴 생성 X)
        for (const pg of state.pages) {
          if (!pg.menu_name) {
            const updated = await api(`/api/pages/${pg.id}`, {
              method: 'PUT', body: JSON.stringify({ menu_name: trimmed })
            });
            const idx = state.pages.findIndex(p => p.id === pg.id);
            if (idx >= 0) state.pages[idx] = updated;
          }
        }
      } else {
        const menu = await api(`/api/projects/${state.currentProjectId}/menus`, {
          method: 'POST', body: JSON.stringify({ name: trimmed })
        });
        state.menus.push(menu);
        for (const pg of state.pages) {
          if (!pg.menu_name) {
            const updated = await api(`/api/pages/${pg.id}`, {
              method: 'PUT', body: JSON.stringify({ menu_name: trimmed })
            });
            const idx = state.pages.findIndex(p => p.id === pg.id);
            if (idx >= 0) state.pages[idx] = updated;
          }
        }
      }
    } else {
      const menuObj = state.menus.find(m => m.name === displayKey);
      if (menuObj) {
        const updated = await api(`/api/menus/${menuObj.id}`, {
          method: 'PUT', body: JSON.stringify({ name: trimmed })
        });
        const idx = state.menus.findIndex(m => m.id === menuObj.id);
        if (idx >= 0) state.menus[idx] = updated;
      }
      // 해당 메뉴의 페이지들 menu_name 동기화
      state.pages.forEach(pg => { if (pg.menu_name === displayKey) pg.menu_name = trimmed; });
    }
    renderPages();
  } catch (e) { alert(e.message); }
}

async function deleteMenu(menuName) {
  const pageCount = state.pages.filter(p => p.menu_name === menuName).length;
  const msg = pageCount > 0
    ? `'${menuName}' 메뉴를 삭제할까요?\n해당 ${pageCount}개 페이지는 '(미분류)'로 이동합니다.`
    : `'${menuName}' 메뉴를 삭제할까요?`;
  if (!confirm(msg)) return;
  const menuObj = state.menus.find(m => m.name === menuName);
  if (!menuObj) {
    // menus 테이블에 없는 경우 → 페이지들의 menu_name만 NULL 처리
    state.pages.forEach(pg => { if (pg.menu_name === menuName) pg.menu_name = null; });
    renderPages();
    return;
  }
  try {
    await api(`/api/menus/${menuObj.id}`, { method: 'DELETE' });
    state.menus = state.menus.filter(m => m.id !== menuObj.id);
    state.pages.forEach(pg => { if (pg.menu_name === menuName) pg.menu_name = null; });
    renderPages();
  } catch (e) { alert(e.message); }
}

async function movePage(pageId, direction) {
  try {
    const updated = await api(`/api/pages/${pageId}/move`, { method: 'PUT', body: JSON.stringify({ direction }) });
    state.pages = updated;
    renderPages();
  } catch (e) { alert(e.message); }
}

// ─── Preview ───────────────────────────────────────────────────────────────
function loadPreview() {
  const pg = state.pages.find(p => p.id === state.currentPageId);
  if (!pg) { showEmptyPreview(); return; }
  previewEmpty.style.display = 'none';
  previewFrame.style.display = 'block';
  if (pg.html_content && pg.html_content.trim()) {
    previewFrame.srcdoc = pg.html_content;
  } else {
    previewFrame.srcdoc = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#94a3b8;background:#f8fafc;">
      <p>HTML 시안이 없습니다.<br><small>나중에 Git 저장소에서 가져오거나 직접 편집하세요.</small></p></div>`;
  }
}

function showEmptyPreview() {
  previewFrame.style.display = 'none';
  previewFrame.srcdoc = '';
  previewEmpty.style.display = 'flex';
  previewTitle.textContent = '미리보기';
}

// ─── Right panel tabs ──────────────────────────────────────────────────────
function switchRightTab(name) {
  document.querySelectorAll('.right-tab').forEach(tab => {
    const active = tab.dataset.rightTab === name;
    tab.classList.toggle('active', active);
    tab.setAttribute('aria-selected', active ? 'true' : 'false');
  });
  ['description','comments','memos'].forEach(n => {
    const el = $(n === 'description' ? 'rightPaneDescription' : n === 'comments' ? 'rightPaneComments' : 'rightPaneMemos');
    if (el) el.hidden = (n !== name);
  });
  if (name === 'memos') loadMemos();
  const addBtn = $('addRightItemBtn');
  if (addBtn) {
    addBtn.style.display = name === 'memos' ? 'none' : '';
    addBtn.classList.toggle('btn-orange', name === 'comments');
  }
}

function onAddRightItem() {
  if (!$('rightPaneDescription').hidden) {
    toggleTagMode();
    return;
  }
  toggleCommentAddMode();
}

// ─── Comments (디스크립션 태그와 동일한 구조·행동) ────────────────────────────
// 저장값은 평문 규칙 그대로: <굵게>…</굵게> 마커 + 각 줄 앞의 "• " 접두어.
// 서버 저장/조회(app.py)는 이미 PUT/DELETE를 지원하므로 이쪽 렌더링만 맞춘다.
function toggleCommentAddMode() {
  state.commentAddMode = !state.commentAddMode;
  $('previewBody').classList.toggle('tag-add-mode', state.commentAddMode);
  document.documentElement.style.cursor = state.commentAddMode ? 'crosshair' : '';
  renderTagMarkers();
}

function createCommentAt(xPct, yPct) {
  const id = 'pending-' + Date.now();
  // 숨김(처리된) 코멘트까지 포함해 최대 번호를 계산해야 한다.
// state.comments만 보면 비숨김 코멘트가 없으면 1번부터 시작하는 버그가 생긴다.
const allComments = [...state.comments, ...(state.hiddenComments || [])];
const num = allComments.length ? Math.max(...allComments.map(c => c.comment_number)) + 1 : 1;
  state.comments.push({
    id,
    page_id: state.currentPageId,
    comment_number: num,
    author_name: currentUserName(),
    author_email: currentUserEmail(),
    content: '',
    x_pct: xPct,
    y_pct: yPct,
    created_at: new Date().toLocaleString(),
  });
  state.editingCommentId = id;
  state.commentAddMode = false;
  $('previewBody').classList.remove('tag-add-mode');
  document.documentElement.style.cursor = '';
  renderTagMarkers();
  renderComments();
}

function startCommentEdit(comment) {
  state.editingCommentId = comment.id;
  renderComments();
}

async function saveComment(item, c) {
  // contenteditable div(.tag-fmt-div)의 HTML을 평문 규칙(<굵게>…</굵게>, "• " 접두어)으로 변환.
  // exitFmtMode()와 동일한 노드 단위 walk 규칙을 쓴다 — 문자열 치환 방식은
  // "<굵게><b>" 이중 마커, "• •" 중복, 빈 <li> 잔존 같은 문제를 일으켰다.
  const fmtDiv = item.querySelector('.tag-fmt-div');
  let desc = '';
  if (fmtDiv) {
    // 빈 <b>/<strong>와 빈 <li>는 저장 전에 제거한다 — B/글머리 버튼을 눌러
    // 서식만 바꾼 뒤 내용을 쓰지 않으면 마커만 남는 걸 막기 위함.
    const doc = new DOMParser().parseFromString('<body>' + fmtDiv.innerHTML + '</body>', 'text/html');
    doc.body.querySelectorAll('b,strong').forEach(el => { if (!el.textContent.trim()) el.remove(); });
    doc.body.querySelectorAll('li').forEach(li => { if (!li.textContent.trim()) li.remove(); });
    const unescape = s => s.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
    let out = '';
    const isBoldEl = el => /^(B|STRONG)$/.test(el.tagName);
    const walk = (node, bold) => {
      for (const child of node.childNodes) {
        if (child.nodeType === 3) {
          if (/^\s+$/.test(child.textContent)) continue;
          out += unescape(child.textContent);
        } else if (child.nodeType !== 1) {
          continue;
        } else {
          const tag = child.tagName;
          // 멘션 칩: 저장 시에는 평문 "@이름" 으로만 남긴다 — 읽기 렌더(fmtToHtml)가
          // 전 팀원 이름 기준으로 파란색 강조 스팬을 다시 감싼다. 공백은 pickMentionUser 가
          // 칩 뒤에 별도 텍스트 노드로 넣었으므로 여기에서는 붙이지 않는다(이중 공백 방지).
          if (child.classList && child.classList.contains('mention-chip')) {
            out += '@' + (child.dataset.mention || (child.textContent || '').replace(/^@/, '').trim());
            continue;
          }
          // BR→'\n': 직전 문자가 이미 '\n'이면 생략 — <div>a<br></div><div>b</div> 구조에서
          // DIV 앞 '\n'과 직전 줄 말미 BR의 '\n'이 중복되어 a\n\n\nb 가 되던 근본 원인.
          // toFmtHtml()은 일반 줄 사이에 <br> 하나씩만 넣으므로 편집 라운드트립도 안전하다.
          if (tag === 'BR') { if (out && out[out.length - 1] !== '\n') out += '\n'; continue; }
          if (tag === 'LI') { out += '• '; walk(child, bold); out += '\n'; continue; }
          // 목록 컨테이너: 자식(li)을 순회한 뒤 닫힌 시점에 개행 — ul 뒤에 일반 텍스트가
          // 이어질 때 "• 줄\n다음줄"이 한 줄로 붙어 글머리가 사라지던 원인.
          if (tag === 'UL' || tag === 'OL') { walk(child, bold); continue; }
          if (isBoldEl(child)) {
            if (!bold) out += '<굵게>';
            walk(child, true);
            if (!bold) out += '</굵게>';
            continue;
          }
          // 블록(DIV/P): 앞쪽만 '\n'. 직전 문자가 이미 '\n'(직전 DIV의 BR 등)이면 생략해
          // DIV 경계 개행이 정확히 1개가 되도록 한다 — 엔터 1회=\n, 엔터 2회(빈 줄)=\n\n.
          // 빈 줄은 중간 DIV의 <br>가 '\n' 을 만들어 보존된다. UL/LI는 별도 규칙이다.
          if (tag === 'DIV' || tag === 'P') { if (!(out && out[out.length - 1] === '\n')) out += '\n'; walk(child, bold); continue; }
          walk(child, bold);
        }
      }
    };
    walk(doc.body, false);
    // UL 직후의 잔여 개행만 정리 — LI마다 이미 '\n' 을 넣으므로 UL 뒤에 일반 텍스트가
    // 이어질 때 "• 항목\n\n다음"이 되는 것을 방지. 사용자가 엔터 두 번으로 의도한
    // 빈 줄(\n\n)은 보존된다. (saveComment/exitFmtMode/fmtDivToPlain 3곳 동일 규칙)
    // UL 직후의 잔여 개행만 정리 — walk()에서 LI마다 이미 '\n' 을 넣고 DIV도 앞쪽 '\n' 을
    // 넣으므로 "• 항목\n\n다음"이 생길 수 있다. 사용자가 엔터 두 번으로 의도한 빈 줄(\n\n)은
    // 보존된다. (exitFmtMode/fmtDivToPlain 2곳과 동일 규칙)
    // 일반 텍스트 구간에서 연속 개행 3개 이상은 2개로 캐핑 — contenteditable에서
    // 엔터 1회라도 <div>a<br></div><div>b</div> 같은 구조가 생기면 DIV 앞 \n 과
    // 직전 줄 말미 BR의 \n 이 중복되어 a\n\n\nb 가 되고, 완성 카드(fmtToHtml)에서
    // 한 칸 더 늘어나 보이는 버그. 빈 줄(\n\n)은 그대로 둔다. (exitFmtMode/fmtDivToPlain 2곳과 동일 규칙)
    // 연속 개행 3개 이상은 2개로 캐핑 — DIV 앞 \n + 직전 줄 말미 BR의 \n 이 중복되어
    // 엔터 1회라도 \n\n\n 가 되는 것을 막는다. 빈 줄(\n\n)은 그대로 둔다.
    // [수정] \n{3,} 캐핑 제거 — 엔터 N회 = \n N개 보존 (fmtDivToPlain과 동일 규칙)
desc = out.replace(/[ \t]+\n/g, '\n').replace(/(•[^\n]*\n)\n+/g, '$1').replace(/^\n+/, '').replace(/\n$/, '');
  } else {
    const inputEl = item.querySelector('.tag-desc-input');
    // contenteditable <div>(.tag-fmt-div)는 .value 가 없으므로 innerText 로 읽어
    // 줄바꿈(\n)을 그대로 보존한다. 기존 textarea 경로(inputEl.value)도 동시 지원.
    desc = (inputEl && (inputEl.value ?? inputEl.innerText) || '').trim();
  }
  if (!desc) { alert('내용을 입력해 주세요.'); return; }

  // @명령 추출: "@이름" 패턴을 찾아 해당 팀원의 email/mention_name 을 매핑한다.
  let mentionName = '', mentionEmail = '';
  const atMatch = desc.match(/@([\uAC00-\uD7A3a-zA-Z0-9_]+)/);
  if (!atMatch) {
    alert('코멘트는 반드시 한 명을 대상으로 지정해야 합니다.\n예: "@팀원명 내용"');
    return;
  }
  const targetUser = state.users.find(u => u.name === atMatch[1]);
  if (!targetUser) {
    alert(`"@${atMatch[1]}"은(는) 팀원 목록에 없습니다. 다시 확인해 주세요.`);
    return;
  }
  mentionName = targetUser.name;
  mentionEmail = targetUser.email;

  if (c.id.startsWith('pending-')) {
    // 신규 코멘트: 로그인 상태 확인 후 생성
    if (!state.currentUser) { alert('로그인 후 작성할 수 있습니다.'); openAuthModal('login'); return; }
    try {
      const created = await api(`/api/pages/${state.currentPageId}/comments`, {
        method: 'POST', body: JSON.stringify({
          author_name: currentUserName(), email: currentUserEmail(), content: desc,
          mention_name: mentionName, mention_email: mentionEmail,
          x_pct: c.x_pct ?? undefined, y_pct: c.y_pct ?? undefined
        })
      });
      c.id = created.id;
      c.author_name = created.author_name;
      c.content = created.content;
      c.created_at = created.created_at;
      c.page_id = state.currentPageId;
      c.x_pct = created.x_pct ?? null;
      c.y_pct = created.y_pct ?? null;
      state.editingCommentId = null;
    } catch (e) { alert(e.message); return; }
  } else {
    try {
      // 서버는 id를 "c"+숫자 문자열로 반환하므로(경로는 int), 요청 시 숫자로 바꾼다.
      const cid = c.id.startsWith('c') ? Number(c.id.slice(1)) : c.id;
      const updated = await api(`/api/comments/${cid}`, {
        method: 'PUT', body: JSON.stringify({
          content: desc, email: currentUserEmail(),
          x_pct: c.x_pct ?? undefined, y_pct: c.y_pct ?? undefined
        })
      });
      c.content = updated.content;
      c.comment_number = updated.comment_number;
      c.x_pct = updated.x_pct ?? c.x_pct;
      c.y_pct = updated.y_pct ?? c.y_pct;
      state.editingCommentId = null;
    } catch (e) { alert(e.message); return; }
  }
  state.comments = [...state.comments].sort((a, b) =>
    (a.created_at + a.id).localeCompare(b.created_at + b.id) || a.id - b.id);
  state.comments.forEach((cc, i) => { cc.comment_number = i + 1; });
  state.lastCommentCount = state.comments.length;
  renderComments();
}

function cancelCommentEdit(item, c) {
  if (c.id.startsWith('pending-')) {
    state.comments = state.comments.filter(x => x.id !== c.id);
    state.comments.forEach((cc, i) => { cc.comment_number = i + 1; });
  }
  state.editingCommentId = null;
  // 캔버스의 번호 버튼(마커)도 함께 없애야 한다 — 마커 렌더링은 renderTagMarkers()가 담당.
  renderTagMarkers();
  renderComments();
}

async function deleteComment(id) {
  const c = state.comments.find(x => x.id === id);
  if (!c) return;
  if (id.startsWith('pending-')) { cancelCommentEdit(null, c); return; }
  if (!confirm('이 코멘트를 삭제할까요?')) return;
  try {
    // id는 "c"+숫자 문자열(경로에는 숫자만). pending 코멘트는 위에서 이미 return했다.
    const cid = String(id).startsWith('c') ? Number(String(id).slice(1)) : id;
    await api(`/api/comments/${cid}`, { method: 'DELETE', body: JSON.stringify({ email: currentUserEmail() }) });
    state.comments = state.comments.filter(x => x.id !== id);
    state.comments.forEach((cc, i) => { cc.comment_number = i + 1; });
    state.lastCommentCount = state.comments.length;
    renderTagMarkers();
    renderComments();
  } catch (e) { alert(e.message); }
}

// ─── Memos (메모 탭: 나만 보기 / 공개) ──────────────────────────────────────
let state_memos = [];

async function loadMemos() {
  if (!state.currentPageId) return;
  const params = state.currentUser ? `?email=${encodeURIComponent(state.currentUser.email)}` : '';
  try {
    state_memos = await api(`/api/pages/${state.currentPageId}/memos${params}`);
  } catch(e) { state_memos = []; }
  renderMemos();
}

function renderMemos() {
  const list = $('memosList');
  const countEl = $('memoCount');
  if (!list) return;
  if (countEl) countEl.textContent = String(state_memos.length);
  list.innerHTML = '';
  if (!state_memos.length) {
    const empty = document.createElement('div');
    empty.className = 'memo-empty';
    empty.textContent = '메모가 없습니다.';
    list.appendChild(empty);
    return;
  }
  state_memos.forEach(memo => {
    const item = document.createElement('div');
    item.className = 'memo-item' + (memo.is_private ? ' memo-item-private' : '');
    item.dataset.memoId = memo.id;

    const header = document.createElement('div');
    header.className = 'memo-header';
    const authorWrap = document.createElement('span');
    authorWrap.className = 'memo-author-wrap';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'memo-author';
    nameSpan.textContent = memo.author_name || '익명';
    authorWrap.appendChild(nameSpan);
    header.appendChild(authorWrap);

    if (memo.mine) {
      // 수정·삭제·공개 토글은 헤더 우측 액션 묶음으로 표시한다.
      const actions = document.createElement('span');
      actions.className = 'memo-actions';

      // 수정 버튼 — 디스크립션 코멘트의 연필 아이콘과 동일하게
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'icon-btn memo-edit-btn';
      editBtn.title = '수정';
      editBtn.innerHTML = '<svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.4 2.1l2.5 2.5L5.3 13.2l-3.3.9.9-3.3 8.5-8.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>';
      editBtn.addEventListener('click', () => openMemoEdit(item, memo));
      actions.appendChild(editBtn);

      // 삭제 버튼 — 디스크립션/페이지 목록의 휴지통 아이콘과 동일하게
      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'icon-btn memo-del-btn';
      delBtn.title = '삭제';
      delBtn.innerHTML = '<svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11 M6.5 4V2.5h3V4 M4 4l.8 9.5h6.4L12 4 M6.5 7v4 M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      delBtn.addEventListener('click', async () => {
        if (!confirm('이 메모를 삭제할까요?')) return;
        try {
          await api(`/api/memos/${memo.id}`, {
            method: 'DELETE',
            body: JSON.stringify({ email: currentUserEmail() })
          });
          await loadMemos();
        } catch(e) { alert('메모를 삭제하지 못했습니다.'); }
      });
      actions.appendChild(delBtn);

      // 공개 토글 스위치 (나만 보기 ↔ 공개)
      const toggleWrap = document.createElement('label');
      toggleWrap.className = 'memo-public-toggle';
      toggleWrap.title = memo.is_private ? '공개로 전환' : '나만 보기로 전환';

      const toggleInput = document.createElement('input');
      toggleInput.type = 'checkbox';
      toggleInput.className = 'memo-public-toggle-input';
      toggleInput.checked = !memo.is_private;
      toggleInput.setAttribute('aria-label', '공개 여부');

      const toggleTrack = document.createElement('span');
      toggleTrack.className = 'memo-public-toggle-track';
      const toggleKnob = document.createElement('span');
      toggleKnob.className = 'memo-public-toggle-knob';
      toggleTrack.appendChild(toggleKnob);

      const toggleText = document.createElement('span');
      toggleText.className = 'memo-public-toggle-text';
      toggleText.textContent = memo.is_private ? '비공개' : '공개';

      toggleInput.addEventListener('change', async () => {
        const newPrivate = !toggleInput.checked;
        try {
          await api(`/api/memos/${memo.id}`, {
            method: 'PUT',
            body: JSON.stringify({ email: currentUserEmail(), is_private: newPrivate })
          });
          await loadMemos();
        } catch(e) {
          alert('메모 모드를 변경하지 못했습니다.');
          toggleInput.checked = !newPrivate; // 실패 시 원래 상태로 되돌림
        }
      });

      toggleWrap.appendChild(toggleInput);
      toggleWrap.appendChild(toggleTrack);
      toggleWrap.appendChild(toggleText);
      actions.appendChild(toggleWrap);

      header.appendChild(actions);
    } else {
      if (memo.is_private) {
        const lockIcon = document.createElement('span');
        lockIcon.className = 'memo-lock-icon';
        lockIcon.textContent = '🔒';
        header.appendChild(lockIcon);
      }
    }
    item.appendChild(header);

    const body = document.createElement('div');
    body.className = 'memo-body';
    body.textContent = memo.content;
    item.appendChild(body);

    list.appendChild(item);
  });
}

// 연필 클릭 → 본문 텍스트를 contenteditable로 교체해 인라인 편집
function openMemoEdit(item, memo) {
  const body = item.querySelector('.memo-body');
  if (!body) return;
  const original = body.textContent;

  const editDiv = document.createElement('div');
  editDiv.className = 'desc-comment-edit-area memo-edit-area';
  editDiv.contentEditable = 'true';
  editDiv.textContent = original;
  body.replaceWith(editDiv);
  editDiv.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editDiv);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);

  const actions = document.createElement('div');
  actions.className = 'memo-edit-actions';
  actions.innerHTML = `
    <button type="button" class="btn btn-xs btn-primary memo-edit-save-btn">저장</button>
    <button type="button" class="btn btn-xs btn-outline memo-edit-cancel-btn">취소</button>`;
  editDiv.after(actions);

  let done = false;
  function finish(save) {
    if (done) return; done = true;
    const value = editDiv.innerText.trim();
    if (save && value && value !== original) {
      api(`/api/memos/${memo.id}`, {
        method: 'PUT',
        body: JSON.stringify({ email: state.currentUser.email, content: value })
      }).then(() => loadMemos()).catch(e => alert('메모를 수정하지 못했습니다.'));
    } else {
      renderMemos(); // 변경 없거나 취소 → 원래대로 복원
    }
  }
  actions.querySelector('.memo-edit-save-btn').addEventListener('click', () => finish(true));
  actions.querySelector('.memo-edit-cancel-btn').addEventListener('click', () => finish(false));
  editDiv.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
}

function saveMemo() {
  const input = $('memoInput');
  if (!input || !state.currentPageId || !state.currentUser) return;
  const content = input.value.trim();
  if (!content) { alert('메모 내용을 입력해 주세요.'); return; }
  api(`/api/pages/${state.currentPageId}/memos`, {
    method: 'POST',
    body: JSON.stringify({
      name: state.currentUser.name,
      email: state.currentUser.email,
      content,
      is_private: 0
    })
  }).then(() => {
    input.value = '';
    return loadMemos();
  }).catch(e => alert('메모를 저장하지 못했습니다.'));
}

async function loadComments() {
  if (!state.currentPageId) return;
  try {
    // include_hidden=1: 숨김 처리된 코멘트까지 받아와 '처리된 코멘트 보기' 링크에 쓴다.
    const all = await api(`/api/pages/${state.currentPageId}/comments?include_hidden=1`);
    state.comments = all.filter(c => !c.hidden);
    state.hiddenComments = all.filter(c => c.hidden);
    state.lastCommentCount = state.comments.length;
    renderComments();
  } catch (e) { /* ignore */ }
}

function renderComments() {
  const comments = state.comments;
  const hiddenComments = state.hiddenComments || [];
  commentsList.innerHTML = '';
  comments.forEach(c => {
    const isPending = c.id.startsWith('pending-');
    const isEditing = c.id === state.editingCommentId;
    const readOnly = !isPending && !isEditing;
    // 작성자 여부: author_email이 비어 있으면(기존 데이터) 누구나, 아니면 본인만
    const isMine = !c.author_email || (state.currentUser && c.author_email === state.currentUser.email);

    const escHtml = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // NOTE: 함수 스코프 fmtDiv 는 제거됨 — 전역 let fmtDiv(파일 하단, fmtToggleBullet 직전)와
    // 단일 소스로 통일했다. 이전엔 둘이 동시에 존재해 enterFmtMode 가 쓰는 것과
    // 1817줄 전역 호출부가 보는 것이 다른 변수였다.

    const item = document.createElement('div');
    item.className = 'tag-list-item comment-list-item' + (readOnly ? ' tag-readonly' : '');
    item.dataset.commentId = c.id;
    item.addEventListener('mouseenter', () => highlightCommentMarker(c.id, true));
    item.addEventListener('mouseleave', () => highlightCommentMarker(c.id, false));
    // 디스크립션 태그와 동일하게: 첫 줄에 작성자명·작성 시각을 표시한다.
    // 수정/삭제 버튼도 디스크립션과 마찬가지로 이 메타 라인 우측 끝에 둔다.
    const authorDisplay = c.author_name || '';
    const createdDisplay = c.created_at ? String(c.created_at).replace('T', ' ').slice(0, 16) : '';
    // 체크박스 권한: 작성자와 @대상(mention_email) 단 두 명만 체크 가능
    const canHide = (() => {
      if (isPending || isEditing) return false;
      if (!c.mention_email) {
        // 기존 데이터(대상이 없는 코멘트): author_email이 있으면 작성자만, 없으면 누구나
        return !c.author_email || c.author_email === currentUserEmail();
      }
      return [c.author_email, c.mention_email].includes(currentUserEmail());
    })();
    const hideChkHtml = canHide
      ? `<button type="button" class="desc-comment-check comment-hide-btn${c.hidden ? ' is-checked' : ''}" data-comment-hide="${c.id}" role="checkbox" aria-checked="${c.hidden}" title="${c.hidden ? '다시 표시' : '해결 완료'}"><svg viewBox="0 0 12 10" width="34" height="28" aria-hidden="true"><path d="M1.5 5.2 L4.3 8 L10.5 1.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
      : '';
    const editDelIcons = (!isPending && !isEditing && isMine)
      ? `<span class="tag-meta-actions">
          <button type="button" class="icon-btn tag-edit-btn" data-tag-action="edit" title="수정"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.4 2.1l2.5 2.5L5.3 13.2l-3.3.9.9-3.3 8.5-8.7z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
          <button type="button" class="icon-btn tag-del-btn" data-tag-action="del" title="삭제"><svg class="ic" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11 M6.5 4V2.5h3V4 M4 4l.8 9.5h6.4L12 4 M6.5 7v4 M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          ${hideChkHtml}
        </span>`
      : (canHide ? `<span class="tag-meta-actions">${hideChkHtml}</span>` : '');
    const descMeta = (authorDisplay || createdDisplay || editDelIcons)
      ? `<div class="tag-meta"><span class="tag-author">${escHtml(authorDisplay)}</span>${createdDisplay ? `<span class="tag-created-at">${escHtml(createdDisplay)}</span>` : ''}${editDelIcons}</div>`
      : '';
    // @대상은 본문 멘션 강조로만 표시한다. 메타 라인에는 작성자·시각만 둔다.
    // 번호 배지 열 — 디스크립션 카드(renderTagList)와 동일한 .tag-num-col/.tag-num-badge 구조를
    // 그대로 써야 카드 좌측에 원형 숫자 배지가 렌더링된다. 코멘트 카드는 flex(row) 컨테이너라
    // grid-template-columns 없이도 30px 열 + col-gap 8px 이 동일하게 적용된다.
    // 서버가 표시 순서대로 부여한 번호 — app.py list_comments의 d["comment_number"] (1부터).
    const commentNum = c.comment_number;
    // 번호 배지: 서버가 항상 1부터 부여하므로 comment_number는 항상 존재한다.
    // 디스크립션 카드(renderTagList)와 달리 조건부로 렌더링하면 데이터가 없거나
    // API 응답 지연 시 '번호 버튼이 사라진' 상태가 화면에 그대로 노출되므로
    // fallback(순서 index 기반)을 두어 어떤 경우에도 좌측 배지가 항상 그려진다.
    const badgeNum = c.comment_number || (state.comments.indexOf(c) + 1);
    item.innerHTML = `
      <div class="tag-num-col"><span class="tag-num-badge">${escHtml(badgeNum)}</span></div>
      ${readOnly
        ? `<div class="tag-desc-text">${descMeta}<span class="tag-desc-inner">${fmtToHtml(c.content, c.mention_name)}</span></div>`
        : `<div class="tag-desc-wrap">${descMeta}<div class="tag-desc-input tag-fmt-div" contenteditable="true" data-placeholder="@로 팀원을 멘션하세요">${toFmtHtml(c.content)}</div></div>`}
      <div class="tag-actions">
        ${!readOnly
          ? `<button type="button" class="tag-fmt-btn tag-bold-btn" title="굵게"><b>B</b></button>
             <button type="button" class="tag-fmt-btn tag-bullet-btn" title="글머리 기호">•</button>`
          : ''}
        <span class="tag-actions-right">
        ${isPending
          ? `<button type="button" class="btn btn-sm btn-primary tag-save-btn">저장</button>
             <button type="button" class="btn btn-sm btn-outline tag-cancel-btn">취소</button>`
          : isEditing
            ? `<button type="button" class="btn btn-sm btn-primary tag-save-btn">저장</button>
               <button type="button" class="btn btn-sm btn-outline tag-cancel-btn">취소</button>`
            : ''}
        </span>
      </div>`;

    if (!readOnly) {
      const div = item.querySelector('.tag-fmt-div');
      if (div) {
        // ── B·글머리 버튼: 디스크립션 태그(1545~1599줄)와 동일한 방식으로 동작시킨다.
        // 기존에 DOM만 만들어져 있고 리스너가 없어 "작동하지 않는" 상태였다.
        const boldBtn = item.querySelector('.tag-bold-btn');
        const bulletBtn = item.querySelector('.tag-bullet-btn');
        // 셀렉션이 div 안에 있는 element를 반환 — commonAncestorContainer만 보면
        // 사용자가 인접한 공백 텍스트 노드 사이에 커서를 놓았을 때에도 그 노드가
        // div 안이라 "div 안 선택"으로 오인할 수 있다. 실제 시작·끝 양쪽 노드(텍스트면
        // parentElement)가 모두 div 안에 있을 때만 선택을 인정한다.
        function fmtElInRange(sel) {
          if (!sel || !sel.rangeCount) return null;
          const r = sel.getRangeAt(0);
          const nodeIn = n => {
            if (!n || n.nodeType !== 1) return null;
            return div.contains(n) ? n : null;
          };
          const startEl = nodeIn(r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement);
          const endEl = nodeIn(r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement);
          if (!startEl || !endEl) return null;
          return startEl === endEl ? startEl : (r.commonAncestorContainer.nodeType === 1 && div.contains(r.commonAncestorContainer)) ? r.commonAncestorContainer : null;
        }
        function updateCommentFmtStates() {
          let bOn = false, uOn = false;
          const sel = window.getSelection();
          const inEl = fmtElInRange(sel);
          if (inEl) {
            try { bOn = document.queryCommandState('bold'); } catch (err) {}
            uOn = !!inEl.closest('li');
          }
          if (boldBtn) boldBtn.classList.toggle('fmt-active', bOn);
          if (bulletBtn) bulletBtn.classList.toggle('fmt-active', uOn);
        }
        // "사용자가 실제로 div 안에서 선택했다"는 판정 — 시작/끝 양쪽 경계 노드가 모두
        // div 안에 있어야 한다. commonAncestorContainer만 보면 인접 공백 텍스트 노드 사이에
        // 커서가 있어도 "div 안"으로 오인하고 기존 선택을 버려버리는 게 이번 버그의 원인.
        function hasRealSelectionInDiv(s3) {
          if (!s3 || !s3.rangeCount || s3.isCollapsed) return false;
          const rg = s3.getRangeAt(0);
          const elOf = n => (n && n.nodeType === 1 ? n : n && n.parentElement);
          const inD = el => !!(el && div.contains(el));
          return inD(elOf(rg.startContainer)) && inD(elOf(rg.endContainer));
        }
        // 글머리 목록이 적용된 상태에서 엔터: 같은 <li> 안에 <div>로 줄바꿈이 생길 수 있다.
        // 새 <li>로 분리하면 "해제 전까지" 다음 줄에도 글머리가 유지된다.
        // 이 키다운 핸들러가 없으면 브라우저 기본 동작(BR 삽입)으로 인해 DOM 구조가
        // 변형되어 저장 시 평문 변환(walk)에서 줄바꿈이 유실되는 버그가 발생한다.
        div.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          const s4 = window.getSelection();
          if (!s4.rangeCount) return;
          const node = s4.anchorNode;
          const el3 = node && node.nodeType === 1 ? node : node && node.parentElement;
          const li = el3 && el3.closest ? el3.closest('li') : null;
          // ── <li> 안에 있을 때: 새 <li> 생성 (기존 로직 유지) ────────────────────
          if (li) {
            e.preventDefault();
            const rg = s4.getRangeAt(0);
            const sN = rg.startContainer;
            const oFf = rg.startOffset;
            let after = '';
            if (sN && sN.nodeType === 3) after = sN.textContent.slice(oFf);
            const newLi = document.createElement('li');
            if (after) newLi.appendChild(document.createTextNode(after));
            else newLi.innerHTML = '<br>';
            li.parentNode.insertBefore(newLi, li.nextSibling);
            const r2 = document.createRange();
            r2.setStart(newLi.firstChild, 0);
            r2.collapse(true);
            s4.removeAllRanges();
            s4.addRange(r2);
            return;
          }
          // ── <li> 밖에 있을 때: insertLineBreak 네이티브 처리로 위임 ─────────────
          // [수정] 자작 BR + 커서 배치 방식은 한글 IME commit 이 여러 input 이벤트로
          //   나눠 들어오면 새 입력이 앞쪽 text node에 다시 들어가 BR을 덮어쓰는 문제.
          //   execCommand('insertLineBreak')는 커서를 어디에 놓든 정확히 처리한다.
          e.preventDefault();
          if (!document.execCommand('insertLineBreak')) {
            const range = s4.getRangeAt(0);
            range.deleteContents();
            range.insertNode(document.createElement('br'));
          }
        });
        // 실행 후 공통 처리: 선택 범위가 div 안에 있으면 그대로 쓰고, 아니면 마지막 단어/전체 선택
        function ensureSelectionInDiv() {
          const s3 = window.getSelection();
          let hasSel = hasRealSelectionInDiv(s3);
          if (!hasSel) {
            // 글머리 기호는 "밑줄 친 문장(커서所在 줄)"에만 적용되어야 한다 —
            // div 전체를 묶으면 insertUnorderedList가 전문을 ul로 바꿔버린다.
            //   • 커서가 이미 <li> 안이면: 그 li 하나만
            //   • 커서가 일반 텍스트 노드에 있으면: 그 텍스트 노드(한 줄)만
            //   • 커서를 특정할 수 없는 경우: 첫 번째 텍스트 노드만 (전체 아님)
            const rg = document.createRange();
            const anchor = s3 && s3.rangeCount ? s3.anchorNode : null;
            let picked = false;
            if (anchor) {
              const ancEl = anchor.nodeType === 1 ? anchor : anchor.parentElement;
              const curLi = ancEl && ancEl.closest ? ancEl.closest('li') : null;
              if (curLi && div.contains(curLi)) {
                rg.selectNodeContents(curLi);
                picked = true;
              } else if (anchor.nodeType === Node.TEXT_NODE && div.contains(anchor) && anchor.textContent.trim()) {
                rg.setStart(anchor, 0);
                rg.setEnd(anchor, anchor.textContent.length);
                picked = true;
              }
            }
            if (!picked) {
              // 마지막 수단: div 안의 첫 번째 텍스트 노드만.
              const walker = div.ownerDocument.createTreeWalker(div, window.NodeFilter ? NodeFilter.SHOW_TEXT : 4);
              let t;
              while ((t = walker.nextNode())) {
                if (t.textContent.trim()) {
                  rg.setStart(t, 0);
                  rg.setEnd(t, t.textContent.length);
                  picked = true;
                  break;
                }
              }
            }
            if (picked && rg.startContainer) {
              s3.removeAllRanges();
              s3.addRange(rg);
            }
          }
        }
        // ── BR 앞 text node 병합 방지 (MutationObserver fixup) ──────────────
        // Chrome contenteditable + sendInputEvents(한글 문자 단위)에서 Enter 후
        // 다음 문자가 BR 뒤 대신 앞쪽 text node에 삽입되는 문제를 감지·수정한다.
        // enter_test16.py A/C 시나리오로 검증됨: '첫째<br>둘째<br>셋째' PASS.
        (function setupBrMergeFix(div) {
          const prevLens = new Map();
          function snapshot() {
            for (let i = 0; i < div.childNodes.length; i++) {
              const n = div.childNodes[i];
              if (n.nodeType === 3) prevLens.set(n, n.textContent.length);
            }
          }
          snapshot();
          const observer = new MutationObserver((mutations) => {
            for (const m of mutations) {
              if (m.type !== 'characterData') continue;
              const node = m.target;
              if (node.nodeType !== 3 || !div.contains(node)) continue;
              const prevLen = prevLens.has(node) ? prevLens.get(node) : node.textContent.length;
              const curLen = node.textContent.length;
              if (curLen > prevLen) {
                let sibling = node.nextSibling;
                while (sibling) {
                  if (sibling.nodeType === 1 && sibling.tagName === 'BR') {
                    const addedText = node.textContent.substring(prevLen);
                    node.textContent = node.textContent.substring(0, prevLen);
                    let afterBr = sibling.nextSibling;
                    if (afterBr && afterBr.nodeType === 3) {
                      afterBr.textContent = addedText + afterBr.textContent;
                    } else {
                      const newText = document.createTextNode(addedText);
                      sibling.parentNode.insertBefore(newText, sibling.nextSibling);
                    }
                    try {
                      const sel = window.getSelection();
                      if (sel.rangeCount) {
                        const r = document.createRange();
                        const targetNode = (afterBr && afterBr.nodeType === 3) ? afterBr : sibling.nextSibling;
                        r.setStart(targetNode, addedText.length);
                        r.collapse(true);
                        sel.removeAllRanges();
                        sel.addRange(r);
                      }
                    } catch (err) {}
                    break;
                  }
                  if (sibling.nodeType === 3 && !sibling.textContent.trim()) {
                    sibling = sibling.nextSibling;
                    continue;
                  }
                  break;
                }
              }
              prevLens.set(node, node.textContent.length);
            }
          });
          observer.observe(div, {childList: true, characterData: true, subtree: true});
        })(div);

        if (boldBtn) boldBtn.addEventListener('click', () => {
          // 커서 기준 선택: 일반 텍스트 줄이면 그 텍스트 노드(한 줄)만, <li> 안이면
          // 그 li 하나만. 전문을 묶으면 execCommand이 전문 전체에 적용된다.
          const sB = window.getSelection();
          const hasSelB = hasRealSelectionInDiv(sB);
          if (!hasSelB) {
            const rgB = document.createRange();
            const anchorB = sB && sB.rangeCount ? sB.anchorNode : null;
            let pickedB = false;
            if (anchorB) {
              const ancElB = anchorB.nodeType === 1 ? anchorB : anchorB.parentElement;
              const curLiB = ancElB && ancElB.closest ? ancElB.closest('li') : null;
              if (curLiB && div.contains(curLiB)) {
                rgB.selectNodeContents(curLiB);
                pickedB = true;
              } else if (anchorB.nodeType === Node.TEXT_NODE && div.contains(anchorB) && anchorB.textContent.trim()) {
                rgB.setStart(anchorB, 0);
                rgB.setEnd(anchorB, anchorB.textContent.length);
                pickedB = true;
              }
            }
            if (!pickedB) {
              const walkerB = div.ownerDocument.createTreeWalker(div, window.NodeFilter ? NodeFilter.SHOW_TEXT : 4);
              let tB;
              while ((tB = walkerB.nextNode())) {
                if (tB.textContent.trim()) {
                  rgB.setStart(tB, 0);
                  rgB.setEnd(tB, tB.textContent.length);
                  pickedB = true;
                  break;
                }
              }
            }
            if (pickedB && rgB.startContainer) {
              sB.removeAllRanges();
              sB.addRange(rgB);
            }
          }
          document.execCommand('bold');
          autoResizeElGlobal(div);
          updateCommentFmtStates();
        });
        if (bulletBtn) bulletBtn.addEventListener('click', e => {
          e.preventDefault();
          // 버그 픽스: 버튼 클릭 시 selection 이 div 밖으로 이미 이탈해 있으면
          // fmtToggleBullet 안에서 ci=null 이 되어 fallback 이 잘못된(빈) 줄을 고른다.
          // click 의 target 이 div 내부일 때만 그대로 두고, 아니면 div 끝 텍스트에
          // collapsed range 를 재세팅해 준다.
          const sNow = window.getSelection();
          const inDiv = sNow && sNow.rangeCount && (() => {
            const an = sNow.anchorNode;
            return !!(an && (an === div || div.contains(an)));
          })();
          if (!inDiv) {
            div.focus();
            const r = document.createRange();
            r.selectNodeContents(div);
            r.collapse(false);
            const s2 = window.getSelection();
            s2.removeAllRanges();
            s2.addRange(r);
          }
          // 커서가 있는 "한 줄"만 불릿 토글 — execCommand 대신 DOM 조작 헬퍼 사용.
          fmtToggleBullet(div);
          autoResizeElGlobal(div);
          updateCommentFmtStates();
        });
        // 글머리 목록 안에서 엔터 → 같은 <li>의 <div> 줄바꿈 대신 새 <li> 생성
        div.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          const s4 = window.getSelection();
          if (!s4.rangeCount) return;
          const node = s4.anchorNode;
          const el3 = node && node.nodeType === 1 ? node : node && node.parentElement;
          const li = el3 && el3.closest ? el3.closest('li') : null;
          if (!li) return;
          const off = s4.getRangeAt(0).startOffset;
          let before = '', after = '';
          for (const c of li.childNodes) {
            if (c === node) { before += c.textContent.slice(0, off); after += c.textContent.slice(off); break; }
            before += c.textContent;
          }
          const newLi = document.createElement('li');
          if (after) newLi.appendChild(document.createTextNode(after));
          else newLi.innerHTML = '<br>';
          li.parentNode.insertBefore(newLi, li.nextSibling);
          const r2 = document.createRange();
          r2.setStart(newLi.firstChild, 0);
          r2.collapse(true);
          s4.removeAllRanges();
          s4.addRange(r2);
          e.preventDefault();
        });
        requestAnimationFrame(() => autoResizeElGlobal(div));
        // item._updateFmt: 이 항목의 updateCommentFmtStates 클로저(1084~1112줄).
        // renderComments가 재실행되면 DOM이 다시 그려져 리스너도 새 item으로 다시 바인딩된다.
        item._updateFmt = () => updateCommentFmtStates();
        div.addEventListener('input', () => { autoResizeElGlobal(div); updateFmtBtnStatesGlobal(item); });
        div.addEventListener('paste', () => requestAnimationFrame(() => { autoResizeElGlobal(div); updateFmtBtnStatesGlobal(item); }));
        document.addEventListener('selectionchange', () => updateFmtBtnStatesGlobal(item));
        div.focus();
        const range = document.createRange();
        range.selectNodeContents(div);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        fmtDiv = div;
      }
    }

    const saveBtn = item.querySelector('.tag-save-btn');
    if (saveBtn) saveBtn.addEventListener('click', () => saveComment(item, c));
    const cancelBtn = item.querySelector('.tag-cancel-btn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => cancelCommentEdit(item, c));
    const editBtn = item.querySelector('.tag-edit-btn');
    if (editBtn) editBtn.addEventListener('click', () => startCommentEdit(c));
    const delBtn = item.querySelector('.tag-del-btn');
    if (delBtn) delBtn.addEventListener('click', () => deleteComment(c.id));
    // 숨김 처리 체크박스 변경 → toggle-hidden API 호출
    const hideBtn = item.querySelector('[data-comment-hide]');
    if (hideBtn) hideBtn.addEventListener('click', async () => {
      let nextHidden = !c.hidden;
      try {
        const cidNum = String(c.id).replace(/^c/i, '');
        await api(`/api/comments/${cidNum}/toggle-hidden`, { method: 'POST', body: JSON.stringify({ email: currentUserEmail() }) });
        c.hidden = nextHidden;
        hideBtn.classList.toggle('is-checked', nextHidden);
        hideBtn.setAttribute('aria-checked', String(nextHidden));
        hideBtn.title = nextHidden ? '다시 표시' : '해결 완료';
        if (!nextHidden) {
          state.comments = state.comments.filter(x => x.id !== c.id);
          state.hiddenComments.push(c);
        } else {
          state.hiddenComments = state.hiddenComments.filter(x => x.id !== c.id);
          state.comments.push(c);
        }
        await loadComments();
        // 처리할 작업(알림) 목록·뱃지를 즉시 갱신 — 폴링 대기 없이 반영
        pollNotifCount(); loadNotifList();
      } catch (err) {
        alert(err.message || '표시 전환에 실패했습니다.');
      }
    });
    commentsList.appendChild(item);
  });
  if (hiddenComments.length > 0) {
    const showHidden = state.showHiddenComments;
    const hiddenLink = document.createElement('a');
    hiddenLink.href = '#';
    hiddenLink.className = 'desc-comments-view-link comment-hidden-toggle';
    hiddenLink.textContent = showHidden ? `처리된 코멘트 접기 (${hiddenComments.length})` : `처리된 코멘트 보기 (${hiddenComments.length})`;
    hiddenLink.addEventListener('click', (e) => {
      e.preventDefault();
      state.showHiddenComments = !state.showHiddenComments;
      renderComments();
    });
    commentsList.appendChild(hiddenLink);
    if (showHidden) {
      hiddenComments.forEach(hc => {
        const escHtmlH = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const hItem = document.createElement('div');
        hItem.className = 'tag-list-item comment-list-item tag-readonly comment-hidden-item';
        hItem.dataset.commentId = hc.id;
        const hAuthor = hc.author_name || '';
        const hCreated = hc.created_at ? String(hc.created_at).replace('T', ' ').slice(0, 16) : '';
        // 체크박스 권한: 활성 코멘트와 동일하게 작성자와 @대상(mention_email) 단 두 명만 체크 가능
        const hCanHide = (() => {
          if (!hc.mention_email) {
            return !hc.author_email || hc.author_email === currentUserEmail();
          }
          return [hc.author_email, hc.mention_email].includes(currentUserEmail());
        })();
        const hChkHtml = hCanHide
          ? `<button type="button" class="desc-comment-check comment-hide-btn is-checked" data-comment-hide="${hc.id}" role="checkbox" aria-checked="true" title="다시 표시"><svg viewBox="0 0 12 10" width="34" height="28" aria-hidden="true"><path d="M1.5 5.2 L4.3 8 L10.5 1.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`
          : '';
        const hMeta = (hAuthor || hCreated || hChkHtml)
          ? `<div class="tag-meta"><span class="tag-author">${escHtmlH(hAuthor)}</span>${hCreated ? `<span class="tag-created-at">${escHtmlH(hCreated)}</span>` : ''}${hChkHtml ? `<span class="tag-meta-actions">${hChkHtml}</span>` : ''}</div>`
          : '';
        // 활성 코멘트와 동일하게 좌측에 번호 배지 표시 (서버가 부여한 comment_number)
        const hNumCol = hc.comment_number ? `<div class="tag-num-col"><span class="tag-num-badge">${escHtmlH(hc.comment_number)}</span></div>` : '';
