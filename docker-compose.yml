services:
  ai-service:
    build:
      context: ./ai-service
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: local-dev-secret-change-me-0123456789abcdef
      AI_SERVICE_ENABLED: "true"
      AI_SERVICE_BASE_URL: http://ai-service:8090
    depends_on:
      ai-service:
        condition: service_healthy
